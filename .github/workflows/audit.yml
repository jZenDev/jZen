# The dependency vulnerability gate (ADR-034), wired to actually run. `task audit` asks a
# REMOTE service (api.osv.dev, npm's advisory database) a question that changes when nothing in
# this repository changed, so it stands in its own workflow rather than as a ci.yml job: a
# third-party advisory published overnight must not block an unrelated pull request the way a
# red ci.yml would. See STANDARDS "Orchestration" and DECISIONS.md ADR-034.
name: Audit

on:
  schedule:
    # Weekly, arbitrary day/time chosen to be off-peak for GitHub's scheduler. Due-ness here is
    # "did a new advisory land since last week", not a deadline, so a missed tick costs nothing
    # a re-run doesn't fix.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Node (pinned by .nvmrc) + pnpm via corepack
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python (floor, see STANDARDS "Scripting")
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: task audit
        run: task audit
