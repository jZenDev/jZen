# jZen CI — enforces the gates the docs have always said to wire in (STANDARDS "Code generation",
# ROADMAP). It runs the SAME `task` targets a developer runs, never a reimplementation.
#
# Deliberately NOT here, and why:
#   - build:server:native / test:native — the native build is slow and stays LOCAL (the developer's
#     "long build before deploy"); CI on shared runners is the wrong place for it, and prod ships
#     from a local build. The JVM tests below cover the code; native-only faults are caught by
#     test:native locally and verify:deploy against the real service.
#   - deploy:cloudrun — deploy is manual, by a person. CI verifies; it never ships.
#   - verify:deploy — it asserts a LIVE environment (including that the native return address is
#     configured), so it belongs after a deploy, not before a merge.
#   - the macOS and iOS runners — they need Xcode, so they would need a `macos-latest` runner at
#     several times the Linux rate. A cost decision, not an oversight; `build:apps:runners` covers
#     them locally and announces the skip here rather than passing silently.
#
# Toolchain is pinned to match `task doctor` (.fvmrc / .nvmrc / packageManager / .sdkmanrc). JDK is
# Temurin rather than GraalVM: only the native build needs GraalVM, and that is not run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Contract drift, docs drift, the Dart/Flutter libraries, and the admin typecheck. Needs the full
  # toolchain because sync:contracts regenerates across all three languages.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Flutter 3.44.2 (brings Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - name: Node (pinned by .nvmrc) + pnpm via corepack
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      # sync:contracts generates the Dart messages with protoc + protoc-gen-dart. Pin protoc_plugin
      # to the version that produced the committed .pb.dart (25.0.0), or the drift gate false-fails
      # on codegen-format differences. (Java DTOs and the admin schema are hermetic — Maven and pnpm
      # resolve their own tools — so only the Dart path needs a system protoc here.)
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: dart pub global activate protoc_plugin 25.0.0
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The scripting runtime beside sh (DECISIONS.md ADR-032). verify:boundaries and verify:docs
      # below are the two gates whose bodies move into scripts/*.py, so this job executes Python
      # even though no other job does. Floored, not pinned, exactly as `task doctor` checks it:
      # 3.9 is the floor these scripts are written to, so CI runs the oldest thing they support
      # rather than the newest, and an incompatibility surfaces here instead of on a contributor's
      # Mac carrying only Xcode's 3.9.6. ubuntu-latest ships a newer python3 that would otherwise
      # be picked up implicitly — declaring it is what keeps CI from drifting off the floor.
      - name: Python (floor, see STANDARDS "Scripting")
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # First because it is the cheapest thing here and the only one that catches a defect no test
      # can: a client package calling the identity provider directly still authenticates, still
      # renders, and still passes every suite. See STANDARDS "The client talks to one server".
      - name: Client/server boundary gate
        run: task verify:boundaries

      - run: task deps
      - name: Contract drift gate
        run: task sync:contracts
      - name: Docs drift gate
        run: task verify:docs
      - run: task test:client
      - run: task test:admin

      # Compiling the web bundle IS a gate, not a build step. No test compiles it, so a Flutter
      # dependency whose web implementation is not Wasm-clean leaves every suite green and the web
      # app unbuildable — which is exactly how it went once, discovered by a deploy (ADR-024).
      # WEB_API_URL is a placeholder: the artifact is thrown away, and pinning a real environment
      # would put an environment fact in the repo (STANDARDS "Deployment model").
      - name: Web bundle compiles (WebAssembly)
        run: WEB_API_URL=https://ci.invalid task build:web

  # The Android runner. Its own job so a Gradle/manifest fault is reported as itself rather than
  # buried in the gates job, and so it runs in parallel.
  #
  # ANDROID ONLY, and the gap is deliberate. `build:apps:runners` builds macOS and the iOS
  # simulator too, but both need Xcode, so on Linux they are skipped — announced, never silently.
  # Covering them would mean a `macos-latest` runner, which bills at several times the Linux rate;
  # that is a cost decision, not an oversight, and it is the same reasoning that keeps prod on one
  # Cloud Run instance. Until it is taken, Apple runners are covered by `task build` locally.
  android-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Temurin, not GraalVM: AGP's jdkImage transform shells out to jlink, which GraalVM's cannot
      # run at any version. Same constraint `run:demo:native` checks for on a developer's machine.
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build:apps:runners

  # The backend @QuarkusTest suite. Uses Quarkus Dev Services, which starts Postgres in Docker —
  # available on ubuntu-latest by default, so no extra service setup.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:apps:server

  # The end-to-end release gate: boots real Supabase + Quarkus and runs zen_demo's integration
  # suite with no mocks. The heaviest job and the one most likely to need iteration on first run
  # (Supabase CLI start, ports); if it is flaky in CI, that is a setup issue to fix here, not a
  # reason to drop the gate the docs call the release gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - name: Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:e2e
