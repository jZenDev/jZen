# jZen CI — enforces the gates the docs have always said to wire in (STANDARDS "Code generation",
# ROADMAP). It runs the SAME `task` targets a developer runs, never a reimplementation.
#
# Deliberately NOT here, and why:
#   - build:server:native / test:native — the native build is slow and stays LOCAL (the developer's
#     "long build before deploy"); CI on shared runners is the wrong place for it, and prod ships
#     from a local build. The JVM tests below cover the code; native-only faults are caught by
#     test:native locally and verify:deploy against the real service.
#   - deploy:cloudrun — deploy is manual, by a person. CI verifies; it never ships.
#   - verify:deploy — it asserts a LIVE environment (including that the native return address is
#     configured), so it belongs after a deploy, not before a merge.
#   - macOS/iOS were excluded here on cost grounds (ADR-045) until ADR-052: `jZenDev/jZen` is a
#     public repository, and GitHub Actions on public repos runs `macos-latest` jobs without the
#     private-repo minutes multiplier ADR-045 was reasoning about, so the cost objection does not
#     hold here. See `macos-runner` below and ADR-052 for the full argument, including why a
#     private fork must redo the calculation rather than assume this carries over.
#
# Toolchain is pinned to match `task doctor` (.fvmrc / .nvmrc / packageManager / .sdkmanrc). JDK is
# Temurin rather than GraalVM: only the native build needs GraalVM, and that is not run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Stated in the repository rather than only inherited from the (already read-only) repo setting —
# F12 of docs/plans/implemented/SECURITY-ARCHITECTURE-REVIEW.md: flipping that setting silently widens every
# job below, and nothing in the tree would say so without this line.
permissions:
  contents: read

jobs:
  # Contract drift, docs drift, the Dart/Flutter libraries, and the admin typecheck. Needs the full
  # toolchain because verify:contracts regenerates across all three languages.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Flutter 3.44.2 (brings Dart)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      - name: Node (pinned by .nvmrc) + pnpm via corepack
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      # verify:contracts generates the Dart messages with protoc + protoc-gen-dart. Pin protoc_plugin
      # to the version that produced the committed .pb.dart (25.0.0), or the drift gate false-fails
      # on codegen-format differences. (Java DTOs and the admin schema are hermetic — Maven and pnpm
      # resolve their own tools — so only the Dart path needs a system protoc here.)
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: dart pub global activate protoc_plugin 25.0.0
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The scripting runtime beside sh (DECISIONS.md ADR-032). verify:boundaries and verify:docs
      # below are the two gates whose bodies move into scripts/*.py, so this job executes Python
      # even though no other job does. Floored, not pinned, exactly as `task doctor` checks it:
      # 3.9 is the floor these scripts are written to, so CI runs the oldest thing they support
      # rather than the newest, and an incompatibility surfaces here instead of on a contributor's
      # Mac carrying only Xcode's 3.9.6. ubuntu-latest ships a newer python3 that would otherwise
      # be picked up implicitly — declaring it is what keeps CI from drifting off the floor.
      - name: Python (floor, see STANDARDS "Scripting")
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      # First because it is the cheapest thing here and the only one that catches a defect no test
      # can: a client package calling the identity provider directly still authenticates, still
      # renders, and still passes every suite. See STANDARDS "The client talks to one server".
      - name: Client/server boundary gate
        run: task verify:boundaries

      - run: task deps
      - name: Contract drift gate
        run: task verify:contracts
      - name: Docs drift gate
        run: task verify:docs
      - run: task test:client
      - run: task test:admin

      # Compiling the web bundle IS a gate, not a build step. No test compiles it, so a Flutter
      # dependency whose web implementation is not Wasm-clean leaves every suite green and the web
      # app unbuildable — which is exactly how it went once, discovered by a deploy (ADR-024).
      # WEB_API_URL is a placeholder: the artifact is thrown away, and pinning a real environment
      # would put an environment fact in the repo (STANDARDS "Deployment model").
      - name: Web bundle compiles (WebAssembly)
        run: WEB_API_URL=https://ci.invalid task build:web

  # The runners this Linux host can build: Android and the Linux desktop app. Its own job so a
  # Gradle/manifest/GTK fault is reported as itself rather than buried in the gates job, and so it
  # runs in parallel. (The job keeps its `android-runner` name so existing required-status-check
  # settings keep matching; it covers Linux desktop too since ADR-045.)
  #
  # Apple targets are skipped HERE — announced, never silently — because this host has no Xcode.
  # They are not skipped by CI as a whole: see `macos-runner` below (ADR-052).
  android-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Temurin, not GraalVM: AGP's jdkImage transform shells out to jlink, which GraalVM's cannot
      # run at any version. Same constraint `run:demo:native` checks for on a developer's machine.
      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Flutter 3.44.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - name: go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Flutter's Linux desktop build shells out to CMake/ninja and links against GTK3. Not
      # preinstalled on the runner, and its absence fails as a CMake error naming a header rather
      # than a missing package.
      #
      # libsecret is here for the same reason one layer down: a Flutter PLUGIN brings its own
      # native dependencies to each platform it supports, and flutter_secure_storage backs the
      # Linux keystore with libsecret. So the list a desktop target needs is not "the Flutter SDK's
      # own" — it grows with the dependency set, and each addition announces itself as a
      # pkg_check_modules failure inside a package's CMakeLists.
      - name: Linux desktop toolchain (GTK3, libsecret, ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: task build:apps:runners

  # The Windows runner. Flutter does not cross-compile desktop targets — `flutter build windows`
  # refuses on any other host, by name — so this job is the *only* place the Windows app is ever
  # built, and the only evidence jZen has that the target works (ADR-045). It is also the one
  # documented exception to "every command was run on the delivery machine": no macOS machine can
  # run it.
  #
  # Build only. The full-stack `test:e2e` stays on Linux: it boots Supabase, which needs Linux
  # containers this runner cannot practically host, and a weaker check wearing the same name would
  # be worse than no check. The widget suites are host-agnostic Dart and already run on Linux.
  #
  # `shell: bash` throughout: the runner ships Git Bash, so the step bodies are POSIX. It does NOT
  # extend inside `task` — go-task interprets its recipes itself and resolves each program from the
  # Windows PATH, where System32 comes first. Any recipe naming a program Windows also has (`find`,
  # `sort`) gets the other one, which is why the task recipes walk trees with `git ls-files`.
  windows-runner:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter 3.44.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - name: go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build:apps:runners

  # macOS and the iOS simulator (ADR-052). Runs `build:apps:runners` on an actual Apple host, the
  # only thing that proves either runner still compiles from a clean checkout — no test compiles a
  # runner, which is exactly how Finding 1 of the 2026-09-14 Dart/Flutter code review (stale
  # CocoaPods `Frameworks` references surviving an SPM migration) broke both Apple runners with
  # every suite still green, and had already recurred once before being caught by hand.
  #
  # `build:apps:runners` builds macOS in --debug and the iOS SIMULATOR only (--simulator); it does
  # not sign, provision, or archive for a real device — same throwaway-artifact, compile-check
  # contract as the other two runner jobs. Android and desktop are skipped here, loudly, since this
  # host has no Android SDK and Flutter refuses cross-host desktop builds — already covered by
  # android-runner/windows-runner.
  macos-runner:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter 3.44.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - name: go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build:apps:runners

  # The backend @QuarkusTest suite. Uses Quarkus Dev Services, which starts Postgres in Docker —
  # available on ubuntu-latest by default, so no extra service setup.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:apps:server

  # The end-to-end release gate: boots real Supabase + Quarkus and runs zen_demo's integration
  # suite with no mocks. The heaviest job and the one most likely to need iteration on first run
  # (Supabase CLI start, ports); if it is flaky in CI, that is a setup issue to fix here, not a
  # reason to drop the gate the docs call the release gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Flutter 3.44.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - name: Node + pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.113.0"
      - name: go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:e2e
