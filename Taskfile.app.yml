# jZen :: the orchestration an APPLICATION includes.
#
# `Taskfile.yml` next to this file orchestrates *this repository* — the framework libraries and
# the reference app. This file is the part that is not about jZen at all: the tasks any
# application built on jZen needs, written against variables instead of against zen_demo.
#
# WHY IT IS A SEPARATE FILE AND NOT A FOLDER. It is one file, so it is one file: a directory whose
# only job is to hold a single member is a container for something that does not need containing
# (docs/ZEN_ARCHITECTURE.md, "fewer files, fewer indirections"). If a second reusable taskfile ever
# earns its place, that is when a folder does too.
#
# HOW AN APPLICATION USES IT. In the application's own Taskfile.yml:
#
#   version: '3'
#   includes:
#     zen:
#       taskfile: ../jZen/Taskfile.app.yml
#       vars:
#         APP_NAME: prudent
#         CLIENT_DIR: client
#         SERVER_DIR: server
#   tasks:
#     test: {cmds: [{task: 'zen:test:client'}]}
#
# Then `task zen:deps`, `task zen:test:client`, and so on. Three go-task facts make this work, and
# they were measured rather than assumed:
#
#   - tasks run in the INCLUDING repository's directory, so relative paths mean the application's
#     tree, not jZen's;
#   - {{.ROOT_DIR}} is the application's root and {{.TASKFILE_DIR}} is jZen's, which is how a task
#     here reaches back into the framework checkout (`{{.TASKFILE_DIR}}/server/mvnw`) while
#     operating on the application's files;
#   - `vars:` on the include override the defaults below.
#
# WHAT DOES NOT BELONG HERE. Anything that names zen_demo, anything that only makes sense inside
# this repository (publishing the framework libraries, the framework's own module gates), and
# anything an application would have to fight rather than configure. A task that needs an `if
# APP_NAME == …` has been put in the wrong file.
#
# THE HONEST LIMIT, TODAY. Three tasks have moved — `generate:l10n`, `build:runners` and
# `generate:proto:dart` — and Taskfile.yml delegates to all three, so the framework runs the same
# code an application does rather than a copy that resembles it. The third one is a partial case
# worth naming: zen_demo declares no protos of its own, so running it here proves the task parses,
# resolves and selects correctly, but never exercises the import rewrite. That half was verified
# against a throwaway application outside this tree (ADR-047), which is a manual proof rather than
# a gate. The rest of the orchestration (the rest of the contract loop, the server
# build, the local stack, the deploy) has not moved yet and is still zen_demo-shaped. Those are
# migrations to make one at a time, each proven against zen_demo before an application depends on
# it; a task sitting in both files is drift waiting to happen, which is the argument for finishing
# the move rather than for keeping two copies.
version: "3"

vars:
  # The application's name. Used only in messages; nothing branches on it.
  APP_NAME: '{{.APP_NAME | default "app"}}'

  # Where the application keeps each tier, relative to ITS OWN root. The defaults are the shape a
  # single-application repository takes (a language-neutral root over per-tier directories); an
  # application that nests its tiers differently overrides them on the include.
  CLIENT_DIR: '{{.CLIENT_DIR | default "client"}}'
  SERVER_DIR: '{{.SERVER_DIR | default "server"}}'
  PROTO_DIR: '{{.PROTO_DIR | default "proto"}}'

  # Directories scanned by the tasks that walk a tree (l10n, client tests). Space-separated, so an
  # application with two pub workspaces passes both. Defaults to the client tier alone.
  DART_ROOTS: '{{.DART_ROOTS | default .CLIENT_DIR}}'

  # Where generate:proto:dart writes the application's generated messages, relative to the
  # application's root. The default assumes the conventional layout (`<client>/<app>_client`);
  # an application that keeps its wire types in a dedicated package overrides it. The task
  # refuses to write into a directory that is not inside a Dart package, so a wrong value fails
  # loudly rather than scattering .pb.dart files somewhere nothing compiles them.
  #
  # The DEFAULT is built in the task body, not here, and that is not a style choice: a var in this
  # map that references another var in this map reads the OTHER VAR'S DEFAULT, not the value the
  # include supplied. Written here, `{{.APP_NAME}}_client` resolved to `app_client` for an
  # application that had passed APP_NAME on the include. Measured, like everything else in this
  # file. Inside a task the same reference resolves correctly.
  PROTO_DART_OUT: '{{.PROTO_DART_OUT | default ""}}'

  # The jZen checkout these tasks came from. Not a guess: TASKFILE_DIR is where this file lives.
  JZEN_DIR: "{{.TASKFILE_DIR}}"

  # Compile-time client config (ADR-007, BLUEPRINT "The compile-time config rule"). Placeholders:
  # a real environment baked into a repository outlives the environment it names.
  ZEN_ENV: '{{.ZEN_ENV | default "dev"}}'
  API: '{{.ZEN_API_URL | default "http://localhost:8085"}}'

tasks:
  info:
    desc: Which jZen this application is building against, and where its tiers are
    silent: true
    summary: |
      Prints the resolved wiring. Worth running first in a new checkout, because every failure
      mode of a path-consumed framework looks like a broken build rather than a missing sibling.

      It reports the framework checkout's git revision, and whether that checkout is dirty.
      Consuming jZen by path means there is no version boundary between the two repositories: the
      only answer to "which jZen is this?" is a commit, and the only warning that the answer is
      unstable is a dirty tree. Say both out loud rather than let a developer assume a release.
    cmds:
      - |
        set -eu
        echo "app:        {{.APP_NAME}}"
        echo "app root:   {{.ROOT_DIR}}"
        echo "tiers:      client={{.CLIENT_DIR}} server={{.SERVER_DIR}} proto={{.PROTO_DIR}}"
        echo "jZen:       {{.JZEN_DIR}}"
        if [ ! -d "{{.JZEN_DIR}}" ]; then
          echo "            MISSING - the framework checkout is not there."
          exit 1
        fi
        if [ -d "{{.JZEN_DIR}}/.git" ]; then
          rev=$(git -C "{{.JZEN_DIR}}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if [ -n "$(git -C '{{.JZEN_DIR}}' status --porcelain 2>/dev/null)" ]; then
            echo "jZen rev:   $rev (DIRTY - uncommitted changes; this build is not reproducible)"
          else
            echo "jZen rev:   $rev"
          fi
        fi

  framework:install:
    desc: Build and install the jZen Java libraries into the local Maven repository
    silent: true
    summary: |
      The prerequisite an application's own build cannot express. jZen's packages are unpublished,
      so an application server declares zen-parent with an EMPTY <relativePath/> and resolves the
      framework artifacts from the local repository — which means something has to put them there
      first, and Maven will not reach across repositories to do it.

      Deliberately not a `deps:` of the build tasks below. It compiles another repository, takes
      real time, and an application developer who has not touched jZen should not pay for it on
      every build. Run it after pulling jZen; the failure when it is stale is a missing or
      out-of-date artifact, which Maven names clearly.
    cmds:
      - |
        set -eu
        echo ">> installing jZen framework libraries from {{.JZEN_DIR}}"
        cd "{{.JZEN_DIR}}/server" && ./mvnw -B -q install -DskipTests
        echo "jZen libraries installed."

  framework:prepare:
    desc: Prepare the jZen framework checkout itself for consumption (l10n, admin scaffold deps)
    silent: true
    summary: |
      The prerequisite an application's multi-repo build cannot express, alongside
      framework:install for the Java side (issue #64).

      TWO gaps, same shape. `zen:generate:l10n` (and `zen:test:client`'s internal call to it)
      discovers localized packages with `git ls-files`, scoped to whichever repository the task
      runs in. Called from an application's own root, it can only ever see that application's own
      tracked files — client/zen_ui_identity/l10n.yaml and friends belong to jZen's OWN git
      repository, which a sibling-checkout `git ls-files` structurally cannot see. And nothing has
      ever run `pnpm install` inside jZen's own admin/ on a fresh multi-repo checkout, so
      TypeScript's node_modules walk from an application's admin panel (which imports
      @jzen/admin-core from ../jZen/admin/src via a `paths` alias) finds react-admin nowhere.

      Both are invisible on a developer's machine: a developer who has done unrelated framework
      work has already generated or installed the missing artifact, and it persists on disk. CI
      has no such history, so this class of defect is structurally undetectable where the code
      is written.

      WHAT IT DOES. Runs `task generate:l10n` and `pnpm install` IN jZen's own root ({{.JZEN_DIR}}),
      not the including application's, so `git ls-files` resolves against jZen's own tracked files
      and the admin scaffold's own node_modules gets populated. Deliberately not a `deps:` of the
      build tasks below, for the same reason framework:install is not: it compiles another
      repository's config and an application developer who has not touched jZen should not pay for
      it on every build. Run it once after cloning a sibling jZen checkout, or in CI before
      anything that reaches into it.
    cmds:
      - |
        set -eu
        echo ">> preparing the jZen framework checkout at {{.JZEN_DIR}}"
        (cd "{{.JZEN_DIR}}" && task generate:l10n)
        (cd "{{.JZEN_DIR}}/admin" && pnpm install)
        echo "jZen framework checkout prepared (l10n generated, admin scaffold deps installed)."

  deps:
    desc: Resolve Dart/Flutter dependencies for the application's packages
    silent: true
    summary: |
      `flutter pub get` rather than `dart pub get` in every directory named by DART_ROOTS: a
      workspace holding Flutter packages needs the Flutter tool, and gen-l10n needs each package's
      .dart_tool to exist before it can run.
    cmds:
      - |
        set -eu
        for root in {{.DART_ROOTS}}; do
          [ -f "{{.ROOT_DIR}}/$root/pubspec.yaml" ] || continue
          echo ">> flutter pub get ($root)"
          (cd "{{.ROOT_DIR}}/$root" && flutter pub get)
        done

  generate:proto:dart:
    desc: Generate the APPLICATION's Dart messages, resolving jZen's zen/v1 without copying it
    silent: true
    summary: |
      The application half of the contract loop. jZen's own zen/v1 messages are generated once,
      into client/zen_transport/lib/generated, by the framework's task; this one generates the
      models the APPLICATION declares under its own proto/ tree.

      THE PROBLEM IT SOLVES. protoc-gen-dart has no equivalent of Go's `M` mapping: it always
      writes imports as filesystem-relative paths. An application proto that does
      `import "zen/v1/common.proto"` therefore produces `import '../../zen/v1/common.pb.dart'` —
      a path that resolves to nothing inside the application's package. Two branches look like
      fixes and are not. Forbidding the import makes every application redefine the shapes
      ZenClient already speaks. Regenerating zen/v1 into the application's tree is worse, and
      silently so: the application's `zen.v1.ZenError` becomes a DIFFERENT DART TYPE from
      zen_transport's, so the framework's own API stops type-checking against the messages the
      application built. Two copies of one proto type in one program is the failure, not the fix.

      WHAT IT DOES INSTEAD. protoc is given both contract roots with -I (jZen's and the
      application's) but only the application's protos as ARGUMENTS, so zen/v1 is resolved for
      typing and never emitted. The dangling relative imports it leaves behind are then rewritten
      to `package:zen_transport/generated/zen/v1/…`, which is a public URI because the framework
      keeps those messages outside lib/src for exactly this reason (ADR-047). Finally the task
      FAILS if a zen/v1 file landed in the application's tree anyway — the type-identity rule
      above, enforced rather than documented.

      IT FAILS ON AN EMPTY CONTRACT DIRECTORY. jZen's own task used to skip with exit 0 there.
      For an application that is wrong: proto/ with nothing in it is a broken checkout, and a
      green exit code over it is what STANDARDS "Failures surface; nothing is swallowed" forbids.
      An application that has protos but declares none of its own (all of them framework-owned,
      which is zen_demo's case) is a different, legitimate state and is reported, not failed.

      DISCOVERY IS `git ls-files`, NOT `find`, and the rewrite is parameter expansion rather than
      sed or perl — for the reason generate:l10n documents at length: on a Windows host a bare
      `find` resolves to System32's find.exe, and sed/perl may not exist at all. One program on
      every host, or no program at all.
    cmds:
      - |
        set -e
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "generate:proto:dart discovers contracts with 'git ls-files', and {{.ROOT_DIR}} is not a git work tree."
          exit 1
        fi
        if [ ! -d "{{.PROTO_DIR}}" ]; then
          echo "No {{.PROTO_DIR}}/ directory in {{.ROOT_DIR}}. The application's contracts live there;"
          echo "an absent contract root is a broken checkout, or PROTO_DIR is set wrong on the include."
          exit 1
        fi
        all=$(git ls-files -- ":(glob){{.PROTO_DIR}}/*.proto" ":(glob){{.PROTO_DIR}}/**/*.proto")
        if [ -z "$all" ]; then
          echo "{{.PROTO_DIR}}/ contains no tracked .proto files. A contract directory with no"
          echo "contract in it is a broken checkout, not a fresh one."
          exit 1
        fi
        # zen/v1 is the FRAMEWORK's namespace. If the application's own tree carries a copy it is
        # excluded here, never generated: see the type-identity paragraph in this task's summary.
        set --
        for p in $all; do
          case "$p" in
            {{.PROTO_DIR}}/zen/v1/*) continue ;;
            *) set -- "$@" "$p" ;;
          esac
        done
        if [ "$#" -eq 0 ]; then
          echo "No application protos: every .proto under {{.PROTO_DIR}}/ is framework-owned (zen/v1)."
          echo "Nothing to generate - jZen's own task owns those."
          exit 0
        fi
        command -v protoc >/dev/null 2>&1 || { echo "protoc not found. Install it and protoc_plugin (dart pub global activate protoc_plugin)."; exit 1; }
        [ -x "$HOME/.pub-cache/bin/protoc-gen-dart" ] || { echo "protoc-gen-dart not found. Run: dart pub global activate protoc_plugin"; exit 1; }
        out="{{.PROTO_DART_OUT}}"
        if [ -z "$out" ]; then out="{{.CLIENT_DIR}}/{{.APP_NAME}}_client/lib/generated"; fi
        # The output has to land inside a Dart package, or the messages compile nowhere. Walk up
        # from the output directory looking for the pubspec.yaml that owns it.
        # Terminate on the PREVIOUS value, not on a sentinel: `${p%/*}` returns p unchanged once
        # there is no slash left, so a loop that watches for "." or "/" never ends on a relative
        # path. (It did not end. That is how this comment exists.)
        pkg="$out"
        while [ ! -f "$pkg/pubspec.yaml" ]; do
          parent="${pkg%/*}"
          if [ "$parent" = "$pkg" ] || [ -z "$parent" ]; then pkg=""; break; fi
          pkg="$parent"
        done
        if [ -z "$pkg" ] || [ ! -f "$pkg/pubspec.yaml" ]; then
          echo "PROTO_DART_OUT is '$out', which is not inside a Dart package (no pubspec.yaml above it)."
          echo "Set PROTO_DART_OUT on the include to a path inside the package that should own the messages."
          exit 1
        fi
        mkdir -p "$out"
        echo ">> protoc ($# application proto(s) -> $out)"
        PATH="$HOME/.pub-cache/bin:$PATH" protoc \
          -I "{{.JZEN_DIR}}/proto" -I "{{.PROTO_DIR}}" \
          --dart_out="$out" "$@"
        # The guard, before the rewrite: if protoc emitted zen/v1 anyway (an application proto
        # listed one of jZen's as its own, a stale copy from an earlier run), stop. Leaving it
        # would give the program two incompatible definitions of the same proto type and the
        # error would surface far from here.
        if [ -d "$out/zen/v1" ]; then
          echo
          echo "REFUSING: jZen's zen/v1 messages were emitted into the application's tree at $out/zen/v1."
          echo "They must be imported from package:zen_transport, never regenerated - a second copy"
          echo "is a second, incompatible Dart type. Delete that directory and check that no"
          echo "application .proto lives under {{.PROTO_DIR}}/zen/v1."
          exit 1
        fi
        # Rewrite the relative imports protoc left pointing at zen/v1 into the package: URI that
        # actually resolves. Idempotent: a line already carrying the package: form rewrites to
        # itself. Pure parameter expansion - no sed, no perl (see the summary).
        # The file list is DERIVED from the protos that were just compiled, not discovered by a
        # walk: protoc's output path for `<proto-root>/a/b.proto` is `<out>/a/b.pb.dart` (plus
        # .pbenum.dart and .pbjson.dart when the file has enums or is imported). Deriving it
        # needs no `find` and no second opinion about which files are ours.
        rewritten=0
        for p in "$@"; do
          rel="${p#{{.PROTO_DIR}}/}"
          base="${rel%.proto}"
          for f in "$out/$base.pb.dart" "$out/$base.pbenum.dart" "$out/$base.pbjson.dart"; do
            [ -f "$f" ] || continue
            touched=0
            : > "$f.zen-tmp"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                "import '"*/zen/v1/*|"export '"*/zen/v1/*)
                  head="${line%%\'*}"
                  tail="${line#*/zen/v1/}"
                  line="${head}'package:zen_transport/generated/zen/v1/${tail}"
                  touched=1
                  ;;
              esac
              printf '%s\n' "$line" >> "$f.zen-tmp"
            done < "$f"
            mv "$f.zen-tmp" "$f"
            if [ "$touched" -eq 1 ]; then rewritten=$((rewritten + 1)); fi
          done
        done
        echo "Generated application messages -> $out ($rewritten file(s) re-pointed at package:zen_transport)"

  generate:l10n:
    desc: Generate the typed client localizations from the ARB files
    silent: true
    summary: |
      Runs `flutter gen-l10n` in every package that declares an l10n.yaml: the ARB files are the
      source, the classes under the package's generated/ directory are the output.

      Unlike the proto artifacts this output is BUILT, NOT TRACKED (STANDARDS "Code generation",
      ADR-009): gen-l10n ships inside the Flutter SDK that every consumer already has, so there is
      no toolchain boundary to carry the result across. An application's own contract gate should
      assert that none of it is tracked.

      Discovery is by l10n.yaml, never by a list, so a new localized package is picked up by
      existing here rather than by being registered somewhere.

      IT WALKS THE TREE WITH `git ls-files`, NOT `find`. On a Windows host the task shell resolves
      a bare `find` to System32's find.exe — a different program that rejects these arguments,
      writes to stderr and returns nothing — so the walk came back empty, this task announced "no
      localized packages", and the failure only surfaced minutes later as a missing generated
      import in the Windows runner build. `sort` is shadowed the same way and is gone for the same
      reason (git's output is already ordered and deduplicated). `git ls-files` is one program on
      every host, and an l10n.yaml is tracked source by definition — which also drops the
      .dart_tool/build exclusions, since a gitignored path was never a candidate.
    cmds:
      - |
        set -e
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "generate:l10n discovers localized packages with 'git ls-files', and {{.ROOT_DIR}} is not a git work tree."
          exit 1
        fi
        # Two patterns per root: the root may itself be a localized package, or contain them at
        # any depth. `:(glob)` pins the pathspec to wildmatch semantics rather than leaving them
        # to git's default for the version at hand.
        set --
        for r in {{.DART_ROOTS}}; do
          set -- "$@" ":(glob)$r/l10n.yaml" ":(glob)$r/**/l10n.yaml"
        done
        found=0
        for config in $(git ls-files -- "$@"); do
          # Parameter expansion, not `dirname`: one less program this has to find on a host.
          pkgdir="${config%/l10n.yaml}"
          if [ "$pkgdir" = "$config" ]; then pkgdir="."; fi
          found=$((found + 1))
          echo ">> flutter gen-l10n ($config)"
          (cd "{{.ROOT_DIR}}/$pkgdir" && flutter gen-l10n)
        done
        if [ "$found" -eq 0 ]; then
          echo "No localized packages found (no l10n.yaml)."
        fi

  test:client:
    desc: Run every Dart/Flutter suite in the application's packages
    silent: true
    summary: |
      Neither `dart test` nor `flutter test` aggregates a pub workspace, so the members are walked
      here: a package depending on Flutter runs under `flutter test`, a pure-Dart one under
      `dart test`. A failing suite fails the task — nothing swallows an exit code.

      The Flutter suites compile with ZEN_ENV and ZEN_PLATFORM defines because client config is
      compile-time (ADR-007) and framework widgets assert ZEN_PLATFORM is set. ZEN_PLATFORM is the
      HOST's platform, including Windows, which git-bash reports as MINGW* — calling that host
      Linux would compile the wrong branch of every zenIsDesktop constant on the one machine able
      to check them (ADR-045).
    cmds:
      - task: generate:l10n
      - |
        set -e
        case "$(uname -s)" in
          Darwin)                 host_platform=macos ;;
          Linux)                  host_platform=linux ;;
          MINGW*|MSYS*|CYGWIN*)   host_platform=windows ;;
          *)                      host_platform=linux ;;
        esac
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "test:client discovers packages with 'git ls-files', and {{.ROOT_DIR}} is not a git work tree."
          exit 1
        fi
        # `git ls-files`, not `find | sort` — see generate:l10n. Both of those names belong to
        # unrelated System32 programs on a Windows host, and a walk that comes back empty there
        # would report "no packages" and exit green, which is a test task that tested nothing.
        set --
        for root in {{.DART_ROOTS}}; do
          set -- "$@" ":(glob)$root/pubspec.yaml" ":(glob)$root/**/pubspec.yaml"
        done
        found=0
        for pubspec in $(git ls-files -- "$@"); do
          pkgdir="${pubspec%/pubspec.yaml}"
          if [ "$pkgdir" = "$pubspec" ]; then pkgdir="."; fi
          if [ ! -d "$pkgdir/test" ]; then continue; fi
          found=1
          if grep -qE '^[[:space:]]*(flutter|flutter_test):' "$pubspec"; then
            echo ">> flutter test ($pkgdir)"
            (cd "$pkgdir" && flutter test --dart-define=ZEN_ENV={{.ZEN_ENV}} --dart-define=ZEN_PLATFORM="$host_platform")
          else
            echo ">> dart test ($pkgdir)"
            (cd "$pkgdir" && dart test)
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "No test directories found under {{.DART_ROOTS}}."
        fi

  build:runners:
    desc: Compile every delivery runner this host can build — the targets tests never touch
    silent: true
    summary: |
      A Flutter dependency does not enter one platform, it enters all of them, and each has its
      own build system that can reject it on its own terms. No test compiles a runner: unit and
      widget tests run on the Dart VM and the flutter tester, which never invoke Xcode, Gradle,
      CMake or MSBuild. So a change can leave every suite green and every shippable artifact
      broken. This is what answers that question.

      DESKTOP AND APPLE TARGETS ARE HOST-ONLY. Flutter refuses `build linux` off Linux, `build
      windows` off Windows, and the Apple targets need Xcode. No single machine verifies all five,
      which is why the skips below are announced rather than silent, and why an application's CI
      needs more than one operating system to make its platform list true (ADR-045).

      Set APP_CLIENT_DIR to the Flutter application package (it defaults to the client tier).
      Artifacts are throwaway: this is a compile check, which is why the API URL is a placeholder.
    vars:
      APP_CLIENT_DIR: '{{.APP_CLIENT_DIR | default .CLIENT_DIR}}'
      SCHEME: '{{.ZEN_AUTH_REDIRECT_URI | default ""}}'
      # Read, not set: Flutter takes the Android JDK from a machine-wide setting that outranks
      # JAVA_HOME, so no task can fix it from inside a repository - only name it before a build
      # wastes minutes failing on it (ADR-021).
      FLUTTER_JDK:
        # A block scalar, not an inline one: the sed script contains ": ", which YAML would
        # otherwise read as a mapping and refuse to parse.
        sh: |
          flutter config --list 2>/dev/null | sed -nE 's/^ *jdk-dir: *(.*)$/\1/p' | head -1
    cmds:
      - task: generate:l10n
      - |
        set -eu
        cd "{{.ROOT_DIR}}/{{.APP_CLIENT_DIR}}"
        defines="--dart-define=ZEN_ENV={{.ZEN_ENV}} --dart-define=ZEN_API_URL={{.API}}"
        if [ -n '{{.SCHEME}}' ]; then
          defines="$defines --dart-define=ZEN_AUTH_REDIRECT_URI={{.SCHEME}}"
        fi

        case "$(uname -s)" in
          Darwin)                 HOST=macos ;;
          Linux)                  HOST=linux ;;
          MINGW*|MSYS*|CYGWIN*)   HOST=windows ;;
          *)                      HOST=unknown ;;
        esac

        # `if`, never `[ -d x ] && build || true`: that idiom turns a FAILED build into a pass,
        # because the `|| true` cannot tell a missing directory from a compiler error. Nothing
        # here swallows a failure (STANDARDS, "Failures surface").
        build_target() {
          target="$1"; platform="$2"; needs="$3"; dir="$4"; shift 4
          if [ ! -d "$dir" ]; then
            return 0
          fi
          if [ "$HOST" != "$needs" ]; then
            echo ">> SKIPPED $target: it only builds on a $needs host, and this is $(uname -s)."
            return 0
          fi
          echo ">> $target"
          flutter build "$@" --debug --dart-define=ZEN_PLATFORM="$platform" $defines
        }

        build_target "macOS"           macos   macos   macos   macos
        build_target "iOS simulator"   ios     macos   ios     ios --simulator
        build_target "Linux desktop"   linux   linux   linux   linux
        build_target "Windows desktop" windows windows windows windows

        # Android last: it is the one that fails for a reason no error message names. Skipped on a
        # Windows host, where pulling a full Android SDK would double a job for a target any Linux
        # or macOS host already covers.
        if [ -d android ] && [ "$HOST" != "windows" ]; then
          JDK='{{.FLUTTER_JDK}}'
          BAD=""
          case "$JDK" in *graal*|*Graal*|*GRAAL*) BAD="yes" ;; esac
          if [ -z "$BAD" ] && [ -n "$JDK" ] && [ -x "$JDK/bin/java" ]; then
            case "$("$JDK/bin/java" -version 2>&1 | head -1)" in *GraalVM*) BAD="yes" ;; esac
          fi
          if [ -n "$BAD" ]; then
            echo "The Android build cannot use this JDK: GraalVM (its jlink cannot run AGP's jdkImage transform)."
            echo "Flutter takes it from a MACHINE-WIDE setting that outranks JAVA_HOME, so no task can fix it here:"
            echo "  flutter config --jdk-dir /path/to/a/standard/jdk-25"
            exit 1
          fi
          echo ">> Android"
          flutter build apk --debug --dart-define=ZEN_PLATFORM=android $defines
        elif [ -d android ]; then
          echo ">> SKIPPED Android here: covered by any Linux or macOS host, which already has the SDK."
        fi
        echo
        echo "Every runner this host can build compiles."
