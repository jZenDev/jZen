# jZen :: the orchestration an APPLICATION includes.
#
# `Taskfile.yml` next to this file orchestrates *this repository* — the framework libraries and
# the reference app. This file is the part that is not about jZen at all: the tasks any
# application built on jZen needs, written against variables instead of against zen_demo.
#
# WHY IT IS A SEPARATE FILE AND NOT A FOLDER. It is one file, so it is one file: a directory whose
# only job is to hold a single member is a container for something that does not need containing
# (docs/ZEN_ARCHITECTURE.md, "fewer files, fewer indirections"). If a second reusable taskfile ever
# earns its place, that is when a folder does too.
#
# HOW AN APPLICATION USES IT. In the application's own Taskfile.yml:
#
#   version: '3'
#   includes:
#     zen:
#       taskfile: ../jZen/Taskfile.app.yml
#       vars:
#         APP_NAME: prudent
#         CLIENT_DIR: client
#         SERVER_DIR: server
#   tasks:
#     test: {cmds: [{task: 'zen:test:client'}]}
#
# Then `task zen:deps`, `task zen:test:client`, and so on. Three go-task facts make this work, and
# they were measured rather than assumed:
#
#   - tasks run in the INCLUDING repository's directory, so relative paths mean the application's
#     tree, not jZen's;
#   - {{.ROOT_DIR}} is the application's root and {{.TASKFILE_DIR}} is jZen's, which is how a task
#     here reaches back into the framework checkout (`{{.TASKFILE_DIR}}/server/mvnw`) while
#     operating on the application's files;
#   - `vars:` on the include override the defaults below.
#
# WHAT DOES NOT BELONG HERE. Anything that names zen_demo, anything that only makes sense inside
# this repository (publishing the framework libraries, the framework's own module gates), and
# anything an application would have to fight rather than configure. A task that needs an `if
# APP_NAME == …` has been put in the wrong file.
#
# WHAT HAS MOVED. The dependency install (`deps` and `deps:server/client/admin`), the whole
# contract loop (`generate` and its `generate:proto*` / `generate:api*` / `generate:l10n` parts,
# plus the `verify:contracts` drift gate), the local stack (`run:dev` and `run:supabase` /
# `run:server` / `run:client` / `run:admin`), `test:client` and `build:runners` — all live here
# now, written against vars, and Taskfile.yml delegates to every one of them (ADR-046, ADR-049). So
# the framework runs the same code an application does rather than a copy that resembles it.
#
# Two things this file's own runs cannot fully exercise, and both are manual proofs recorded in an
# ADR rather than gates: `generate:proto:dart`'s import rewrite (zen_demo declares no protos of its
# own, verified against a throwaway application outside this tree — ADR-047), and the consumer-side
# shape of a repo whose tiers are nested differently from zen_demo's.
#
# WHAT HAS NOT MOVED, deliberately: the framework's own code generation (jZen's `zen-proto` DTOs and
# `zen_transport` messages), the framework module gates, and the deploy — all genuinely
# jZen-internal or still zen_demo-shaped. A task sitting in both files is drift waiting to happen,
# which is the argument for finishing a move rather than for keeping two copies.
version: "3"

vars:
  # The application's name. Used only in messages; nothing branches on it.
  APP_NAME: '{{.APP_NAME | default "app"}}'

  # Where the application keeps each tier, relative to ITS OWN root. The defaults are the shape a
  # single-application repository takes (a language-neutral root over per-tier directories); an
  # application that nests its tiers differently overrides them on the include.
  CLIENT_DIR: '{{.CLIENT_DIR | default "client"}}'
  SERVER_DIR: '{{.SERVER_DIR | default "server"}}'
  PROTO_DIR: '{{.PROTO_DIR | default "proto"}}'

  # Directories scanned by the tasks that walk a tree (l10n, client tests). Space-separated, so an
  # application with two pub workspaces passes both. Defaults to the client tier alone.
  DART_ROOTS: '{{.DART_ROOTS | default .CLIENT_DIR}}'

  # The application's own react-admin panel, relative to ITS OWN root. Assembles @jzen/admin-core
  # (ADR-005) and owns the generated schema. `deps:admin` and `generate:api:ts` run pnpm here; both
  # skip with a note if the directory is absent, so an application with no admin panel is fine.
  ADMIN_DIR: '{{.ADMIN_DIR | default "admin"}}'

  # The directory holding the application's Quarkus server pom (the module that produces
  # openapi.json and runs in dev mode). Defaults to the server tier; an application that nests the
  # runnable module deeper (apps/<app>/<app>_server) overrides it on the include.
  APP_SERVER_MODULE: '{{.APP_SERVER_MODULE | default .SERVER_DIR}}'

  # The Flutter application package that `run:client` boots and `run:dev` points a browser at.
  # Same default shape as build:runners' APP_CLIENT_DIR (`<client>/<app>_client`), built in the
  # task body for the vars-in-a-vars-map reason PROTO_DART_OUT documents above.
  APP_CLIENT_DIR: '{{.APP_CLIENT_DIR | default ""}}'

  # run:dev / run:client wiring. DEVICE is a passthrough to `flutter run -d` (a device id, or
  # `chrome` for the web target). WEB_PORT is fixed so the server's CORS allowlist can name it;
  # APP_PORT dodges a leftover stack on :8080. Names and defaults match Taskfile.yml's run:demo.
  DEVICE: '{{.DEVICE | default "chrome"}}'
  WEB_PORT: '{{.ZEN_WEB_PORT | default "5200"}}'
  APP_PORT: '{{.ZEN_APP_PORT | default "8085"}}'
  # Custom URI scheme for the client's auth deep-link (ADR-018/019). Empty = the client declares
  # none. run:client / run:dev pass the define only when it is set AND the resolved platform is
  # not web — a custom-scheme redirect is native-only by construction.
  AUTH_REDIRECT_URI: '{{.ZEN_AUTH_REDIRECT_URI | default ""}}'

  # Where generate:proto:dart writes the application's generated messages, relative to the
  # application's root. The default assumes the conventional layout (`<client>/<app>_client`);
  # an application that keeps its wire types in a dedicated package overrides it. The task
  # refuses to write into a directory that is not inside a Dart package, so a wrong value fails
  # loudly rather than scattering .pb.dart files somewhere nothing compiles them.
  #
  # The DEFAULT is built in the task body, not here, and that is not a style choice: a var in this
  # map that references another var in this map reads the OTHER VAR'S DEFAULT, not the value the
  # include supplied. Written here, `{{.APP_NAME}}_client` resolved to `app_client` for an
  # application that had passed APP_NAME on the include. Measured, like everything else in this
  # file. Inside a task the same reference resolves correctly.
  PROTO_DART_OUT: '{{.PROTO_DART_OUT | default ""}}'

  # The jZen checkout these tasks came from. Not a guess: TASKFILE_DIR is where this file lives.
  JZEN_DIR: "{{.TASKFILE_DIR}}"

  # Compile-time client config (ADR-007, BLUEPRINT "The compile-time config rule"). Placeholders:
  # a real environment baked into a repository outlives the environment it names.
  ZEN_ENV: '{{.ZEN_ENV | default "dev"}}'
  API: '{{.ZEN_API_URL | default "http://localhost:8085"}}'

tasks:
  info:
    desc: Which jZen this application is building against, and where its tiers are
    silent: true
    summary: |
      Prints the resolved wiring. Worth running first in a new checkout, because every failure
      mode of a path-consumed framework looks like a broken build rather than a missing sibling.

      It reports the framework checkout's git revision, and whether that checkout is dirty.
      Consuming jZen by path means there is no version boundary between the two repositories: the
      only answer to "which jZen is this?" is a commit, and the only warning that the answer is
      unstable is a dirty tree. Say both out loud rather than let a developer assume a release.
    cmds:
      - |
        set -eu
        echo "app:        {{.APP_NAME}}"
        echo "app root:   {{.ROOT_DIR}}"
        echo "tiers:      client={{.CLIENT_DIR}} server={{.SERVER_DIR}} proto={{.PROTO_DIR}}"
        echo "jZen:       {{.JZEN_DIR}}"
        if [ ! -d "{{.JZEN_DIR}}" ]; then
          echo "            MISSING - the framework checkout is not there."
          exit 1
        fi
        if [ -d "{{.JZEN_DIR}}/.git" ]; then
          rev=$(git -C "{{.JZEN_DIR}}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if [ -n "$(git -C '{{.JZEN_DIR}}' status --porcelain 2>/dev/null)" ]; then
            echo "jZen rev:   $rev (DIRTY - uncommitted changes; this build is not reproducible)"
          else
            echo "jZen rev:   $rev"
          fi
        fi

  framework:install:
    desc: Build and install the jZen Java libraries into the local Maven repository
    silent: true
    summary: |
      The prerequisite an application's own build cannot express. jZen's packages are unpublished,
      so an application server declares zen-parent with an EMPTY <relativePath/> and resolves the
      framework artifacts from the local repository — which means something has to put them there
      first, and Maven will not reach across repositories to do it.

      Deliberately not a `deps:` of the build tasks below. It compiles another repository, takes
      real time, and an application developer who has not touched jZen should not pay for it on
      every build. Run it after pulling jZen; the failure when it is stale is a missing or
      out-of-date artifact, which Maven names clearly.
    cmds:
      - |
        set -eu
        echo ">> installing jZen framework libraries from {{.JZEN_DIR}}"
        cd "{{.JZEN_DIR}}/server" && ./mvnw -B -q install -DskipTests
        echo "jZen libraries installed."

  framework:prepare:l10n:
    desc: Generate jZen's own localizations from a sibling framework checkout
    silent: true
    summary: |
      The l10n half of framework:prepare (issue #69), split out so a consumer that needs only
      this half — a Flutter runner job with no Node toolchain, say — can ask for it without also
      requiring `pnpm`.

      `zen:generate:l10n` (and `zen:test:client`'s internal call to it) discovers localized
      packages with `git ls-files`, scoped to whichever repository the task runs in. Called from
      an application's own root, it can only ever see that application's own tracked files —
      client/zen_ui_identity/l10n.yaml and friends belong to jZen's OWN git repository, which a
      sibling-checkout `git ls-files` structurally cannot see. Invisible on a developer's machine
      (unrelated framework work has already generated it, and it persists on disk); CI has no such
      history.

      Runs `task generate:l10n` IN jZen's own root ({{.JZEN_DIR}}), not the including
      application's, so `git ls-files` resolves against jZen's own tracked files.
    cmds:
      - |
        set -eu
        echo ">> generating jZen's own localizations at {{.JZEN_DIR}}"
        (cd "{{.JZEN_DIR}}" && task generate:l10n)
        echo "jZen l10n generated."

  framework:prepare:admin:
    desc: Install the jZen admin scaffold's dependencies in a sibling framework checkout
    silent: true
    summary: |
      The admin half of framework:prepare (issue #69), split out so a consumer that needs only
      the l10n half is never forced to acquire a Node toolchain just to satisfy this half's shape.

      Nothing has ever run `pnpm install` inside jZen's own admin/ on a fresh multi-repo checkout,
      so TypeScript's node_modules walk from an application's admin panel (which imports
      @jzen/admin-core from ../jZen/admin/src via a `paths` alias) finds react-admin nowhere.
      Invisible on a developer's machine (unrelated framework work already installed it); CI has
      no such history.

      Runs `pnpm install` IN jZen's own admin/ ({{.JZEN_DIR}}/admin), not the including
      application's, so the admin scaffold's own node_modules gets populated.
    cmds:
      - |
        set -eu
        echo ">> installing jZen admin scaffold deps at {{.JZEN_DIR}}/admin"
        (cd "{{.JZEN_DIR}}/admin" && pnpm install)
        echo "jZen admin scaffold deps installed."

  framework:prepare:
    desc: Prepare the jZen framework checkout itself for consumption (l10n, admin scaffold deps)
    silent: true
    summary: |
      The prerequisite an application's multi-repo build cannot express, alongside
      framework:install for the Java side (issue #64).

      Convenience wrapper over framework:prepare:l10n and framework:prepare:admin (issue #69) —
      unchanged behaviour for anyone already calling this combined task. A consumer that needs
      only one half (e.g. a Flutter runner job with no Node toolchain) should call that half
      directly instead of this one.

      Deliberately not a `deps:` of the build tasks below, for the same reason framework:install
      is not: it compiles another repository's config and an application developer who has not
      touched jZen should not pay for it on every build. Run it once after cloning a sibling jZen
      checkout, or in CI before anything that reaches into it.
    cmds:
      - task: framework:prepare:l10n
      - task: framework:prepare:admin
      - echo "jZen framework checkout prepared (l10n generated, admin scaffold deps installed)."

  deps:
    desc: Resolve dependencies for every tier the application declares (native tools do the work)
    silent: true
    summary: |
      The aggregate: `deps:server` (Maven), `deps:client` (pub), `deps:admin` (pnpm), each
      delegating to the tool that owns that tier. `task` triggers those tools, it does not become
      an SDK manager — installing the JDK, the Flutter SDK or node is the developer's job after
      `task doctor` (run from the jZen checkout) reports what is missing, the same contract
      `flutter doctor` assumes. Not wired as a `deps:` of `doctor` on purpose: in CI the toolchain
      is already pinned, and a hard dependency there would re-run the check on every job.
    deps: [deps:server, deps:client, deps:admin]

  deps:server:
    desc: Resolve the application server's Maven dependencies (framework libs installed first)
    silent: true
    summary: |
      `dependency:go-offline` against the application's Quarkus pom, through jZen's own `mvnw` (the
      application module has no wrapper of its own — it inherits zen-parent across directories).

      It runs `framework:install` first, and that is the one place ADR-046's "framework:install is
      not a `deps:` of a build task" genuinely cannot hold: the jZen artifacts are unpublished, so
      Maven cannot resolve the application server's own dependency tree until they are in the local
      repository. Everywhere else the rule stands.
    cmds:
      - |
        set -eu
        pom="{{.ROOT_DIR}}/{{.APP_SERVER_MODULE}}/pom.xml"
        if [ ! -f "$pom" ]; then
          echo ">> no server pom at {{.APP_SERVER_MODULE}}/pom.xml - skipping deps:server."
          exit 0
        fi
        echo ">> installing jZen framework libraries (prerequisite for resolving the app server)"
        (cd "{{.JZEN_DIR}}/server" && ./mvnw -B -q install -DskipTests)
        echo ">> mvnw dependency:go-offline ({{.APP_SERVER_MODULE}})"
        "{{.JZEN_DIR}}/server/mvnw" -B -q -f "$pom" dependency:go-offline

  deps:client:
    desc: Resolve Dart/Flutter dependencies for the application's packages
    silent: true
    summary: |
      `flutter pub get` rather than `dart pub get` in every directory named by DART_ROOTS: a
      workspace holding Flutter packages needs the Flutter tool, and gen-l10n needs each package's
      .dart_tool to exist before it can run.
    cmds:
      - |
        set -eu
        for root in {{.DART_ROOTS}}; do
          [ -f "{{.ROOT_DIR}}/$root/pubspec.yaml" ] || continue
          echo ">> flutter pub get ($root)"
          (cd "{{.ROOT_DIR}}/$root" && flutter pub get)
        done

  deps:admin:
    desc: Install the application admin panel's dependencies
    silent: true
    summary: |
      `pnpm install` in the application's own panel directory. The @jzen/admin-core scaffold it
      imports from source needs its own deps too — that is `framework:prepare:admin`, kept separate
      because a consumer with no Node toolchain should not be forced through it.
    cmds:
      - |
        set -eu
        dir="{{.ROOT_DIR}}/{{.ADMIN_DIR}}"
        if [ ! -f "$dir/package.json" ]; then
          echo ">> no admin panel at {{.ADMIN_DIR}} - skipping deps:admin."
          exit 0
        fi
        echo ">> pnpm install ({{.ADMIN_DIR}})"
        (cd "$dir" && pnpm install)

  generate:proto:dart:
    desc: Generate the APPLICATION's Dart messages, resolving jZen's zen/v1 without copying it
    silent: true
    summary: |
      The application half of the contract loop. jZen's own zen/v1 messages are generated once,
      into client/zen_transport/lib/generated, by the framework's task; this one generates the
      models the APPLICATION declares under its own proto/ tree.

      THE PROBLEM IT SOLVES. protoc-gen-dart has no equivalent of Go's `M` mapping: it always
      writes imports as filesystem-relative paths. An application proto that does
      `import "zen/v1/common.proto"` therefore produces `import '../../zen/v1/common.pb.dart'` —
      a path that resolves to nothing inside the application's package. Two branches look like
      fixes and are not. Forbidding the import makes every application redefine the shapes
      ZenClient already speaks. Regenerating zen/v1 into the application's tree is worse, and
      silently so: the application's `zen.v1.ZenError` becomes a DIFFERENT DART TYPE from
      zen_transport's, so the framework's own API stops type-checking against the messages the
      application built. Two copies of one proto type in one program is the failure, not the fix.

      WHAT IT DOES INSTEAD. protoc is given both contract roots with -I (jZen's and the
      application's) but only the application's protos as ARGUMENTS, so zen/v1 is resolved for
      typing and never emitted. The dangling relative imports it leaves behind are then rewritten
      to `package:zen_transport/generated/zen/v1/…`, which is a public URI because the framework
      keeps those messages outside lib/src for exactly this reason (ADR-047). Finally the task
      FAILS if a zen/v1 file landed in the application's tree anyway — the type-identity rule
      above, enforced rather than documented.

      IT FAILS ON AN EMPTY CONTRACT DIRECTORY. jZen's own task used to skip with exit 0 there.
      For an application that is wrong: proto/ with nothing in it is a broken checkout, and a
      green exit code over it is what STANDARDS "Failures surface; nothing is swallowed" forbids.
      An application that has protos but declares none of its own (all of them framework-owned,
      which is zen_demo's case) is a different, legitimate state and is reported, not failed.

      DISCOVERY IS `git ls-files`, NOT `find`, and the rewrite is parameter expansion rather than
      sed or perl — for the reason generate:l10n documents at length: on a Windows host a bare
      `find` resolves to System32's find.exe, and sed/perl may not exist at all. One program on
      every host, or no program at all.
    cmds:
      - |
        set -e
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "generate:proto:dart discovers contracts with 'git ls-files', and {{.ROOT_DIR}} is not a git work tree."
          exit 1
        fi
        if [ ! -d "{{.PROTO_DIR}}" ]; then
          echo "No {{.PROTO_DIR}}/ directory in {{.ROOT_DIR}}. The application's contracts live there;"
          echo "an absent contract root is a broken checkout, or PROTO_DIR is set wrong on the include."
          exit 1
        fi
        all=$(git ls-files -- ":(glob){{.PROTO_DIR}}/*.proto" ":(glob){{.PROTO_DIR}}/**/*.proto")
        if [ -z "$all" ]; then
          echo "{{.PROTO_DIR}}/ contains no tracked .proto files. A contract directory with no"
          echo "contract in it is a broken checkout, not a fresh one."
          exit 1
        fi
        # zen/v1 is the FRAMEWORK's namespace. If the application's own tree carries a copy it is
        # excluded here, never generated: see the type-identity paragraph in this task's summary.
        set --
        for p in $all; do
          case "$p" in
            {{.PROTO_DIR}}/zen/v1/*) continue ;;
            *) set -- "$@" "$p" ;;
          esac
        done
        if [ "$#" -eq 0 ]; then
          echo "No application protos: every .proto under {{.PROTO_DIR}}/ is framework-owned (zen/v1)."
          echo "Nothing to generate - jZen's own task owns those."
          exit 0
        fi
        command -v protoc >/dev/null 2>&1 || { echo "protoc not found. Install it and protoc_plugin (dart pub global activate protoc_plugin)."; exit 1; }
        [ -x "$HOME/.pub-cache/bin/protoc-gen-dart" ] || { echo "protoc-gen-dart not found. Run: dart pub global activate protoc_plugin"; exit 1; }
        out="{{.PROTO_DART_OUT}}"
        if [ -z "$out" ]; then out="{{.CLIENT_DIR}}/{{.APP_NAME}}_client/lib/generated"; fi
        # The output has to land inside a Dart package, or the messages compile nowhere. Walk up
        # from the output directory looking for the pubspec.yaml that owns it.
        # Terminate on the PREVIOUS value, not on a sentinel: `${p%/*}` returns p unchanged once
        # there is no slash left, so a loop that watches for "." or "/" never ends on a relative
        # path. (It did not end. That is how this comment exists.)
        pkg="$out"
        while [ ! -f "$pkg/pubspec.yaml" ]; do
          parent="${pkg%/*}"
          if [ "$parent" = "$pkg" ] || [ -z "$parent" ]; then pkg=""; break; fi
          pkg="$parent"
        done
        if [ -z "$pkg" ] || [ ! -f "$pkg/pubspec.yaml" ]; then
          echo "PROTO_DART_OUT is '$out', which is not inside a Dart package (no pubspec.yaml above it)."
          echo "Set PROTO_DART_OUT on the include to a path inside the package that should own the messages."
          exit 1
        fi
        mkdir -p "$out"
        echo ">> protoc ($# application proto(s) -> $out)"
        PATH="$HOME/.pub-cache/bin:$PATH" protoc \
          -I "{{.JZEN_DIR}}/proto" -I "{{.PROTO_DIR}}" \
          --dart_out="$out" "$@"
        # The guard, before the rewrite: if protoc emitted zen/v1 anyway (an application proto
        # listed one of jZen's as its own, a stale copy from an earlier run), stop. Leaving it
        # would give the program two incompatible definitions of the same proto type and the
        # error would surface far from here.
        if [ -d "$out/zen/v1" ]; then
          echo
          echo "REFUSING: jZen's zen/v1 messages were emitted into the application's tree at $out/zen/v1."
          echo "They must be imported from package:zen_transport, never regenerated - a second copy"
          echo "is a second, incompatible Dart type. Delete that directory and check that no"
          echo "application .proto lives under {{.PROTO_DIR}}/zen/v1."
          exit 1
        fi
        # Rewrite the relative imports protoc left pointing at zen/v1 into the package: URI that
        # actually resolves. Idempotent: a line already carrying the package: form rewrites to
        # itself. Pure parameter expansion - no sed, no perl (see the summary).
        # The file list is DERIVED from the protos that were just compiled, not discovered by a
        # walk: protoc's output path for `<proto-root>/a/b.proto` is `<out>/a/b.pb.dart` (plus
        # .pbenum.dart and .pbjson.dart when the file has enums or is imported). Deriving it
        # needs no `find` and no second opinion about which files are ours.
        rewritten=0
        for p in "$@"; do
          rel="${p#{{.PROTO_DIR}}/}"
          base="${rel%.proto}"
          for f in "$out/$base.pb.dart" "$out/$base.pbenum.dart" "$out/$base.pbjson.dart"; do
            [ -f "$f" ] || continue
            touched=0
            : > "$f.zen-tmp"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                "import '"*/zen/v1/*|"export '"*/zen/v1/*)
                  head="${line%%\'*}"
                  tail="${line#*/zen/v1/}"
                  line="${head}'package:zen_transport/generated/zen/v1/${tail}"
                  touched=1
                  ;;
              esac
              printf '%s\n' "$line" >> "$f.zen-tmp"
            done < "$f"
            mv "$f.zen-tmp" "$f"
            if [ "$touched" -eq 1 ]; then rewritten=$((rewritten + 1)); fi
          done
        done
        echo "Generated application messages -> $out ($rewritten file(s) re-pointed at package:zen_transport)"

  generate:l10n:
    desc: Generate the typed client localizations from the ARB files
    silent: true
    summary: |
      Runs `flutter gen-l10n` in every package that declares an l10n.yaml: the ARB files are the
      source, the classes under the package's generated/ directory are the output.

      Unlike the proto artifacts this output is BUILT, NOT TRACKED (STANDARDS "Code generation",
      ADR-009): gen-l10n ships inside the Flutter SDK that every consumer already has, so there is
      no toolchain boundary to carry the result across. An application's own contract gate should
      assert that none of it is tracked.

      Discovery is by l10n.yaml, never by a list, so a new localized package is picked up by
      existing here rather than by being registered somewhere.

      IT WALKS THE TREE WITH `git ls-files`, NOT `find`. On a Windows host the task shell resolves
      a bare `find` to System32's find.exe — a different program that rejects these arguments,
      writes to stderr and returns nothing — so the walk came back empty, this task announced "no
      localized packages", and the failure only surfaced minutes later as a missing generated
      import in the Windows runner build. `sort` is shadowed the same way and is gone for the same
      reason (git's output is already ordered and deduplicated). `git ls-files` is one program on
      every host, and an l10n.yaml is tracked source by definition — which also drops the
      .dart_tool/build exclusions, since a gitignored path was never a candidate.
    cmds:
      - |
        set -e
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "generate:l10n discovers localized packages with 'git ls-files', and {{.ROOT_DIR}} is not a git work tree."
          exit 1
        fi
        # Two patterns per root: the root may itself be a localized package, or contain them at
        # any depth. `:(glob)` pins the pathspec to wildmatch semantics rather than leaving them
        # to git's default for the version at hand.
        set --
        for r in {{.DART_ROOTS}}; do
          set -- "$@" ":(glob)$r/l10n.yaml" ":(glob)$r/**/l10n.yaml"
        done
        found=0
        for config in $(git ls-files -- "$@"); do
          # Parameter expansion, not `dirname`: one less program this has to find on a host.
          pkgdir="${config%/l10n.yaml}"
          if [ "$pkgdir" = "$config" ]; then pkgdir="."; fi
          found=$((found + 1))
          echo ">> flutter gen-l10n ($config)"
          (cd "{{.ROOT_DIR}}/$pkgdir" && flutter gen-l10n)
        done
        if [ "$found" -eq 0 ]; then
          echo "No localized packages found (no l10n.yaml)."
        fi

  generate:proto:java:
    desc: Regenerate the application server's proto-derived Java sources
    silent: true
    summary: |
      protoc for the JVM side is resolved by Maven itself (protobuf-maven-plugin, no host `protoc`
      needed), so this is just the `generate-sources` phase on the application's Quarkus pom,
      through jZen's `mvnw`. The framework's own DTOs come from `framework:install`; this only
      touches models the application declares under its own proto/ tree.

      An application that declares no protos of its own (every one framework-owned — zen_demo's
      case) still runs the phase cleanly; it simply emits nothing new.
    cmds:
      - |
        set -eu
        pom="{{.ROOT_DIR}}/{{.APP_SERVER_MODULE}}/pom.xml"
        if [ ! -f "$pom" ]; then
          echo ">> no server pom at {{.APP_SERVER_MODULE}}/pom.xml - nothing to generate."
          exit 0
        fi
        (cd "{{.JZEN_DIR}}/server" && ./mvnw -B -q install -DskipTests)
        echo ">> mvnw generate-sources ({{.APP_SERVER_MODULE}})"
        "{{.JZEN_DIR}}/server/mvnw" -B -q -f "$pom" generate-sources

  generate:proto:
    desc: Regenerate every proto-derived artifact the application owns (Java + Dart)
    silent: true
    summary: |
      The application half of the contract loop's proto stage: `generate:proto:java` then
      `generate:proto:dart`. The framework's own zen/v1 messages are generated once by jZen's task
      and resolved here, never re-emitted (ADR-047).
    cmds:
      - task: generate:proto:java
      - task: generate:proto:dart

  generate:api:schema:
    desc: Emit openapi.json from the application server's annotated resources (SmallRye)
    silent: true
    summary: |
      The REST surface is canonical in the SmallRye-annotated resources, not in a proto; this
      packages the application's Quarkus module (framework libs installed first) so
      store-schema-directory writes target/openapi/openapi.json. `-DskipTests` — the schema is a
      build output, not a test result.
    cmds:
      - |
        set -eu
        pom="{{.ROOT_DIR}}/{{.APP_SERVER_MODULE}}/pom.xml"
        if [ ! -f "$pom" ]; then
          echo ">> no server pom at {{.APP_SERVER_MODULE}}/pom.xml - no schema to emit."
          exit 0
        fi
        (cd "{{.JZEN_DIR}}/server" && ./mvnw -B -q install -DskipTests)
        echo ">> mvnw package -DskipTests ({{.APP_SERVER_MODULE}})"
        "{{.JZEN_DIR}}/server/mvnw" -B -q -f "$pom" package -DskipTests

  generate:api:ts:
    desc: Regenerate the admin panel's TypeScript types from openapi.json
    silent: true
    summary: |
      `pnpm run generate:types` in the application's panel. Guarded on the schema existing, so it
      is a no-op for an application with no admin panel or before the server has been packaged.
    cmds:
      - |
        set -eu
        dir="{{.ROOT_DIR}}/{{.ADMIN_DIR}}"
        schema="{{.ROOT_DIR}}/{{.APP_SERVER_MODULE}}/target/openapi/openapi.json"
        if [ ! -f "$dir/package.json" ]; then
          echo ">> no admin panel at {{.ADMIN_DIR}} - no types to generate."
          exit 0
        fi
        if [ ! -f "$schema" ]; then
          echo ">> no openapi.json yet (run generate:api:schema first) - skipping type generation."
          exit 0
        fi
        echo ">> pnpm run generate:types ({{.ADMIN_DIR}})"
        (cd "$dir" && pnpm run generate:types)

  generate:api:
    desc: Emit openapi.json, then regenerate the admin TypeScript from it
    silent: true
    cmds:
      - task: generate:api:schema
      - task: generate:api:ts

  generate:
    desc: Regenerate every cross-language artifact the application owns — no gate, always green
    silent: true
    summary: |
      What you run after editing a .proto or a resource. It regenerates (proto -> Java/Dart,
      openapi.json, admin TS, typed l10n) and exits 0 whenever the generators succeed — the drift
      gate is a SEPARATE task, `verify:contracts`, so "regenerate my code" never fails you because
      the regeneration worked.

      NOT fingerprinted with `sources:`/`generates:`, and it must never be: `verify:contracts`
      detects drift by regenerating and diffing the tree, so a skipped regeneration would make the
      gate pass having checked nothing (STANDARDS "Orchestration", "Never fingerprint a task a gate
      composes"). The native tools already skip unchanged work within their own languages.
    cmds:
      - task: generate:proto
      - task: generate:api
      - task: generate:l10n

  verify:contracts:
    desc: Regenerate everything, then FAIL if the tree drifted or tracked what must not be
    silent: true
    summary: |
      The CI gate. Runs `generate`, then asserts two properties:

        - the tracked generated artifacts (Dart messages, admin schema.generated.ts) are
          byte-identical to what is committed — a dirty tree means a .proto changed without a
          regenerate-and-commit, or a generated file was hand-edited;
        - none of the BUILT-not-tracked localizations (ADR-009) are tracked — a committed
          */l10n/generated/* file would be hand-editable with nothing to notice.

      Append this to CI. `sync:contracts` and `sync:verify` were the old names for the combined
      job; they are retired (ADR-049).
    cmds:
      - task: generate
      - task: verify:contracts:check

  verify:contracts:check:
    desc: The drift assertions alone, without regenerating first
    internal: true
    silent: true
    summary: |
      Split out so a caller that runs its OWN regeneration sequence first (the framework's
      Taskfile.yml, which also regenerates jZen's own zen-proto DTOs and zen_transport messages)
      can reuse the exact gate without double-generating.
    cmds:
      - |
        set -e
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Not a git repository, cannot verify contract sync."; exit 1
        fi
        # Scoped to the .proto SOURCES, not everything under proto/: the gate detects contract
        # drift, and a doc file beside the contract (proto/README.md) is not one.
        dirty=$(git status --porcelain -- '*.generated.ts' '*.pb.dart' '*.pbjson.dart' '*.pbenum.dart' 'proto/**/*.proto')
        if [ -n "$dirty" ]; then
          echo "Contracts are OUT OF SYNC. Regenerated output differs from what is committed:"
          echo "$dirty"
          echo
          echo "Run 'task generate' and commit the result."
          exit 1
        fi
        echo "Contracts in sync."
      - |
        set -e
        cd "{{.ROOT_DIR}}"
        tracked=$(git ls-files -- '*/l10n/generated/*')
        if [ -n "$tracked" ]; then
          echo "Generated localizations are TRACKED, and must not be (ADR-009):"
          echo "$tracked"
          echo
          echo "Run 'git rm --cached' on them; they are produced by 'task generate:l10n'."
          exit 1
        fi
        echo "Generated localizations correctly untracked."

  test:client:
    desc: Run every Dart/Flutter suite in the application's packages
    silent: true
    summary: |
      Neither `dart test` nor `flutter test` aggregates a pub workspace, so the members are walked
      here: a package depending on Flutter runs under `flutter test`, a pure-Dart one under
      `dart test`. A failing suite fails the task — nothing swallows an exit code.

      The Flutter suites compile with ZEN_ENV and ZEN_PLATFORM defines because client config is
      compile-time (ADR-007) and framework widgets assert ZEN_PLATFORM is set. ZEN_PLATFORM is the
      HOST's platform, including Windows, which git-bash reports as MINGW* — calling that host
      Linux would compile the wrong branch of every zenIsDesktop constant on the one machine able
      to check them (ADR-045).
    cmds:
      - task: generate:l10n
      - |
        set -e
        case "$(uname -s)" in
          Darwin)                 host_platform=macos ;;
          Linux)                  host_platform=linux ;;
          MINGW*|MSYS*|CYGWIN*)   host_platform=windows ;;
          *)                      host_platform=linux ;;
        esac
        cd "{{.ROOT_DIR}}"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "test:client discovers packages with 'git ls-files', and {{.ROOT_DIR}} is not a git work tree."
          exit 1
        fi
        # `git ls-files`, not `find | sort` — see generate:l10n. Both of those names belong to
        # unrelated System32 programs on a Windows host, and a walk that comes back empty there
        # would report "no packages" and exit green, which is a test task that tested nothing.
        set --
        for root in {{.DART_ROOTS}}; do
          set -- "$@" ":(glob)$root/pubspec.yaml" ":(glob)$root/**/pubspec.yaml"
        done
        found=0
        for pubspec in $(git ls-files -- "$@"); do
          pkgdir="${pubspec%/pubspec.yaml}"
          if [ "$pkgdir" = "$pubspec" ]; then pkgdir="."; fi
          if [ ! -d "$pkgdir/test" ]; then continue; fi
          found=1
          if grep -qE '^[[:space:]]*(flutter|flutter_test):' "$pubspec"; then
            echo ">> flutter test ($pkgdir)"
            (cd "$pkgdir" && flutter test --dart-define=ZEN_ENV={{.ZEN_ENV}} --dart-define=ZEN_PLATFORM="$host_platform")
          else
            echo ">> dart test ($pkgdir)"
            (cd "$pkgdir" && dart test)
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "No test directories found under {{.DART_ROOTS}}."
        fi

  build:runners:
    desc: Compile every delivery runner this host can build — the targets tests never touch
    silent: true
    summary: |
      A Flutter dependency does not enter one platform, it enters all of them, and each has its
      own build system that can reject it on its own terms. No test compiles a runner: unit and
      widget tests run on the Dart VM and the flutter tester, which never invoke Xcode, Gradle,
      CMake or MSBuild. So a change can leave every suite green and every shippable artifact
      broken. This is what answers that question.

      DESKTOP AND APPLE TARGETS ARE HOST-ONLY. Flutter refuses `build linux` off Linux, `build
      windows` off Windows, and the Apple targets need Xcode. No single machine verifies all five,
      which is why the skips below are announced rather than silent, and why an application's CI
      needs more than one operating system to make its platform list true (ADR-045).

      Set APP_CLIENT_DIR to the Flutter application package (it defaults to the client tier).
      Artifacts are throwaway: this is a compile check, which is why the API URL is a placeholder.
    vars:
      APP_CLIENT_DIR: '{{.APP_CLIENT_DIR | default .CLIENT_DIR}}'
      SCHEME: '{{.ZEN_AUTH_REDIRECT_URI | default ""}}'
      # Read, not set: Flutter takes the Android JDK from a machine-wide setting that outranks
      # JAVA_HOME, so no task can fix it from inside a repository - only name it before a build
      # wastes minutes failing on it (ADR-021).
      FLUTTER_JDK:
        # A block scalar, not an inline one: the sed script contains ": ", which YAML would
        # otherwise read as a mapping and refuse to parse.
        sh: |
          flutter config --list 2>/dev/null | sed -nE 's/^ *jdk-dir: *(.*)$/\1/p' | head -1
    cmds:
      - task: generate:l10n
      - |
        set -eu
        cd "{{.ROOT_DIR}}/{{.APP_CLIENT_DIR}}"
        defines="--dart-define=ZEN_ENV={{.ZEN_ENV}} --dart-define=ZEN_API_URL={{.API}}"
        if [ -n '{{.SCHEME}}' ]; then
          defines="$defines --dart-define=ZEN_AUTH_REDIRECT_URI={{.SCHEME}}"
        fi

        case "$(uname -s)" in
          Darwin)                 HOST=macos ;;
          Linux)                  HOST=linux ;;
          MINGW*|MSYS*|CYGWIN*)   HOST=windows ;;
          *)                      HOST=unknown ;;
        esac

        # `if`, never `[ -d x ] && build || true`: that idiom turns a FAILED build into a pass,
        # because the `|| true` cannot tell a missing directory from a compiler error. Nothing
        # here swallows a failure (STANDARDS, "Failures surface").
        build_target() {
          target="$1"; platform="$2"; needs="$3"; dir="$4"; shift 4
          if [ ! -d "$dir" ]; then
            return 0
          fi
          if [ "$HOST" != "$needs" ]; then
            echo ">> SKIPPED $target: it only builds on a $needs host, and this is $(uname -s)."
            return 0
          fi
          echo ">> $target"
          flutter build "$@" --debug --dart-define=ZEN_PLATFORM="$platform" $defines
        }

        build_target "macOS"           macos   macos   macos   macos
        build_target "iOS simulator"   ios     macos   ios     ios --simulator
        build_target "Linux desktop"   linux   linux   linux   linux
        build_target "Windows desktop" windows windows windows windows

        # Android last: it is the one that fails for a reason no error message names. Skipped on a
        # Windows host, where pulling a full Android SDK would double a job for a target any Linux
        # or macOS host already covers.
        if [ -d android ] && [ "$HOST" != "windows" ]; then
          JDK='{{.FLUTTER_JDK}}'
          BAD=""
          case "$JDK" in *graal*|*Graal*|*GRAAL*) BAD="yes" ;; esac
          if [ -z "$BAD" ] && [ -n "$JDK" ] && [ -x "$JDK/bin/java" ]; then
            case "$("$JDK/bin/java" -version 2>&1 | head -1)" in *GraalVM*) BAD="yes" ;; esac
          fi
          if [ -n "$BAD" ]; then
            echo "The Android build cannot use this JDK: GraalVM (its jlink cannot run AGP's jdkImage transform)."
            echo "Flutter takes it from a MACHINE-WIDE setting that outranks JAVA_HOME, so no task can fix it here:"
            echo "  flutter config --jdk-dir /path/to/a/standard/jdk-25"
            exit 1
          fi
          echo ">> Android"
          flutter build apk --debug --dart-define=ZEN_PLATFORM=android $defines
        elif [ -d android ]; then
          echo ">> SKIPPED Android here: covered by any Linux or macOS host, which already has the SDK."
        fi
        echo
        echo "Every runner this host can build compiles."

  # ---------------------------------------------------------------------------
  # Run the application locally
  # ---------------------------------------------------------------------------
  #
  # The single-tier tasks (run:supabase / run:server / run:client / run:admin) are the composable
  # primitives; run:dev is the rollup that brings the stack up together with one Ctrl-C that tears
  # it all down. The process-management shape — background PIDs, a port-scoped teardown, `trap` on
  # EXIT — is generalised from Taskfile.yml's run:demo, which proved it against zen_demo.
  run:supabase:
    desc: Start the local Supabase stack — idempotent; prints the URLs a developer needs
    silent: true
    summary: |
      Starts the application's local Supabase stack (ports are whatever the consumer's
      supabase/config.toml sets). Idempotent: an already-running stack is left alone, not
      restarted, so this is safe to run before anything else — run:dev depends on it.

      After the stack is up it prints the URLs resolved from `supabase status`. THE MAILBOX LINE
      IS THE ONE TO REMEMBER when testing sign-up: a local Supabase mails nothing to the outside
      world, so the confirmation and recovery links — and any `*://auth-callback` deep link —
      land in the local mailbox rather than a real inbox.
    cmds:
      - |
        set -eu
        command -v supabase >/dev/null 2>&1 || {
          echo "supabase CLI not found on PATH: https://supabase.com/docs/guides/cli"
          exit 1
        }
        if supabase status >/dev/null 2>&1; then
          echo "Supabase already running."
        else
          supabase start
        fi
        eval "$(supabase status -o env | sed 's/^/SB_/')"
        studio="${SB_STUDIO_URL:-}"
        mailbox="${SB_INBUCKET_URL:-${SB_MAILPIT_URL:-}}"
        db="${SB_DB_URL:-}"
        echo
        [ -n "$studio" ]  && echo "  Studio:    $studio" || true
        [ -n "$mailbox" ] && echo "  Mailbox:   $mailbox   <- email confirmation + recovery links arrive here" || true
        [ -n "$db" ]      && echo "  Postgres:  $db" || true

  run:server:
    desc: Start the application backend in Quarkus dev mode (live reload) on APP_PORT
    silent: true
    summary: |
      Installs the jZen framework libraries, then runs the application's Quarkus module in dev mode
      through jZen's `mvnw` (the module has no wrapper of its own). APP_PORT defaults to 8085 to
      dodge a leftover stack on :8080.

      Exports a default CORS_ORIGINS that already names the client's web origin
      (http://localhost:WEB_PORT), so a plain `task run:client` is allowed from the browser
      without extra flags. Set CORS_ORIGINS yourself to override — run:client checks its web
      origin against the same value.

      Wires the local Supabase credentials (SUPABASE_URL / SUPABASE_KEY) from `supabase status`
      the same way run:dev does — the anon key is per-stack, not a constant, so a backend started
      without it 500s every auth call. depends on run:supabase so the stack is up first.
    deps: [run:supabase]
    cmds:
      - |
        set -eu
        pom="{{.ROOT_DIR}}/{{.APP_SERVER_MODULE}}/pom.xml"
        [ -f "$pom" ] || { echo "no server pom at {{.APP_SERVER_MODULE}}/pom.xml"; exit 1; }
        export CORS_ORIGINS="${CORS_ORIGINS:-http://localhost:{{.WEB_PORT}},http://localhost:8080,http://localhost:5173}"
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_ANON_KEY}"
        (cd "{{.JZEN_DIR}}/server" && ./mvnw -B -q install -DskipTests)
        "{{.JZEN_DIR}}/server/mvnw" -f "$pom" quarkus:dev -Dquarkus.http.port="{{.APP_PORT}}"

  run:client:
    desc: Run the Flutter application, pointed at a local backend (DEVICE selects the target)
    silent: true
    summary: |
      `flutter run -d DEVICE` (default `chrome`, on a fixed WEB_PORT so the server's CORS allowlist
      can name it) with the compile-time client config baked in. Set APP_CLIENT_DIR if the Flutter
      package is not `<client>/<app>_client`; set CLIENT_PLATFORM for a device whose name does not
      say its platform.

      Three operator guards run before the app launches, because each failure they catch otherwise
      surfaces as an opaque "broken backend" in the browser:

        - ZEN_PLATFORM is inferred from DEVICE where the name is unambiguous (chrome/edge/web-server
          -> web, macos/linux/windows -> themselves). For an arbitrary id (an emulator, a UDID) it
          cannot be guessed — a wrong ZEN_PLATFORM compiles cleanly and is wrong at runtime — so
          the task fails and asks for CLIENT_PLATFORM explicitly.
        - The backend must answer /api/v1/health. If nothing does, the app would load and fail its
          first call; the task says to start run:server instead.
        - For a web target, the client's origin (http://localhost:WEB_PORT) must be in the server's
          CORS allowlist (CORS_ORIGINS, defaulted to what run:server exports). If not, every
          credentialed call is rejected 403 "CORS Rejected - Invalid origin"; the task prints the
          one-line fix.
    vars:
      APP_CLIENT_DIR: '{{.APP_CLIENT_DIR | default (printf "%s/%s_client" .CLIENT_DIR .APP_NAME)}}'
      PLATFORM:
        sh: |
          explicit='{{.CLIENT_PLATFORM | default ""}}'
          if [ -n "$explicit" ]; then echo "$explicit"; exit 0; fi
          case "{{.DEVICE}}" in
            chrome|edge|web-server) echo web ;;
            macos)                  echo macos ;;
            linux)                  echo linux ;;
            windows)                echo windows ;;
            *)                      echo "" ;;
          esac
    cmds:
      - task: generate:l10n
      - |
        set -eu
        platform='{{.PLATFORM}}'
        if [ -z "$platform" ]; then
          echo "Cannot infer ZEN_PLATFORM from DEVICE='{{.DEVICE}}'."
          echo "Pass it explicitly:  task run:client DEVICE={{.DEVICE}} CLIENT_PLATFORM=android"
          exit 1
        fi

        api="{{.API}}"
        curl -sf "$api/api/v1/health" >/dev/null 2>&1 || {
          echo "No backend answering on {{.APP_PORT}} — run 'task run:server' in another terminal."
          exit 1
        }

        cd "{{.ROOT_DIR}}/{{.APP_CLIENT_DIR}}"
        defines="--dart-define=ZEN_ENV={{.ZEN_ENV}} --dart-define=ZEN_PLATFORM=$platform --dart-define=ZEN_API_URL=$api"
        # A custom-scheme redirect (myapp://auth-callback) is native-only by construction: handing
        # one to a web build makes the server refuse the unlisted address as invalid_redirect. Pass
        # it only when the resolved platform is not web.
        if [ -n '{{.AUTH_REDIRECT_URI}}' ] && [ "$platform" != web ]; then
          defines="$defines --dart-define=ZEN_AUTH_REDIRECT_URI={{.AUTH_REDIRECT_URI}}"
        fi
        case "{{.DEVICE}}" in
          chrome|web-server|edge)
            allowed="${CORS_ORIGINS:-http://localhost:{{.WEB_PORT}},http://localhost:8080,http://localhost:5173}"
            case ",$allowed," in
              *",http://localhost:{{.WEB_PORT}},"*) ;;
              *)
                echo "WEB_PORT={{.WEB_PORT}} is not in the server's CORS allowlist. Either drop WEB_PORT, or"
                echo "start the server with:  CORS_ORIGINS=http://localhost:{{.WEB_PORT}} task run:server"
                exit 1 ;;
            esac
            set -- --web-port="{{.WEB_PORT}}" ;;
          *) set -- ;;
        esac
        exec flutter run -d "{{.DEVICE}}" "$@" $defines

  run:admin:
    desc: Start the application admin panel's dev server (proxies /api to the backend)
    silent: true
    cmds:
      - |
        set -eu
        dir="{{.ROOT_DIR}}/{{.ADMIN_DIR}}"
        [ -f "$dir/package.json" ] || { echo "no admin panel at {{.ADMIN_DIR}}"; exit 1; }
        cd "$dir" && exec pnpm dev

  run:dev:
    desc: Bring up Supabase + the backend + the client together; one Ctrl-C tears it all down
    silent: true
    summary: |
      The local development rollup, following the `quarkus dev` / `npm run dev` convention. Starts
      the Supabase stack, the backend in dev mode on APP_PORT, waits for /health, then runs the
      client on DEVICE (default web on WEB_PORT). The server is torn down on exit — by its port
      system-property first (dependable across shells), then a port-scoped lsof fallback that
      escalates to SIGKILL. Supabase is left running — the teardown message says so — and
      `task stop:supabase` (or the framework's) stops it.

      This is a manual-walkthrough rollup, so one Ctrl-C ends it cleanly and at once. The
      orchestration runs in `scripts/run-dev.sh` (a real bash script — go-task's own shell can
      only trap EXIT, which fires a signal too late): it starts server and client each in their
      own process group with `set -m`, so the first Ctrl-C reaches only the script and its
      `trap … INT TERM EXIT` handler drives an ordered teardown — client from its `--pid-file`
      (TERM→KILL), then the server by its port. The client also runs with stdin closed (no
      interactive `r`/`R`/`q` keys — use `task run:client` for a hot-reload loop).

      DEVICE is a passthrough to the client. WEB_PORT is fixed and named in CORS_ORIGINS so the
      browser's credentialed calls are allowed from the client's web origin — here the CORS check
      is a cheap assertion, since this task exports CORS_ORIGINS itself. ZEN_PLATFORM is inferred
      from DEVICE (see run:client); an unrecognised device id fails asking for CLIENT_PLATFORM.
    deps: [run:supabase]
    vars:
      APP_CLIENT_DIR: '{{.APP_CLIENT_DIR | default (printf "%s/%s_client" .CLIENT_DIR .APP_NAME)}}'
      PLATFORM:
        sh: |
          explicit='{{.CLIENT_PLATFORM | default ""}}'
          if [ -n "$explicit" ]; then echo "$explicit"; exit 0; fi
          case "{{.DEVICE}}" in
            chrome|edge|web-server) echo web ;;
            macos)                  echo macos ;;
            linux)                  echo linux ;;
            windows)                echo windows ;;
            *)                      echo "" ;;
          esac
    cmds:
      - task: generate:l10n
      - |
        set -euo pipefail
        PORT="{{.APP_PORT}}"
        WEB_PORT="{{.WEB_PORT}}"
        API="http://localhost:${PORT}"
        pom="{{.ROOT_DIR}}/{{.APP_SERVER_MODULE}}/pom.xml"
        [ -f "$pom" ] || { echo "no server pom at {{.APP_SERVER_MODULE}}/pom.xml"; exit 1; }

        platform='{{.PLATFORM}}'
        if [ -z "$platform" ]; then
          echo "Cannot infer ZEN_PLATFORM from DEVICE='{{.DEVICE}}'."
          echo "Pass it explicitly:  task run:dev DEVICE={{.DEVICE}} CLIENT_PLATFORM=android"
          exit 1
        fi

        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_ANON_KEY}"
        export CORS_ORIGINS="http://localhost:${WEB_PORT},http://localhost:8080,http://localhost:5173"

        case "{{.DEVICE}}" in
          chrome|web-server|edge)
            case ",${CORS_ORIGINS}," in
              *",http://localhost:${WEB_PORT},"*) ;;
              *) echo "WEB_PORT=${WEB_PORT} is not in CORS_ORIGINS — cannot serve the web client"; exit 1 ;;
            esac ;;
        esac

        defines="--dart-define=ZEN_ENV={{.ZEN_ENV}} --dart-define=ZEN_PLATFORM=${platform} --dart-define=ZEN_API_URL=${API}"
        # Native-only by construction — see run:client. A web build must not get a custom-scheme
        # redirect or the server refuses it as invalid_redirect.
        if [ -n '{{.AUTH_REDIRECT_URI}}' ] && [ "$platform" != web ]; then
          defines="$defines --dart-define=ZEN_AUTH_REDIRECT_URI={{.AUTH_REDIRECT_URI}}"
        fi
        case "{{.DEVICE}}" in
          chrome|web-server|edge) flutter_args="-d {{.DEVICE}} --web-port=${WEB_PORT}" ;;
          *)                      flutter_args="-d {{.DEVICE}}" ;;
        esac

        # The orchestration — start server, wait for health, start client, and tear BOTH
        # down on the FIRST Ctrl-C — runs in a real bash script, not here. go-task's shell
        # (mvdan/sh) rejects `trap ... INT` and `set -m`, so an inline body can only clean
        # up from an EXIT trap that fires after `flutter run` returns, i.e. after a *second*
        # signal (issue #83). scripts/run-dev.sh gets a genuine process-group-isolated,
        # signal-trapped teardown. Every value is computed here and passed as environment.
        export RUN_DEV_PORT="${PORT}" RUN_DEV_API="${API}" RUN_DEV_POM="$pom"
        export RUN_DEV_JZEN_DIR="{{.JZEN_DIR}}"
        export RUN_DEV_CLIENT_DIR="{{.ROOT_DIR}}/{{.APP_CLIENT_DIR}}"
        export RUN_DEV_FLUTTER_ARGS="${flutter_args}" RUN_DEV_DEFINES="${defines}"
        exec bash "{{.JZEN_DIR}}/scripts/run-dev.sh"
