# jZen global orchestrator.
#
# Taskfile triggers native tools; it never replaces them. `mvnw` owns Java resolution,
# `dart pub` owns Dart, `pnpm` owns TypeScript. Every task below shells out to the tool
# that already knows how to do the job.
#
# Folders use industry names: server/ (Java backend), client/ (Dart/Flutter), admin/
# (ReactAdmin). Task groups follow: deps:server / build:client / test:admin, etc.
#
# Install: brew install go-task/tap/go-task   (see `task doctor`)
version: "3"

vars:
  # server/ + client/ are the Java + Dart FRAMEWORK libraries; apps/ holds the full-stack
  # application examples that assemble them (apps/<app>/{<app>_client, <app>_server}).
  SERVER_DIR: server
  CLIENT_DIR: client
  APPS_DIR: apps
  # admin/ is the framework's reusable react-admin scaffold (@jzen/admin-core, ADR-005); each
  # app assembles it into its own panel under apps/<app>/<app>_admin.
  ADMIN_DIR: admin
  PROTO_DIR: proto
  # The runnable reference backend (the only Quarkus app) is apps/zen_demo/zen_demo_server.
  DEMO_SERVER_DIR: apps/zen_demo/zen_demo_server
  DEMO_CLIENT_DIR: apps/zen_demo/zen_demo_client
  # The zen_demo app's admin panel: assembles @jzen/admin-core, owns the generated schema.
  DEMO_ADMIN_DIR: apps/zen_demo/zen_demo_admin
  OPENAPI_JSON: apps/zen_demo/zen_demo_server/target/openapi/openapi.json

  # `dart format` over a workspace, minus the tracked generated protobuf. It has no ignore file
  # and does not read `analyzer: exclude:` (that governs analysis), so the exclusion lives here.
  # Formatting a generated file makes `sync:contracts` report drift the next time protoc runs.
  # Width is NOT passed as a flag: it is declared in each workspace's analysis_options.yaml so an
  # IDE format-on-save produces the same result as this task.
  DART_FORMAT: >-
    find . -name '*.dart' ! -path '*/generated/*' ! -path '*/.dart_tool/*' -print0
    | xargs -0 dart format

  # Cloud Run coordinates, overridable via the environment.
  GCP_PROJECT: '{{.GCP_PROJECT | default "CHANGEME-jzen"}}'
  GCP_REGION: '{{.GCP_REGION | default "europe-central2"}}'
  SERVICE_NAME: '{{.SERVICE_NAME | default "zen-demo-server"}}'
  AR_REPO: '{{.AR_REPO | default "jzen"}}'

  # Cloud Run CAPACITY. These are the APPLICATION's choice, not the framework's (ADR-028):
  # the repo root is language- and application-neutral, so hardcoding one app's cost envelope
  # here would fix it for every app that will ever assemble jZen. Today's values are the
  # defaults, so zen_demo's posture is unchanged — but an operator may override any of them,
  # and `task deploy:cloudrun --summary` states what each one silently invalidates.
  SERVICE_MEMORY: '{{.SERVICE_MEMORY | default "256Mi"}}'
  SERVICE_CPU: '{{.SERVICE_CPU | default "1"}}'
  SERVICE_MIN_INSTANCES: '{{.SERVICE_MIN_INSTANCES | default "0"}}'
  SERVICE_MAX_INSTANCES: '{{.SERVICE_MAX_INSTANCES | default "1"}}'
  SERVICE_CONCURRENCY: '{{.SERVICE_CONCURRENCY | default "200"}}'
  # 60s, not Cloud Run's 300s default. The timeout is a denial-of-service lever: holding all
  # SERVICE_CONCURRENCY slots costs an attacker concurrency/timeout requests per second, so
  # 300s made saturation cost 0.67 req/s — one slow connection. Sized by MEASUREMENT, not
  # guess: the heaviest operation in the service (the hourly retention trigger) completes in
  # 3.7s including a 3.0s cold boot, so under a second of actual work (ADR-027). Cloud Run's
  # timeout is per SERVICE, not per route, so this one value has to cover that job too — 60s
  # is two orders of magnitude of headroom over it.
  SERVICE_TIMEOUT: '{{.SERVICE_TIMEOUT | default "60s"}}'

  # Where build:web stages the Flutter bundle so the native build bakes it in and Quarkus
  # serves the web app same-origin with the API. Gitignored (see the .gitignore there).
  WEB_RESOURCES: apps/zen_demo/zen_demo_server/src/main/resources/META-INF/resources

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ---------------------------------------------------------------------------
  # Environment
  # ---------------------------------------------------------------------------
  doctor:
    desc: Check that every required tool is present AND at the pinned version
    silent: true
    summary: |
      Checks presence and, for the four build-input tools, the pinned version.

      It used to check presence only, which meant "JDK 25" was documentation rather than
      enforcement: a contributor on another version got a green doctor and a confusing
      failure later, or worse, silently different output. `task format` is the live case —
      the committed Dart layout is what Dart 3.12.2 produces.

      EACH PIN LIVES WHERE ITS OWN ECOSYSTEM ALREADY LOOKS FOR IT, and this task reads those
      files rather than restating a version:

        .sdkmanrc      java     SDKMAN     `sdk env`
        .fvmrc         flutter  FVM        `fvm use` (Flutter carries Dart, so this pins Dart)
        .nvmrc         node     nvm        `nvm use`
        package.json   pnpm     corepack   "packageManager", which corepack enforces itself

      No universal version manager sits over the top of those. That is the same rule the
      orchestrator follows (DECISIONS.md ADR-014): the native tool owns its domain, and a
      layer above it would be a portability layer nothing here asks for. The pnpm entry is
      the cleanest case — corepack reads "packageManager" to decide which pnpm to run, so
      the pin and its enforcement are literally the same field.

      doctor reports drift; the ecosystem tool fixes it. Tools with no pin are presence-only,
      each for a reason given beside its check below.
    cmds:
      - |
        set -e
        missing=0
        # Each pin is read from the file its own ecosystem already reads, so a version is
        # never restated here and the check cannot drift from what the tools enforce.
        pin_java()    { sed -n 's/^java=\([0-9][0-9.]*\).*/\1/p' .sdkmanrc | head -1; }
        pin_flutter() { sed -n 's/.*"flutter" *: *"\([^"]*\)".*/\1/p' .fvmrc | head -1; }
        pin_node()    { tr -d 'v \n' < .nvmrc; }
        pin_pnpm()    { sed -n 's/.*"packageManager" *: *"pnpm@\([^"]*\)".*/\1/p' "$1" | head -1; }

        # Presence only. Used for tools that are services, clients, or codegen extras.
        check() {
          if command -v "$1" >/dev/null 2>&1; then
            printf '  \033[32mok\033[0m   %-14s %s\n' "$1" "$($2 2>&1 | head -1)"
          else
            printf '  \033[31mMISS\033[0m %-14s %s\n' "$1" "$3"
            missing=1
          fi
        }

        # Presence AND version. $2 must print a BARE version (e.g. 25.0.2), so the comparison
        # never depends on how a tool decorates its output. $5 names the tool that fixes a
        # drift, because that differs per ecosystem — which is the point of pinning natively.
        # A match is equality or a dot-boundary prefix, so a pin of "25" accepts 25.0.2 and
        # rejects 21.0.5 — including when 21 was built in a year containing "25".
        checkv() {
          name=$1; ver_cmd=$2; hint=$3; want=$4; fix=$5
          if ! command -v "$name" >/dev/null 2>&1; then
            printf '  \033[31mMISS\033[0m %-14s %s\n' "$name" "$hint"; missing=1; return
          fi
          got=$(eval "$ver_cmd" 2>/dev/null | head -1)
          if [ "$got" = "$want" ] || [ "${got#"$want".}" != "$got" ]; then
            printf '  \033[32mok\033[0m   %-14s %s\n' "$name" "$got"
          else
            printf '  \033[31mDRIFT\033[0m %-13s %s (want %s)\n' "$name" "$got" "$want"
            printf '       %-14s run: %s\n' "" "$fix"
            missing=1
          fi
        }

        # Presence AND a MINIMUM version, which is a third category from the two above and is
        # explained in STANDARDS "Scripting": a version is PINNED when it shapes a build artifact
        # and FLOORED when it only has to run. Python is the only floored tool — it returns
        # verdicts and seeds a dev database, so any interpreter at or above the floor does, and
        # flooring rather than pinning is what keeps the scripts working on a Mac carrying nothing
        # but Xcode's Command Line Tools. $2 must print a BARE version, same contract as checkv.
        checkmin() {
          name=$1; ver_cmd=$2; hint=$3; want=$4
          if ! command -v "$name" >/dev/null 2>&1; then
            printf '  \033[31mMISS\033[0m %-14s %s\n' "$name" "$hint"; missing=1; return
          fi
          got=$(eval "$ver_cmd" 2>/dev/null | head -1)
          # major/minor compared as integers, never as text: a string compare ranks 3.9 above
          # 3.10, which would reject every modern interpreter and accept nothing but the floor.
          maj=${got%%.*}; rest=${got#*.}; min=${rest%%.*}
          wmaj=${want%%.*}; wmin=${want#*.}
          if [ "$maj" -gt "$wmaj" ] 2>/dev/null || { [ "$maj" -eq "$wmaj" ] && [ "$min" -ge "$wmin" ]; } 2>/dev/null; then
            printf '  \033[32mok\033[0m   %-14s %s (floor %s)\n' "$name" "$got" "$want"
          else
            printf '  \033[31mOLD\033[0m  %-14s %s (need >= %s)\n' "$name" "$got" "$want"
            missing=1
          fi
        }

        echo "jZen toolchain (each version pinned in its own ecosystem's file):"
        checkv java    "java -version 2>&1 | sed -n '1s/.*\"\([0-9][^\"]*\)\".*/\1/p'" "sdk env install"                              "$(pin_java)"    "sdk env"
        checkv flutter "flutter --version | awk 'NR==1{print \$2}'"                    "https://docs.flutter.dev/get-started/install" "$(pin_flutter)" "fvm use"
        checkv node    "node --version | tr -d v"                                      "nvm install"                                  "$(pin_node)"    "nvm use"
        checkv pnpm    "pnpm --version"                                                "corepack enable"                              "$(pin_pnpm admin/package.json)" "corepack enable"

        # The two package.json files must agree, or corepack would enforce a different pnpm
        # per package and doctor would only ever see the first one.
        pm_core=$(pin_pnpm admin/package.json)
        pm_app=$(pin_pnpm {{.DEMO_ADMIN_DIR}}/package.json)
        if [ "$pm_core" != "$pm_app" ]; then
          printf '  \033[31mDRIFT\033[0m %-13s packageManager disagrees: admin=%s demo_admin=%s\n' "pnpm pin" "$pm_core" "$pm_app"
          missing=1
        fi

        echo "Present-but-unpinned, each for a reason:"
        check dart     "dart --version"      "comes with Flutter; never install separately — .fvmrc pins it"
        check supabase "supabase --version"  "a local dev service, not a build input: brew install supabase/tap/supabase"
        check docker   "docker --version"    "a daemon, not a toolchain version: https://docs.docker.com/get-docker"
        check gcloud   "gcloud --version"    "a deploy-time client, expected to self-update: https://cloud.google.com/sdk/docs/install"
        # Floored, not pinned (STANDARDS "Scripting", DECISIONS.md ADR-032). The interpreter is
        # asked for its own version rather than having it parsed out of --version text. Until this
        # line existed, run:demo:native failed with a raw `env: python3: No such file` — the only
        # tool in the repository doctor could not see.
        checkmin python3 "python3 -c 'import platform; print(platform.python_version())'" \
                 "the dev-loop scripting runtime beside sh: comes with Xcode CLT, or brew install python" "3.9"
        echo "Dart protobuf codegen (needed by generate:proto, not by the Java build):"
        check protoc   "protoc --version"    "brew install protobuf"
        if [ -x "$HOME/.pub-cache/bin/protoc-gen-dart" ]; then
          printf '  \033[32mok\033[0m   %-14s %s\n' "protoc-gen-dart" "$HOME/.pub-cache/bin/protoc-gen-dart"
        else
          printf '  \033[31mMISS\033[0m %-14s %s\n' "protoc-gen-dart" "dart pub global activate protoc_plugin"
          missing=1
        fi
        # The switchers are optional: a matching version installed any other way is still a
        # match, so their absence is a note rather than a failure — they are only what makes
        # fixing a drift a one-liner.
        #
        # SDKMAN and nvm are SHELL FUNCTIONS sourced into an interactive shell, not binaries, so
        # `command -v sdk` fails here even when they are installed and on PATH. Probing for their
        # init script is what actually answers the question; probing the command name would
        # report every user of them as not having them. FVM really is a binary.
        [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ] || \
          printf '  \033[33mnote\033[0m %-14s not found, so .sdkmanrc cannot be applied — https://sdkman.io\n' "sdkman"
        [ -s "$HOME/.nvm/nvm.sh" ] || \
          printf '  \033[33mnote\033[0m %-14s not found, so .nvmrc cannot be applied — https://github.com/nvm-sh/nvm\n' "nvm"
        command -v fvm >/dev/null 2>&1 || \
          printf '  \033[33mnote\033[0m %-14s not installed, so .fvmrc cannot be applied — brew tap leoafarias/fvm && brew install fvm\n' "fvm"
        echo
        # protoc is NOT required for the Java build: protobuf-maven-plugin resolves the
        # protoc binary from Maven Central (see server/zen-proto/pom.xml).
        if [ "$missing" -eq 0 ]; then echo "Toolchain matches the pinned versions."; else
          echo "Toolchain is missing a tool or drifted from a pin. See the fix beside each line above."; exit 1; fi

  deps:
    desc: Resolve dependencies for every sub-project (native tools do the work)
    deps: [deps:server, deps:client, deps:admin]

  deps:server:
    desc: Resolve Maven dependencies
    dir: "{{.SERVER_DIR}}"
    cmds:
      - ./mvnw -B -q dependency:go-offline

  deps:client:
    desc: Resolve the Dart pub workspace
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - dart pub get

  deps:admin:
    desc: Install admin dependencies (framework scaffold + zen_demo panel)
    cmds:
      - cd {{.ADMIN_DIR}} && pnpm install
      - cd {{.DEMO_ADMIN_DIR}} && pnpm install

  # ---------------------------------------------------------------------------
  # Code generation - proto is upstream, OpenAPI is derived
  # ---------------------------------------------------------------------------
  #
  #   proto/zen/v1/*.proto            (canonical models)
  #     |-- protoc --> Java DTOs      (protobuf-maven-plugin, in server/zen-proto)
  #     |-- protoc --> Dart messages  (protoc_plugin, here)
  #     v
  #   Java resources + SmallRye --> openapi.json  (canonical REST surface)
  #     v
  #   openapi-typescript --> admin types
  #
  generate:proto:
    desc: Generate Java and Dart code from proto/
    cmds:
      - task: generate:proto:java
      - task: generate:proto:dart

  generate:proto:java:
    desc: Generate Java DTOs from proto/ (protoc resolved from Maven Central)
    dir: "{{.SERVER_DIR}}"
    cmds:
      - ./mvnw -B -q -pl zen-proto generate-sources

  generate:proto:dart:
    desc: Generate Dart messages from proto/
    silent: true
    cmds:
      - |
        set -e
        shopt -s nullglob
        protos=({{.PROTO_DIR}}/zen/v1/*.proto)
        if [ ${#protos[@]} -eq 0 ]; then
          echo "No .proto files yet, skipping Dart codegen."
          exit 0
        fi
        command -v protoc >/dev/null 2>&1 || { echo "protoc not found. Run: task doctor"; exit 1; }
        [ -x "$HOME/.pub-cache/bin/protoc-gen-dart" ] || { echo "protoc-gen-dart not found. Run: dart pub global activate protoc_plugin"; exit 1; }
        out={{.CLIENT_DIR}}/zen_transport/lib/src/generated
        mkdir -p "$out"
        PATH="$HOME/.pub-cache/bin:$PATH" protoc -I {{.PROTO_DIR}} --dart_out="$out" "${protos[@]}"
        echo "Generated Dart messages -> $out"

  generate:l10n:
    desc: Generate the typed client localizations from the ARB files
    silent: true
    summary: |
      Runs `flutter gen-l10n` in every package that declares an l10n.yaml: the ARB files
      under lib/src/l10n are the source, the classes under lib/src/l10n/generated are the output.
      (The zen_ui_navigation example has no lib/src, so its pair sits at lib/l10n.)

      Unlike the proto and OpenAPI artifacts, this output is BUILT, NOT TRACKED (see
      STANDARDS "Code generation" and DECISIONS.md ADR-009): gen-l10n ships inside the
      Flutter SDK that every consumer of these packages already has, so there is no
      toolchain boundary to carry the result across. It is gitignored, produced here, and
      sync:contracts asserts that none of it is tracked.
    cmds:
      - |
        set -e
        found=0
        for config in $(find {{.CLIENT_DIR}} {{.APPS_DIR}} -name l10n.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' | sort); do
          pkgdir=$(dirname "$config")
          found=$((found + 1))
          echo ">> flutter gen-l10n ($pkgdir)"
          (cd "$pkgdir" && flutter gen-l10n)
        done
        if [ "$found" -eq 0 ]; then
          echo "No localized packages found (no l10n.yaml)."
        fi

  generate:api:
    desc: Build the backend, emit openapi.json, and generate admin types
    cmds:
      - task: generate:api:schema
      - task: generate:api:ts

  generate:api:schema:
    desc: Emit openapi.json from the reference backend's annotated resources (SmallRye)
    dir: "{{.SERVER_DIR}}"
    cmds:
      # Install the framework libs so the app can resolve them, then package the app (the only
      # Quarkus module) via the shared wrapper with -f. store-schema-directory writes the schema.
      - ./mvnw -B -q install -DskipTests
      - ./mvnw -B -q -f ../{{.DEMO_SERVER_DIR}}/pom.xml package -DskipTests

  generate:api:ts:
    desc: Generate admin types from openapi.json
    dir: "{{.DEMO_ADMIN_DIR}}"
    status:
      # openapi.json is a sibling of the panel (apps/zen_demo/{zen_demo_server,zen_demo_admin}).
      - test ! -f ../zen_demo_server/target/openapi/openapi.json
    cmds:
      - pnpm run generate:types

  sync:contracts:
    desc: Regenerate every cross-language artifact and FAIL if anything drifted
    summary: |
      The atomic contract sync. Regenerates Java DTOs, Dart messages, openapi.json and
      the admin TypeScript, then fails if any generated file changed.

      A failure means a generated file was hand-edited, or someone changed a .proto
      without regenerating. Fix by running `task generate:proto generate:api` and
      committing the result, never by editing generated output.

      It also regenerates the client localizations and asserts the opposite property for
      them: they are BUILT, NOT TRACKED (ADR-009), so the gate fails if any of that output
      was committed rather than if it changed.

      This is the gate that blocks out-of-sync bugs. Wire it into CI.
    cmds:
      - task: generate:proto
      - task: generate:api
      - task: generate:l10n
      - task: sync:verify

  sync:verify:
    desc: Fail if regeneration produced a dirty working tree, or tracked what must not be
    internal: true
    silent: true
    cmds:
      - |
        set -e
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Not a git repository, cannot verify contract sync."; exit 1
        fi
        # The proto watch is scoped to the .proto SOURCES, not everything under proto/: the gate
        # detects contract drift, and a doc file beside the contract (proto/README.md) is not one.
        dirty=$(git status --porcelain -- '*.generated.ts' '*.pb.dart' '*.pbjson.dart' '*.pbenum.dart' 'proto/**/*.proto')
        if [ -n "$dirty" ]; then
          echo "Contracts are OUT OF SYNC. Regenerated output differs from what is committed:"
          echo "$dirty"
          echo
          echo "Run 'task generate:proto generate:api' and commit the result."
          exit 1
        fi
        echo "Contracts in sync."
      # The mirror-image check for the artifacts the tracking rule sends the other way. A
      # generated localization file that IS tracked is the failure: it would then be
      # hand-editable without the compiler or this gate ever noticing.
      - |
        set -e
        tracked=$(git ls-files -- '*/l10n/generated/*')
        if [ -n "$tracked" ]; then
          echo "Generated localizations are TRACKED, and must not be (ADR-009):"
          echo "$tracked"
          echo
          echo "Run 'git rm --cached' on them; they are produced by 'task generate:l10n'."
          exit 1
        fi
        echo "Generated localizations correctly untracked."

  # ---------------------------------------------------------------------------
  # Build / test
  # ---------------------------------------------------------------------------
  build:
    desc: Sync contracts, then build every sub-project
    cmds:
      - task: sync:contracts
      - task: build:server
      - task: build:client
      - task: build:apps
      - task: build:admin

  build:server:
    desc: Build + install the Java FRAMEWORK libraries (so apps can resolve them)
    dir: "{{.SERVER_DIR}}"
    cmds:
      # install (not package): the app modules under apps/ resolve these from the local repo.
      - ./mvnw -B install -DskipTests

  build:server:native:
    desc: Build the reference backend as a native executable (what prod ships)
    dir: "{{.SERVER_DIR}}"
    cmds:
      # Install the framework libs, then build the app natively via the shared wrapper.
      # Container build, pinned to amd64 so the image matches Cloud Run regardless of arch.
      - ./mvnw -B install -DskipTests
      - >-
        ./mvnw -B package -Dnative -DskipTests
        -Dquarkus.native.container-build=true
        -Dquarkus.native.container-runtime-options=--platform=linux/amd64
        -f ../{{.DEMO_SERVER_DIR}}/pom.xml

  build:client:
    desc: Resolve and analyze the Dart/Flutter FRAMEWORK library workspace
    dir: "{{.CLIENT_DIR}}"
    cmds:
      # The workspace holds Flutter packages, so it is resolved with `flutter pub get`.
      # `dart analyze` then analyzes every member.
      - flutter pub get
      # The typed localizations are generated, not committed (ADR-009), so they must exist
      # before anything analyzes or compiles a package that imports them.
      - task: generate:l10n
      - dart analyze

  build:apps:
    desc: Build the application examples (their Dart clients + Java servers)
    cmds:
      - task: build:apps:client
      - task: build:apps:runners
      - task: build:apps:server

  build:apps:client:
    desc: Resolve and analyze the apps/ Dart workspace (the app clients)
    dir: "{{.APPS_DIR}}"
    cmds:
      - flutter pub get
      - task: generate:l10n
      - dart analyze

  build:apps:runners:
    desc: Compile the app's NATIVE runners (macOS, iOS simulator, Android) — the targets tests never touch
    summary: |
      Compiles every delivery target the reference app has, because nothing else does and
      `dart analyze` is not a build.

      WHY THIS EXISTS. A Flutter dependency does not enter one platform, it enters all of them,
      and each has its own build system that can reject it on its own terms. Neither `task test`
      nor `dart analyze` compiles a runner: unit and widget tests run on the Dart VM and the
      flutter tester, which never invoke Xcode or Gradle. So a change can leave every suite green
      and every delivery target broken — that is not hypothetical, it happened twice in one day:

        - a plugin whose web implementation imports dart:html, which cannot compile to
          WebAssembly at all (ADR-024) and was found only by a deploy;
        - removing the CocoaPods integration after that plugin moved to Swift Package Manager,
          which could have broken both Apple runners with nothing to say so.

      The artifacts are throwaway; this is a COMPILE check. ZEN_API_URL is a placeholder for that
      reason — the URL is baked in at compile time, but nothing here is run, and pinning a real
      environment would put an environment fact back in the repo (STANDARDS "Deployment model").

      Apple targets need Xcode and are skipped, loudly, off macOS. Android needs a JDK whose
      jlink works, which GraalVM's does not — the same machine-wide `flutter config --jdk-dir`
      constraint `run:demo:native` explains at length (ADR-021).

      It generates the typed localizations first, and that is not a convenience. They are BUILT,
      NOT COMMITTED (ADR-009) — `**/l10n/generated/` is gitignored and `sync:contracts` fails if
      any of it is ever tracked — so a clean checkout does not have them and nothing that imports
      `IdentityLocalizations` can compile. A developer's machine always has them lying around from
      an earlier build, which is precisely why this was missed here and found by CI: the task
      passed locally for a reason that does not exist on a fresh clone.

      Resolution before generation, generation before building, in that order — which is why they
      are sequential `cmds` and not `deps:`, since go-task runs `deps:` in parallel. `gen-l10n`
      needs each package's `.dart_tool` to exist, and the ARB files live in the FRAMEWORK packages
      (`client/`) as well as the app, so both workspaces have to be resolved first.
    vars:
      API: '{{.ZEN_API_URL | default "http://localhost:8085"}}'
      SCHEME: '{{.ZEN_AUTH_REDIRECT_URI | default "zendemo://auth-callback"}}'
      FLUTTER_JDK:
        sh: |
          flutter config --list 2>/dev/null | sed -nE 's/^ *jdk-dir: *(.*)$/\1/p' | head -1
    cmds:
      # Both workspaces, with `flutter pub get` rather than `dart pub get`: each holds Flutter
      # packages, and gen-l10n below needs their .dart_tool to exist.
      - |
        set -eu
        (cd {{.CLIENT_DIR}} && flutter pub get)
        (cd {{.APPS_DIR}} && flutter pub get)
      - task: generate:l10n
      - |
        set -eu
        cd {{.DEMO_CLIENT_DIR}}
        defines="--dart-define=ZEN_ENV=dev --dart-define=ZEN_API_URL={{.API}} --dart-define=ZEN_AUTH_REDIRECT_URI={{.SCHEME}}"

        if [ "$(uname -s)" = "Darwin" ]; then
          echo ">> macOS"
          flutter build macos --debug --dart-define=ZEN_PLATFORM=macos $defines
          echo ">> iOS (simulator; a device build would need a signing identity, which the MVP does not have)"
          flutter build ios --simulator --debug --dart-define=ZEN_PLATFORM=ios $defines
        else
          echo ">> SKIPPED macOS and iOS: they need Xcode, and this is $(uname -s)."
          echo "   Said out loud rather than passed silently — on this host they are unverified."
        fi

        # Android last: it is the one that fails for a reason no error message names.
        JDK='{{.FLUTTER_JDK}}'
        BAD=""
        case "$JDK" in *graal*|*Graal*|*GRAAL*) BAD="yes" ;; esac
        if [ -z "$BAD" ] && [ -n "$JDK" ] && [ -x "$JDK/bin/java" ]; then
          case "$("$JDK/bin/java" -version 2>&1 | head -1)" in *GraalVM*) BAD="yes" ;; esac
        fi
        if [ -n "$BAD" ]; then
          echo "The Android build cannot use this JDK: GraalVM (its jlink cannot run AGP's jdkImage transform)."
          echo "Flutter takes it from a MACHINE-WIDE setting that outranks JAVA_HOME, so no task can fix it here:"
          echo "  flutter config --jdk-dir /path/to/a/standard/jdk-25"
          exit 1
        fi
        echo ">> Android"
        flutter build apk --debug --dart-define=ZEN_PLATFORM=android $defines
        echo
        echo "Every native runner compiles."

  build:apps:server:
    desc: Build the reference backend (resolves framework libs from the local repo)
    dir: "{{.SERVER_DIR}}"
    cmds:
      # Framework libs must be installed first; build:apps:server depends on build:server in
      # the top-level `build` ordering, but install here too so it stands alone.
      - ./mvnw -B -q install -DskipTests
      - ./mvnw -B -f ../{{.DEMO_SERVER_DIR}}/pom.xml package -DskipTests

  build:admin:
    desc: Build the admin panel
    dir: "{{.DEMO_ADMIN_DIR}}"
    cmds:
      - pnpm build

  build:web:
    desc: Build the Flutter web app and stage it so the backend serves it SAME-ORIGIN
    summary: |
      Builds the zen_demo web bundle and stages it under the app server's static resources,
      so `build:server:native` bakes it into the image and Quarkus serves it at / on the same
      origin as the API. Same-origin is not a preference here — it is what lets the session
      cookie flow: the backend sets zen_access_token SameSite=Lax, and *.run.app is on the
      Public Suffix List, so a page and an API on two different Cloud Run URLs are cross-site
      and the browser would never send the cookie. See BLUEPRINT "Deployment model".

      Because of that, the API URL is baked into the bundle at BUILD time (client config is
      compile-time, STANDARDS) and MUST equal the origin the page is served from. WEB_API_URL
      sets it; unset, it is read from the deployed service. On a first-ever deploy the service
      does not exist yet — pass WEB_API_URL explicitly that once.

      The bundle is staged, never committed: WEB_RESOURCES is gitignored, and rsync --delete
      keeps it in sync with the latest build while preserving the tracked openapi.yaml.
    vars:
      URL:
        sh: |
          if [ -n "${WEB_API_URL:-}" ]; then printf '%s' "$WEB_API_URL"; else
            gcloud run services describe {{.SERVICE_NAME}} --project={{.GCP_PROJECT}} \
              --region={{.GCP_REGION}} --format='value(status.url)' 2>/dev/null || true
          fi
    cmds:
      - |
        set -eu
        URL='{{.URL}}'
        if [ -z "$URL" ]; then
          echo "No API URL. The service does not exist yet, so set it explicitly for the"
          echo "first deploy (it must equal the URL the app will be served from):"
          echo "  WEB_API_URL=https://<service-url> task build:web"
          exit 1
        fi
        echo "Building web bundle (WebAssembly) against $URL"
        ( cd {{.DEMO_CLIENT_DIR}} && flutter build web --wasm --release \
            --dart-define=ZEN_ENV=prd --dart-define=ZEN_PLATFORM=web \
            --dart-define=ZEN_API_URL="$URL" )
        # Stage into the (gitignored) resources dir, replacing any stale bundle but keeping
        # the tracked openapi.yaml, the .gitignore, and the admin/ subtree (staged by
        # build:web:admin, which --delete would otherwise wipe when only build:web runs).
        rsync -a --delete --exclude=openapi.yaml --exclude=.gitignore --exclude=admin \
          {{.DEMO_CLIENT_DIR}}/build/web/ {{.WEB_RESOURCES}}/
        echo "Staged web bundle -> {{.WEB_RESOURCES}} ($(du -sh {{.WEB_RESOURCES}} | cut -f1))"

  run:demo:native:
    desc: Run zen_demo on a native target (macOS, an iOS simulator, an Android emulator)
    summary: |
      The native counterpart of `run:demo`, which runs the web build in Chrome. Same app, same
      backend; what differs is the two defines a native build cannot do without.

      ZEN_AUTH_REDIRECT_URI is the first. A confirmation or recovery email has to come back to
      *this* app, and a phone cannot be reached at the web app's URL, so a native build names a
      custom scheme instead. The value must match three places or the flow breaks silently: the
      scheme registered in the platform manifests, this define, and the server's
      AUTH_REDIRECT_URIS (which accepts it only on an exact match). See ADR-019.

      The Android JDK is the second, and it is a check rather than a fix, because the fix is not
      the repository's to make. Two facts collide:

        - Android's Gradle plugin cannot build on a GraalVM JDK: its jdkImage transform shells
          out to `jlink`, which fails there at 17, 21 and 25 alike. The DISTRIBUTION is the
          cause, not the version - a standard Java 25 builds cleanly, so the product keeps one
          Java version everywhere and only the distribution differs.
        - Flutter takes its JDK from `flutter config --jdk-dir`, a MACHINE-WIDE setting that
          outranks JAVA_HOME, GRADLE_OPTS, and even org.gradle.java.home. All three were tried;
          only changing that setting worked.

      So no task can pin this from inside the repo, and one that appeared to would be lying.
      What this task does instead is fail early and say exactly what to run, rather than let
      Gradle produce a jlink stack trace that names nothing useful.

      Usage:
        GCP_PROJECT=<project> task run:demo:native   # macOS, against the deployed backend
        ZEN_TARGET=<device-id> GCP_PROJECT=<project> task run:demo:native
        ZEN_API_URL=http://localhost:8085 task run:demo:native   # a local backend, no GCP
    vars:
      # Resolved from the live service, never hard-coded, and it fails loudly when there is
      # nothing to resolve. Exactly how build:web gets the same value, and for the same reason:
      # a deployed URL written into this file survives the environment it names. `destroy:cloudrun`
      # deletes the project but cannot edit the repository, so a baked-in URL would outlive
      # teardown and point every native build at a host that no longer exists — a dead backend
      # that looks like a bug in the app.
      API:
        sh: |
          if [ -n "${ZEN_API_URL:-}" ]; then printf '%s' "$ZEN_API_URL"; else
            gcloud run services describe {{.SERVICE_NAME}} --project={{.GCP_PROJECT}} \
              --region={{.GCP_REGION}} --format='value(status.url)' 2>/dev/null || true
          fi
      SCHEME: '{{.ZEN_AUTH_REDIRECT_URI | default "zendemo://auth-callback"}}'
      # What Flutter will actually hand Gradle. Read, not set: this is the machine-wide setting,
      # and the point is to check it before a build wastes minutes failing on it.
      FLUTTER_JDK:
        # A block scalar, not an inline one: the sed script contains ": ", which YAML would
        # otherwise read as a mapping and refuse to parse.
        sh: |
          flutter config --list 2>/dev/null | sed -nE 's/^ *jdk-dir: *(.*)$/\1/p' | head -1
    cmds:
      - |
        set -eu
        # Pick the device, and take its platform from Flutter rather than guessing at the id.
        #
        # Nobody should have to copy a UUID out of `flutter devices` to run their own app. So:
        # ZEN_TARGET wins when set, one attached device is used without asking, and several
        # produce a numbered menu. `flutter devices --machine` reports targetPlatform per device,
        # which is the authoritative answer to "is this an Android emulator or an iPhone" — an id
        # is not: `emulator-5554` and a simulator UUID are both just strings, and reading the
        # family out of their shape was a guess that got Android wrong and silently skipped the
        # JDK check below.
        SELECTION=$(scripts/pick-device.py)
        TARGET=$(printf '%s' "$SELECTION" | cut -f1)
        PLATFORM=$(printf '%s' "$SELECTION" | cut -f2)
        case "$PLATFORM" in
          macos|ios|android) ;;
          *) echo "ZEN_PLATFORM must be macos, ios or android (got '$PLATFORM')"; exit 1 ;;
        esac
        API='{{.API}}'
        if [ -z "$API" ]; then
          echo "No API URL. Nothing answered for service '{{.SERVICE_NAME}}' in project"
          echo "'{{.GCP_PROJECT}}', so either the environment is gone or GCP_PROJECT is unset."
          echo "Point the build somewhere explicitly:"
          echo
          echo "  ZEN_API_URL=http://localhost:8085 task run:demo:native   # a local backend"
          echo "  GCP_PROJECT=<project> task run:demo:native               # a deployed one"
          exit 1
        fi
        echo "Running zen_demo on '$TARGET' ($PLATFORM) against $API (links return to {{.SCHEME}})"
        cd {{.DEMO_CLIENT_DIR}}
        # Check the JDK Flutter will use BEFORE building, because the failure it produces is a
        # jlink stack trace that names neither the JDK nor the reason.
        if [ "$PLATFORM" = "android" ]; then
          JDK='{{.FLUTTER_JDK}}'
          BAD=""
          case "$JDK" in *graal*|*Graal*|*GRAAL*) BAD="GraalVM (its jlink cannot run AGP's jdkImage transform)" ;; esac
          if [ -z "$BAD" ] && [ -n "$JDK" ]; then
            V=$("$JDK/bin/java" -version 2>&1 | head -1)
            case "$V" in *GraalVM*) BAD="GraalVM (its jlink cannot run AGP's jdkImage transform)" ;; esac
          fi
          if [ -n "$BAD" ]; then
            echo "The Android build cannot use this JDK: $BAD"
            echo "  flutter's jdk-dir = ${JDK:-<unset>}"
            echo
            echo "Install a standard (non-GraalVM) JDK and point Flutter at it. Java 25 is fine:"
            echo "  sdk install java 25.0.3-tem"
            echo "  flutter config --jdk-dir \"\$HOME/.sdkman/candidates/java/25.0.3-tem\""
            echo
            echo "It is a machine-wide setting, not a repository one: Flutter's jdk-dir outranks"
            echo "JAVA_HOME, GRADLE_OPTS and org.gradle.java.home, all of which were tried."
            exit 1
          fi
          # A daemon started under a different JDK survives the change and keeps using the old one.
          pkill -f GradleDaemon 2>/dev/null || true
        fi
        flutter run -d "$TARGET" \
          --dart-define=ZEN_ENV=dev \
          --dart-define=ZEN_PLATFORM="$PLATFORM" \
          --dart-define=ZEN_API_URL="$API" \
          --dart-define=ZEN_AUTH_REDIRECT_URI='{{.SCHEME}}'

  build:web:admin:
    desc: Build the admin panel and stage it at /admin/ for same-origin serving
    summary: |
      Builds the react-admin panel with Vite base=/admin/ (set in vite.config for `build`) and
      stages it under the app server's static resources at admin/, so the native image serves it
      at /admin/ on the same origin as the API — the same cookie-flow reason as build:web.

      The admin needs no baked API URL: its data provider calls /api/v1 relative (config.ts), so
      it hits whatever origin served the page. react-admin uses a hash router, so /admin/#/...
      routes are all served by /admin/index.html and need no SPA fallback. Vite hashes its asset
      filenames, so those are safe to cache long; only /admin/index.html should not be (see the
      immutable-cache follow-up).
    cmds:
      - cd {{.DEMO_ADMIN_DIR}} && pnpm build
      - |
        set -eu
        mkdir -p {{.WEB_RESOURCES}}/admin
        rsync -a --delete {{.DEMO_ADMIN_DIR}}/dist/ {{.WEB_RESOURCES}}/admin/
        echo "Staged admin panel -> {{.WEB_RESOURCES}}/admin ($(du -sh {{.WEB_RESOURCES}}/admin | cut -f1))"

  test:
    desc: Run every test suite (test:e2e is the release gate - it hits the live stack)
    cmds:
      # First, and cheap: an architectural rule no unit test can catch, because the violation it
      # looks for makes every other suite pass. See STANDARDS "The client talks to one server".
      #
      # test:scripts runs immediately after, and deliberately not before: it is the suite that
      # proves the gate above still fires, so the cheap architectural check keeps its place at the
      # front and the thing that vouches for it follows straight behind.
      - task: verify:boundaries
      - task: test:scripts
      - task: test:server
      - task: test:client
      - task: test:apps
      - task: test:admin
      - task: test:e2e

  test:server:
    desc: Run Java FRAMEWORK library tests
    dir: "{{.SERVER_DIR}}"
    cmds:
      # The framework libs are exercised through the reference backend (test:apps:server) - a
      # @QuarkusTest needs an assembled app. Lib-level unit tests, when added, run here.
      - ./mvnw -B test

  test:client:
    desc: Run Dart and Flutter tests
    dir: "{{.CLIENT_DIR}}"
    silent: true
    cmds:
      # The typed localizations are built, not committed (ADR-009), so a clean checkout must
      # generate them before a test can import them.
      - task: generate:l10n
      # A failing test fails here - jZen does not swallow test failures.
      #
      # Neither `dart test` nor `flutter test` aggregates a pub workspace, so we iterate the
      # member packages ourselves. A package that depends on Flutter (dep or dev) is run with
      # `flutter test`; a pure-Dart package with `dart test`.
      #
      # Client config is compile-time: the UI packages read ZEN_PLATFORM via
      # String.fromEnvironment, and ZenNavigation asserts it is set. Flutter widget tests are
      # therefore compiled with the host platform define, mirroring how the real app builds.
      - |
        set -e
        case "$(uname -s)" in
          Darwin) host_platform=macos ;;
          Linux)  host_platform=linux ;;
          *)      host_platform=linux ;;
        esac
        found=0
        for pubspec in $(find . -mindepth 2 -name pubspec.yaml -not -path '*/.dart_tool/*' | sort); do
          pkgdir=$(dirname "$pubspec")
          [ -d "$pkgdir/test" ] || continue
          found=1
          if grep -qE '^[[:space:]]*(flutter|flutter_test):' "$pubspec"; then
            echo ">> flutter test ($pkgdir)"
            (cd "$pkgdir" && flutter test --dart-define=ZEN_ENV=dev --dart-define=ZEN_PLATFORM="$host_platform")
          else
            echo ">> dart test ($pkgdir)"
            (cd "$pkgdir" && dart test)
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "No Dart packages migrated yet - nothing to test. (ROADMAP step 2.)"
        fi

  test:apps:
    desc: Run the application examples' tests (Dart clients + Java servers)
    cmds:
      - task: test:apps:client
      - task: test:apps:server

  test:apps:client:
    desc: Run the app clients' Dart/Flutter unit tests (not the live e2e - see test:e2e)
    dir: "{{.APPS_DIR}}"
    silent: true
    cmds:
      - task: generate:l10n
      # Same per-package iteration as test:client. Only test/ dirs run here; integration_test/
      # (the live e2e) is driven separately by test:e2e against the real stack.
      - |
        set -e
        case "$(uname -s)" in
          Darwin) host_platform=macos ;;
          Linux)  host_platform=linux ;;
          *)      host_platform=linux ;;
        esac
        found=0
        for pubspec in $(find . -mindepth 2 -name pubspec.yaml -not -path '*/.dart_tool/*' | sort); do
          pkgdir=$(dirname "$pubspec")
          [ -d "$pkgdir/test" ] || continue
          found=1
          if grep -qE '^[[:space:]]*(flutter|flutter_test):' "$pubspec"; then
            echo ">> flutter test ($pkgdir)"
            (cd "$pkgdir" && flutter test --dart-define=ZEN_ENV=dev --dart-define=ZEN_PLATFORM="$host_platform")
          else
            echo ">> dart test ($pkgdir)"
            (cd "$pkgdir" && dart test)
          fi
        done
        [ "$found" -eq 1 ] || echo "No app packages with tests yet."

  test:apps:server:
    desc: Run the reference backend's tests (Dev Services Postgres; framework libs installed first)
    dir: "{{.SERVER_DIR}}"
    cmds:
      - ./mvnw -B -q install -DskipTests
      - ./mvnw -B -f ../{{.DEMO_SERVER_DIR}}/pom.xml test

  test:client:matrix:
    desc: Recompile-per-env/platform matrix for the compile-time client seams
    summary: |
      The half of the client that `task test` cannot see. Every compile-time seam in zen_transport
      picks its implementation with a conditional import, so the default VM suite compiles exactly
      one branch of each and never even parses the other. A web-only mistake is therefore a green
      `task test` and a broken app, which is why these rows exist as their own gate.

      Two seams are covered. The codec selector, which resolves per ZEN_ENV and platform; and the
      session client, whose web branch reads the CSRF cookie through dart:js_interop - run under
      BOTH web compilers, because dart2js and dart2wasm accept different things and the app ships
      as WebAssembly.
    dir: "{{.CLIENT_DIR}}/zen_transport"
    silent: true
    cmds:
      # selectDefaultCodec() is compile-time: dev -> json (any platform), prd native ->
      # protobuf, prd web -> json. Each row recompiles with a different ZEN_ENV / platform.
      - |
        set -e
        echo ">> ZEN_ENV=dev  (VM)   -> json"
        dart --define=ZEN_ENV=dev test test/zen_codec_selector_test.dart
        echo ">> ZEN_ENV=prd  (VM)   -> protobuf"
        dart --define=ZEN_ENV=prd test test/zen_codec_selector_test.dart
        echo ">> ZEN_ENV=prd  (web)  -> json"
        dart --define=ZEN_ENV=prd test test/zen_codec_selector_test.dart -p chrome
        echo ">> session client (web, dart2js)   -> reads XSRF-TOKEN"
        dart test test/session_client_web_test.dart -p chrome
        echo ">> session client (web, dart2wasm) -> reads XSRF-TOKEN"
        dart test test/session_client_web_test.dart -p chrome --compiler dart2wasm

  test:admin:
    desc: Typecheck the admin panel (also typechecks the @jzen/admin-core scaffold it imports)
    dir: "{{.DEMO_ADMIN_DIR}}"
    cmds:
      - pnpm exec tsc -b

  test:scripts:
    desc: Run the fixture tests for the Python dev scripts (today, the boundary gate)
    silent: true
    summary: |
      Covers the scripts on the Python side of STANDARDS "Scripting" — today `verify:boundaries`,
      as the other two conversions land.

      WHY A GATE NEEDS TESTS AT ALL. For its whole sh lifetime `verify:boundaries` could only be
      shown to work by planting a violation in the repository by hand and remembering to take it
      out, so in practice nobody ever showed it. The one thing it could never assert about itself
      is the one that mattered: that it was still reading the tree. Its scans ended in
      `2>/dev/null … || true`, so a renamed directory under `client/` produced no hits, and no
      hits is indistinguishable from a clean repository — the gate reported green having examined
      nothing. `test_stale_scope_is_a_failure` is the regression test for exactly that.

      `unittest`, not pytest: the Python side is stdlib-only by rule (ADR-032), so the runner is
      too. Runs in well under a second and needs no toolchain beyond the 3.9 floor `doctor` checks.

      Discovery is rooted at `scripts/tests`; a failing test exits non-zero and fails the suite,
      as STANDARDS "Failures surface" requires.
    cmds:
      - python3 -m unittest discover -s scripts/tests

  test:e2e:
    desc: The release gate - drive zen_demo's suite against the LIVE Quarkus + Supabase stack
    summary: |
      The living end-to-end test stand (ROADMAP step 4). No mocks: it boots the local Supabase
      stack and the Quarkus server (dev profile, pointed at that stack), then runs zen_demo's
      pure-Dart integration suite on the VM - register/login/logout via real Supabase, a typed
      round trip in both transport modes, a localized surface, the WebSocket echo, and a ZenError
      path - tears the server down, and propagates the suite's exit code. Wired into `task test`
      and the CI release gate.

      A pure-Dart VM suite (not flutter integration_test) keeps CI headless and cheap, and because
      the VM is a dart:io platform it exercises the native session cookie jar for real. Runs the
      app on ZEN_APP_PORT (default 8085) to dodge a leftover Supabase stack that may shadow :8080.
    cmds:
      - |
        set -uo pipefail
        PORT="${ZEN_APP_PORT:-8085}"
        API="http://localhost:${PORT}"

        # Tear the server down by whatever is bound to the test port, and wait for the port to
        # actually free (Quarkus shuts down gracefully over a few seconds) so a following step
        # cannot collide on it; escalate to SIGKILL if it lingers. Port-scoped and reliable
        # across shells (go-task's interpreter can reparent `&`, so $! is not dependable), so a
        # dev server on another port is left alone.
        stop_server() {
          # pkill on the jar path is the dependable killer (the gate uniquely runs this jar; a dev
          # `run:server` uses quarkus:dev, not it). The port-scoped lsof pass is a belt-and-braces
          # fallback that also waits for the port to actually free, escalating to SIGKILL.
          pkill -f 'zen_demo_server/target/quarkus-app/quarkus-run.jar' 2>/dev/null || true
          port_pid=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${port_pid}" ] && kill "${port_pid}" 2>/dev/null || true
          for _ in $(seq 1 15); do
            lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t >/dev/null 2>&1 || return 0
            sleep 1
          done
          port_pid=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${port_pid}" ] && kill -9 "${port_pid}" 2>/dev/null || true
        }

        set -e
        # Bring up the local Supabase stack if it is not already running.
        supabase status >/dev/null 2>&1 || supabase start
        # GoTrue requires the anon key as the apikey header; hand it and the API URL to Quarkus.
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_ANON_KEY}"

        # Install the framework libs, then build the reference backend (fast when already built)
        # via the shared wrapper, and start it on the test port.
        ( cd {{.SERVER_DIR}} && ./mvnw -B -q install -DskipTests \
          && ./mvnw -B -q -f ../{{.DEMO_SERVER_DIR}}/pom.xml package -DskipTests )
        set +e
        java -Dquarkus.profile=dev -Dquarkus.http.port="${PORT}" \
          -jar {{.DEMO_SERVER_DIR}}/target/quarkus-app/quarkus-run.jar &

        # Wait for the server to answer /health before driving it.
        ready=0
        for _ in $(seq 1 60); do
          if curl -sf "${API}/api/v1/health" >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        if [ "${ready}" -ne 1 ]; then echo "server did not become healthy on ${API}"; stop_server; exit 1; fi

        # The suite runs on the VM (native), exercising the real cookie jar. We capture its exit
        # code, tear the server down, and propagate the code - so the gate's result is the suite's.
        # ZEN_API_URL is read at runtime by the suite (dart test does not forward --define to the
        # compiled test); ZEN_ENV=dev keeps the default codec JSON where it does apply.
        ( cd {{.DEMO_CLIENT_DIR}} \
          && ZEN_API_URL="${API}" dart --define=ZEN_ENV=dev \
               test integration_test/e2e_test.dart )
        rc=$?
        stop_server
        exit "${rc}"

  # ---------------------------------------------------------------------------
  # Run
  # ---------------------------------------------------------------------------
  run:all:
    desc: Start Supabase and the backend (run the admin panel separately with task run:admin)
    deps: [run:supabase]
    cmds:
      - task: run:server

  run:supabase:
    desc: Start the local Supabase stack (API 54321, DB 54322, Studio 54323)
    cmds:
      - supabase start
    status:
      - supabase status >/dev/null 2>&1

  run:server:
    desc: Start the reference backend in Quarkus dev mode (live reload) on :8080
    dir: "{{.SERVER_DIR}}"
    cmds:
      # Install the framework libs, then run the app (apps/zen_demo/zen_demo_server) in dev mode
      # via the shared wrapper.
      - ./mvnw -B -q install -DskipTests
      - ./mvnw -f ../{{.DEMO_SERVER_DIR}}/pom.xml quarkus:dev

  run:demo:
    desc: Boot Supabase + the backend + the reference app (zen_demo) for a manual walkthrough
    summary: |
      The product showcase (ROADMAP step 4). Brings up the local Supabase stack, starts the
      Quarkus server (dev profile) on ZEN_APP_PORT (default 8085, to dodge a leftover stack that
      may shadow :8080), waits for /health, then runs zen_demo in Chrome pointed at it. The web
      build runs on a fixed port so the server's CORS allowlist can permit its credentialed
      requests. Ctrl-C stops the app; the server is torn down on exit. For the headless gate that
      asserts the same flow, see `task test:e2e`.
    deps: [run:supabase]
    cmds:
      - |
        set -euo pipefail
        PORT="${ZEN_APP_PORT:-8085}"
        WEB_PORT="${ZEN_WEB_PORT:-5200}"
        API="http://localhost:${PORT}"

        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_ANON_KEY}"
        # Let the browser's credentialed calls through CORS from the demo's web origin.
        export CORS_ORIGINS="http://localhost:${WEB_PORT},http://localhost:8080,http://localhost:5173"

        # Tear the server down: pkill the quarkus:dev java by its port system-property (dependable
        # across shells - go-task can reparent `&`, and quarkus:dev forks a child), then a
        # port-scoped lsof fallback that waits for the port to free, escalating to SIGKILL.
        stop_server() {
          pkill -f "quarkus.http.port=${PORT}" 2>/dev/null || true
          p=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${p}" ] && kill "${p}" 2>/dev/null || true
          for _ in $(seq 1 15); do
            lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t >/dev/null 2>&1 || return 0
            sleep 1
          done
          p=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${p}" ] && kill -9 "${p}" 2>/dev/null || true
        }
        trap stop_server EXIT

        ( cd {{.SERVER_DIR}} && ./mvnw -B -q install -DskipTests \
          && ./mvnw -f ../{{.DEMO_SERVER_DIR}}/pom.xml quarkus:dev -Dquarkus.http.port="${PORT}" ) &

        ready=0
        for _ in $(seq 1 90); do
          if curl -sf "${API}/api/v1/health" >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        [ "${ready}" -eq 1 ] || { echo "server did not become healthy on ${API}"; stop_server; exit 1; }

        cd {{.DEMO_CLIENT_DIR}}
        flutter run -d chrome --web-port="${WEB_PORT}" \
          --dart-define=ZEN_ENV=dev --dart-define=ZEN_PLATFORM=web --dart-define=ZEN_API_URL="${API}"
        stop_server

  run:admin:
    desc: Start the admin panel dev server on :5173 (proxies /api to the backend)
    dir: "{{.DEMO_ADMIN_DIR}}"
    cmds:
      - pnpm dev

  stop:supabase:
    desc: Stop the local Supabase stack
    cmds:
      - supabase stop

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  test:native:
    desc: Build the native image and smoke it IN DOCKER — the long check before a deploy
    summary: |
      The last gate before shipping. Builds the linux/amd64 native image, runs it in Docker
      against a throwaway Postgres, and asserts both wire formats answer. Slow (the native
      build dominates) and entirely local, so it costs nothing but time.

      WHY IN DOCKER RATHER THAN ON THE HOST. The image is built for linux/amd64 so it matches
      Cloud Run (STANDARDS "Deployment model"). On an arm64 developer machine that binary
      cannot be executed directly — it is an x86-64 Linux ELF — which rules out Quarkus's
      @QuarkusIntegrationTest, since that launches the runner as a host process. Running the
      container has no such problem and tests the exact artifact that will be deployed.

      WHY PLAIN POSTGRES AND NOT SUPABASE. The app migrates at startup, so it needs a
      database, but not Supabase specifically: V2__row_level_security.sql is guarded on
      `to_regprocedure('auth.uid()')` precisely so it is a no-op off Supabase. A disposable
      container is therefore enough, it cannot collide with a Supabase stack another project
      left running, and it keeps this gate free of network dependencies.

      WHY BOTH TRANSPORT MODES. The first deployed revision served protobuf perfectly and
      500'd on every JSON response — binary serialisation uses generated code, while
      canonical proto3 JSON resolves accessors reflectively and needs them registered for
      native (zen.transport.ZenProtoReflection). Half a seam looks entirely healthy if you
      only probe one format, and JSON is the default and what both frontends speak.
    cmds:
      # Stage both frontends first so the native build bakes them in and the smoke can assert
      # both / (Flutter web app) and /admin/ (react-admin panel).
      - task: build:web
      - task: build:web:admin
      - task: build:server:native
      - |
        set -eu
        IMG=zen-native-smoke:local
        NET=zen-smoke-net
        cleanup() {
          docker rm -f zen-smoke-app zen-smoke-db >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        cleanup

        docker build --platform=linux/amd64 -q \
          -f {{.DEMO_SERVER_DIR}}/src/main/docker/Dockerfile.native-micro \
          -t "$IMG" {{.DEMO_SERVER_DIR}} >/dev/null
        docker network create "$NET" >/dev/null

        docker run -d --name zen-smoke-db --network "$NET" \
          -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=postgres postgres:17-alpine >/dev/null
        for _ in $(seq 1 30); do
          docker exec zen-smoke-db pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1
        done

        # Config values are deliberately fake except the datasource: this gate proves the
        # image boots, migrates and serialises. Anything needing real Supabase or SMTP is
        # covered by test:e2e on the JVM and by verify:deploy against the real environment.
        docker run -d --name zen-smoke-app --network "$NET" -p 18080:8080 --platform=linux/amd64 \
          -e DB_URL=jdbc:postgresql://zen-smoke-db:5432/postgres \
          -e DB_USERNAME=postgres -e DB_PASSWORD=smoke \
          -e SUPABASE_URL=http://localhost:54321 -e SUPABASE_KEY=smoke \
          -e SITE_URL=http://localhost:18080 \
          -e AUTH_REDIRECT_URI=http://localhost:18080/auth/callback \
          -e CORS_ORIGINS=http://localhost:18080 \
          -e SMTP_HOST=localhost -e SMTP_PORT=1025 -e SMTP_USERNAME=x -e SMTP_PASSWORD=x \
          -e SMTP_FROM=x@example.com -e ZEN_JOBS_TRIGGER_TOKEN=smoke-token \
          "$IMG" >/dev/null

        up=0
        for _ in $(seq 1 60); do
          curl -sf -H 'X-Zen-Transport: protobuf' http://localhost:18080/api/v1/health >/dev/null 2>&1 \
            && { up=1; break; }
          sleep 1
        done
        if [ "$up" -ne 1 ]; then
          echo "Native image never became healthy. Container log:"
          docker logs zen-smoke-app 2>&1 | tail -40
          exit 1
        fi

        SERVICE_URL=http://localhost:18080 task verify:endpoints

  verify:deploy:
    desc: Smoke the DEPLOYED service — both transport modes must answer, not just one
    summary: |
      Resolves the live Cloud Run URL and runs the same assertions test:native runs against a
      local container, so a deployment is held to exactly the standard the pre-deploy gate
      enforces. Override with `SERVICE_URL=https://... task verify:deploy` for any environment.

      Run it after every deploy. To keep a bad revision from serving traffic at all, deploy
      with `--no-traffic --tag=candidate`, verify the tagged URL, then shift traffic.
    cmds:
      - |
        set -eu
        URL="${SERVICE_URL:-}"
        if [ -z "$URL" ]; then
          URL=$(gcloud run services describe {{.SERVICE_NAME}} --project={{.GCP_PROJECT}} \
                  --region={{.GCP_REGION}} --format='value(status.url)' 2>/dev/null || true)
        fi
        [ -n "$URL" ] || { echo "No service URL. Set SERVICE_URL=... or GCP_PROJECT=..."; exit 1; }
        SERVICE_URL="$URL" task verify:endpoints

        # The NATIVE return address must be configured, or every native client is locked out.
        # Here and not in verify:endpoints because this needs a REAL Supabase behind the service,
        # which the test:native smoke container deliberately does not have.
        #
        # It is a CONFIG assertion, not a code one: the image is byte-identical either way and the
        # web app is wholly unaffected, so no other check here can notice. A deployment that omits
        # the AUTH_REDIRECT_URIS secret refuses every native email link with 400 invalid_redirect —
        # ADR-019 matches exactly and the allowlist is empty by default. The probe address is
        # deliberately a nonexistent user: /restore-password answers 204 whether or not the account
        # exists, so this reads the allowlist and nothing else, and mails no one.
        want_scheme="${ZEN_AUTH_REDIRECT_URI:-zendemo://auth-callback}"
        rcode=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/auth/restore-password" \
                  -H 'Content-Type: application/json' -H 'X-Zen-Transport: json' \
                  -d "{\"email\":\"zen-redirect-probe@example.invalid\",\"redirectUri\":\"$want_scheme\"}")
        if [ "$rcode" = "204" ]; then
          printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /api/v1/auth/restore-password native "$want_scheme allowed"
        else
          printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /api/v1/auth/restore-password native \
            "HTTP $rcode for '$want_scheme' (want 204)"
          echo
          echo "The deployed service does not allow the native return address, so every native"
          echo "client is locked out of confirmation and recovery while the web app looks fine."
          echo "Create the secret and redeploy, and register the same scheme in the Supabase"
          echo "dashboard under Auth -> URL Configuration -> Redirect URLs:"
          echo
          echo "  printf '%s' '$want_scheme' | gcloud secrets create AUTH_REDIRECT_URIS \\"
          echo "    --data-file=- --project={{.GCP_PROJECT}}"
          exit 1
        fi

        # App Links, when the environment has adopted them. Reported, never fatal: a deployment
        # that has not adopted them is correct and answers 404, and the custom scheme still works.
        # What IS worth failing on is a file that exists and is malformed, because the platforms
        # cache a failed verification — a broken association is worse than an absent one.
        al=$(curl -s -o /dev/null -w '%{http_code}' "$URL/.well-known/assetlinks.json")
        if [ "$al" = "404" ]; then
          printf '  \033[33m--\033[0m   %-24s %-9s %s\n' /.well-known/assetlinks.json applinks \
            "not adopted (custom scheme only)"
        else
          body=$(curl -s "$URL/.well-known/assetlinks.json")
          type=$(curl -s -o /dev/null -w '%{content_type}' "$URL/.well-known/assetlinks.json")
          case "$body:${type%%;*}" in
            *delegate_permission/common.handle_all_urls*:application/json)
              printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /.well-known/assetlinks.json applinks "served as JSON" ;;
            *)
              printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /.well-known/assetlinks.json applinks \
                "HTTP $al, type '${type:-none}' — Android caches a failed verification"
              fail=1 ;;
          esac
        fi

  verify:endpoints:
    desc: Assert a running jZen backend serves BOTH transport modes (SERVICE_URL required)
    silent: true
    summary: |
      The shared assertion set, used by test:native against a local container and by
      verify:deploy against a real environment. One definition, so the gate before shipping
      and the check after it cannot drift apart.

      WHY BOTH MODES, ALWAYS. The first deployed revision served protobuf perfectly and 500'd
      on every JSON response: binary serialisation uses generated code, while canonical proto3
      JSON resolves field accessors reflectively and needs them registered for native
      (zen.transport.ZenProtoReflection). A single-format smoke test would have passed on a
      build that served no web client at all — and JSON is the default, and what both the
      Flutter web app and the admin panel speak.
    cmds:
      - |
        set -eu
        URL="${SERVICE_URL:?set SERVICE_URL}"
        echo "Verifying $URL"
        fail=0
        probe() {
          path=$1
          for spec in "nohdr:$2:" "json:$3:X-Zen-Transport: json" "protobuf:$4:X-Zen-Transport: protobuf"; do
            mode=${spec%%:*}; rest=${spec#*:}; want=${rest%%:*}; hdr=${rest#*:}
            if [ -n "$hdr" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "$hdr" "$URL$path")
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            fi
            if [ "$code" = "$want" ]; then
              printf '  \033[32mok\033[0m   %-24s %-9s %s\n' "$path" "$mode" "$code"
            else
              printf '  \033[31mFAIL\033[0m %-24s %-9s %s (want %s)\n' "$path" "$mode" "$code" "$want"
              fail=1
            fi
          done
        }
        # A 500 in any row means a proto message could not be serialised in that format.
        probe /api/v1/health       200 200 200
        probe /api/v1/demo/ping    200 200 200
        probe /api/v1/demo/terms   200 200 200
        # Rejections must serialise too: ZenError is itself a proto message, so an auth
        # failure returning 500 instead of 401 is the same bug wearing a hat.
        probe /api/v1/demo/profile 401 401 401
        # The admin surface is JSON-only by design (bare array + Content-Range, ADR-005), so
        # protobuf is correctly Not Acceptable rather than an error.
        probe /api/v1/admin/users  401 401 406
        # Body-level: the default must be canonical proto3 JSON, not merely a 200.
        body=$(curl -s "$URL/api/v1/health")
        case "$body" in
          *'"status":"ok"'*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /api/v1/health body "canonical proto3 JSON" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /api/v1/health body "$body"; fail=1 ;;
        esac
        # The web app is served SAME-ORIGIN from the backend: / must return the Flutter shell.
        # Key on flutter_bootstrap.js, which BOTH compilations emit — main.dart.js is only the
        # dart2js fallback and is absent from the Wasm view (ADR-016).
        root=$(curl -s "$URL/")
        case "$root" in
          *flutter_bootstrap.js*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' / web "Flutter app shell" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' / web "root did not serve the app"; fail=1 ;;
        esac
        boot=$(curl -s -o /dev/null -w '%{http_code}' "$URL/flutter_bootstrap.js")
        [ "$boot" = "200" ] && printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /flutter_bootstrap.js web 200 \
          || { printf '  \033[31mFAIL\033[0m %-24s %-9s %s (want 200)\n' /flutter_bootstrap.js web "$boot"; fail=1; }
        # WASM-specific: the app binary must be served AND carry Content-Type application/wasm,
        # or the browser cannot stream-compile it. This is the JS-vs-Wasm analogue of the
        # native-reflection trap — a detail only the real served artifact reveals.
        wcode=$(curl -s -o /dev/null -w '%{http_code}' "$URL/main.dart.wasm")
        wtype=$(curl -s -o /dev/null -w '%{content_type}' "$URL/main.dart.wasm")
        if [ "$wcode" = "200" ] && [ "${wtype%%;*}" = "application/wasm" ]; then
          printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /main.dart.wasm web "200 application/wasm"
        else
          printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /main.dart.wasm web "HTTP $wcode, type '${wtype:-none}' (want 200 application/wasm)"
          fail=1
        fi
        # Entry files (fixed names, not content-hashed) must NOT be immutable, or a redeploy is
        # invisible to returning browsers for a day. They must revalidate (StaticCacheHeaders).
        wcache=$(curl -s -o /dev/null -D- "$URL/main.dart.wasm" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
        case "$wcache" in
          *immutable*) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /main.dart.wasm cache "'$wcache' — must revalidate, not immutable"; fail=1 ;;
          *no-cache*|*no-store*|*max-age=0*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /main.dart.wasm cache "$wcache" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /main.dart.wasm cache "'${wcache:-none}' — expected no-cache"; fail=1 ;;
        esac
        # The admin panel is served same-origin at /admin/ (react-admin, hash router). Assert the
        # directory serves its index and the hashed entry script loads. Its data provider calls
        # /api/v1 relative, so it shares this origin's session cookie — the whole point of /admin/.
        admin=$(curl -s "$URL/admin/")
        case "$admin" in
          *'/admin/assets/'*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /admin/ admin "react-admin shell" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /admin/ admin "did not serve the panel index"; fail=1 ;;
        esac
        ajs=$(printf '%s' "$admin" | grep -oE '/admin/assets/[^"]+\.js' | head -1)
        if [ -n "$ajs" ]; then
          ac=$(curl -s -o /dev/null -w '%{http_code}' "$URL$ajs")
          [ "$ac" = "200" ] && printf '  \033[32mok\033[0m   %-24s %-9s %s\n' "$ajs" admin 200 \
            || { printf '  \033[31mFAIL\033[0m %-24s %-9s %s (want 200)\n' "$ajs" admin "$ac"; fail=1; }
        else
          printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /admin/ admin "no entry script referenced"; fail=1
        fi
        echo
        if [ "$fail" -eq 0 ]; then echo "Serves both transport modes, the WebAssembly web app, AND the admin panel — all same origin."; else
          echo "NOT healthy. A 500 usually means a proto message is not registered for native reflection;"
          echo "a missing / or /admin/ means build:web / build:web:admin did not stage the bundle;"
          echo "a wrong .wasm content-type means the static handler needs an application/wasm MIME mapping."
          exit 1
        fi

  deploy:cloudrun:
    desc: Build native, push to Artifact Registry, deploy to Cloud Run
    vars:
      GIT_SHA:
        sh: git rev-parse --short HEAD
      # Untracked files count as dirty: a new uncommitted source file changes what the image
      # contains just as much as a modified one does. Ignored files do not, which is what keeps
      # the staged web bundle and target/ from tripping this on every deploy.
      GIT_DIRTY:
        sh: test -z "$(git status --porcelain)" || printf '%s' -dirty
    summary: |
      Cloud Run deploy. Notable choices:
        - It refuses to run from a dirty working tree. The image tag IS the short commit
          SHA, so it is only an identity while the commit fully describes the build;
          deploying uncommitted changes makes a tag that names bits no commit can restore.
          ALLOW_DIRTY=1 overrides deliberately and tags `<sha>-dirty` so the image never
          impersonates the commit. That escape hatch is for a throwaway experiment only:
          two dirty builds still collide with each other, by design and not by accident.
        - No `firebase deploy`: jZen serves Cloud Run directly with no Firebase Hosting
          edge, which is what lets it use normal cookie names and proactive auth.
        - Scheduled work is triggered from OUTSIDE the container. min-instances=0 means
          there is no thread alive to run an in-process cron, so zen-jobs exposes
          POST /api/v1/jobs/trigger and one Cloud Scheduler entry calls it. One entry, one
          container start, N jobs: N entries would mean N cold starts.

      ═══════════════════════════════════════════════════════════════════════════════════
      CAPACITY — the six knobs, and what each one BREAKS. Read before changing any of them.
      ═══════════════════════════════════════════════════════════════════════════════════

      These are `vars`, not literals: capacity is the APPLICATION's decision, and jZen is a
      framework (ADR-028). The defaults below are zen_demo's deployment and are unchanged.
      Override per deploy, e.g.:

          SERVICE_MAX_INSTANCES=10 SERVICE_MIN_INSTANCES=1 \
            GCP_PROJECT=my-project task deploy:cloudrun

      The framework's obligation in exchange for the freedom is to say what each knob
      invalidates — because EVERY consequence below fails silently. Nothing errors, nothing
      warns, and the test suite stays green.

        SERVICE_MEMORY (256Mi) / SERVICE_CPU (1)
          No invariant. Pure cost/headroom. 256Mi is why the admin list endpoint bounds its
          page size — an unbounded range is an OOM at this size, not a slow query.

        SERVICE_MIN_INSTANCES (0)
          A deliberate cost floor: no warm instance to pay for, cold starts accepted.
          MEASURED (ADR-027): a cold request costs 2.9-4.8s end to end against 26ms warm,
          and this service is cold for practically every real visitor, because its only
          recurring traffic is one scheduler tick an hour.
          Raising it to 1 or more INVALIDATES NOTHING. It is the opposite axis: it removes
          cold starts and would make an in-process @Scheduled viable again — but zen-jobs
          stays correct either way, so there is no reason to undo it. A warm instance buys
          latency, not a simpler architecture.
          Note what min=0 itself already breaks, and why zen-jobs exists: an in-process cron
          provably does not fire when no process is alive, so scheduled work is triggered
          from outside (above).

        SERVICE_MAX_INSTANCES (1)
          The one that carries invariants. At most one instance runs, so in-process state is
          valid BY CONSTRUCTION. Raising it above 1 invalidates three things, none loudly:
            1. The burst tier of the rate limiter. N instances keep N independent counters,
               so the effective limit becomes N x the configured one. (The DURABLE tier is
               unaffected — it lives in Postgres precisely so it depends neither on how many
               instances run nor on any one of them surviving. Under min-instances=0 the
               live process is replaced hourly (ADR-027), so a window longer than an hour
               cannot be held in memory whatever max-instances says.)
            2. JobScheduler's overlap guard. The `AtomicBoolean ticking` flag is per-instance,
               so two instances can run the same tick concurrently. The tick runs retention,
               which means concurrent ACCOUNT ANONYMISATION. The retention queries exclude
               already-anonymised rows, so the operation is idempotent and the damage is
               bounded — but that is a property to verify before relying on it, not assume.
               JobScheduler's own javadoc names the remedy: a Postgres advisory lock.
            3. Any in-memory cache, which diverges per instance.
          Raising it also opts out of ADR-027's acceptance of the 200-slot ceiling, and out
          of its cost floor: with max=1 an attack costs availability, not money. Above 1 it
          can cost money.

        SERVICE_CONCURRENCY (200) / SERVICE_TIMEOUT (60s)
          No invariant — capacity and latency trade-offs. But the PRODUCT of them is the
          denial-of-service surface: saturating every slot costs an attacker
          concurrency/timeout requests per second. At the old 300s that was 0.67 req/s, one
          slow connection; at 60s it is ~3.3 req/s, which is a rate the per-address limiter
          can see and act on. Raising the timeout back up lowers that cost again.
          60s is not a guess: the heaviest operation in the service, the hourly retention
          trigger, completes in 3.7s INCLUDING a 3.0s cold boot (ADR-027). Cloud Run's
          timeout is per service, not per route, so this single value must cover that job —
          it does, with two orders of magnitude to spare.

      Requires: gcloud auth, GCP_PROJECT set, and everything under ONE-TIME SETUP below.
      Run it as `GCP_PROJECT=my-project task deploy:cloudrun` — this task never changes your
      global gcloud config, so it cannot leave your shell pointed somewhere unexpected.

      Deploy is deliberately manual and stays that way. Nothing triggers it but a person:
      CI runs the cheap gates, `task test:native` is the long local check before shipping,
      and this command is the act of shipping. Each application on jZen decides its own
      release process — ROADMAP's appendix leaves per-application pipelines to each app.

      ═══════════════════════════════════════════════════════════════════════════════════
      ONE-TIME SETUP — per environment, not per deploy. All of it is required; the deploy
      fails or the service 500s without it. Substitute PROJECT and REGION throughout.
      ═══════════════════════════════════════════════════════════════════════════════════

        0. Project, billing, APIs, registry. Cloud Run and Artifact Registry both refuse to
           enable without an open billing account attached.

             gcloud projects create PROJECT --name="..."
             gcloud billing projects link PROJECT --billing-account=BILLING_ACCOUNT_ID
             gcloud services enable run.googleapis.com artifactregistry.googleapis.com \
               secretmanager.googleapis.com cloudscheduler.googleapis.com --project=PROJECT
             gcloud artifacts repositories create jzen --repository-format=docker \
               --location=REGION --project=PROJECT
             gcloud auth configure-docker REGION-docker.pkg.dev

        1. The fourteen configuration secrets. `--set-secrets` below fails the deploy if any
           is absent, so create them all before the first run.

             mk() { printf '%s' "$2" | gcloud secrets create "$1" --data-file=- --project=PROJECT; }

             mk SUPABASE_URL       "https://<ref>.supabase.co"
             mk SUPABASE_KEY       "<publishable/anon key>"
             mk DB_URL             "jdbc:postgresql://<pooler-host>:5432/postgres"
             mk DB_USERNAME        "postgres.<ref>"
             mk DB_PASSWORD        "<database password>"
             mk SITE_URL           "https://<service-url>"
             mk AUTH_REDIRECT_URI  "https://<service-url>/auth/callback"
             mk AUTH_REDIRECT_URIS "zendemo://auth-callback"
             mk CORS_ORIGINS       "https://<service-url>"
             mk SMTP_HOST          "smtp-relay.brevo.com"
             mk SMTP_PORT          "587"
             mk SMTP_USERNAME      "<smtp login>"
             mk SMTP_PASSWORD      "<smtp api key>"
             mk SMTP_FROM          "noreply@<domain>"

        1a. App Links (optional, and NOT secrets). The association files at /.well-known let the
           operating system verify that an https:// link belongs to this app, which is what closes
           the custom-scheme hijack: any app may register `zendemo://`, and the link carries a live
           refresh token. These values are PUBLIC by definition — the server serves them to anyone
           who asks, which is the whole mechanism — so they are plain `--set-env-vars`, not Secret
           Manager entries. Putting public data in a secret store would imply a confidentiality it
           does not have and cannot enforce.

             export APPLINKS_ANDROID_PACKAGE=dev.jzen.zen_demo_client
             export APPLINKS_ANDROID_FINGERPRINTS="AA:BB:...,CC:DD:..."   # every signing key
             export APPLINKS_APPLE_APP_IDS="<TeamID>.<bundle-id>"          # paid Apple account
             GCP_PROJECT=... task deploy:cloudrun

           List EVERY signing certificate that will run, not just the release one: a debug keystore
           signs the build a developer actually installs, and a build signed by an unlisted key
           fails verification with no error anyone sees. Get a fingerprint with:

             keytool -list -v -keystore ~/.android/debug.keystore \
               -alias androiddebugkey -storepass android | grep SHA256

           Unset is a supported state: the endpoints answer 404, which leaves the association
           unestablished rather than teaching the platform that it FAILED (both Android and iOS
           cache a failure). The custom scheme keeps working either way.

           AUTH_REDIRECT_URIS is what lets a NATIVE client authenticate at all. One backend
           serves every client, and a phone is not reachable at the web app's URL, so a native
           build names its own scheme and the server allows it only by EXACT match (ADR-019).
           The list is empty by default, which is the safe default but also means a deployment
           that omits this secret refuses every native email link with 400 invalid_redirect —
           silently, in that nothing about the web flow looks wrong. It must equal the scheme
           registered in the platform manifests and passed as ZEN_AUTH_REDIRECT_URI to the
           native build; three places, one value. Comma-separated for more than one client.

           DB_URL must be the SESSION POOLER, not the direct connection and not the
           transaction pooler. Three constraints force this, and each fails differently:
             - the transaction pooler (:6543) has no advisory locks or prepared statements,
               so Flyway cannot take its migration lock and the app never finishes booting;
             - the direct host (db.<ref>.supabase.co) resolves to IPv6 only, while Cloud Run
               egress is IPv4 — the connection simply never establishes;
             - the pooler's username is `postgres.<ref>`, NOT the plain `postgres` the direct
               connection uses. Wrong form gives "tenant/user not found", which reads like a
               credential problem and is not one.

           SMTP may hold placeholders on a first deploy. EmailService.send() never throws by
           design (ADR-007), so unreachable mail degrades registration to a missing welcome
           email rather than a failure — real credentials can land later.

           SUPABASE_URL must be exact: mp.jwt.verify.issuer is derived as ${SUPABASE_URL}/auth/v1,
           and a mismatch fails JWT verification with no obvious clue.

        1b. CONFIGURE SUPABASE AUTH FOR PRODUCTION (in the Supabase dashboard, not a secret).
            Registration with email confirmation depends on this, and the defaults are for local
            dev:
              - Auth -> URL Configuration: set Site URL and add the deployed URL to Redirect URLs.
                Otherwise confirmation and recovery email links redirect to http://localhost — the
                dev default — which is dead in production. (The backend handles a confirm-required
                signup: registration returns 202 and a "check your email" state rather than a
                session; but the link in that email must point at the deployed app.)
                Add every NATIVE scheme in AUTH_REDIRECT_URIS here too (e.g. zendemo://auth-callback).
                Both gates must pass and they fail differently: the backend refuses an unlisted
                target with 400 invalid_redirect, while GoTrue silently DROPS a target missing from
                this list and falls back to the Site URL — so the email arrives, the link opens the
                web app instead of the phone app, and nothing reports an error.
              - Auth -> SMTP Settings: configure a real SMTP sender. Supabase's built-in email is
                rate-limited to a few messages per hour on the free tier, so without custom SMTP,
                signups intermittently fail with a rate-limit error once that cap is hit. This is
                separate from the backend's own SMTP_* (which zen-email uses for welcome/retention
                mail); this one is Supabase sending the confirmation email itself.

        1c. THE LEAST-PRIVILEGE DATABASE ROLE (optional, and the only step here that cannot be
            automated from inside the repository). Skipping it leaves the deployment exactly as
            it was: the application keeps serving as the DDL role, and the deploy says so.

            R__identity_application_role.sql creates the role `zen_runtime` NOLOGIN and grants it
            what the application needs — DML on public, nothing on the auth schema, nothing on
            flyway_schema_history, no DDL. What the migration deliberately does NOT do is give it
            a password. A credential written into a migration is plaintext in git, readable by
            everyone who can read the repository, and rotated only by editing source. That is the
            whole of why this step is manual.

            Against the SESSION POOLER, as the DDL user, once:

              psql "postgresql://postgres.<ref>:<db-password>@<pooler-host>:5432/postgres" \
                -c "ALTER ROLE zen_runtime WITH LOGIN PASSWORD '<new-strong-password>'"

            Then store the credentials and redeploy:

              mk APP_DB_USERNAME "zen_runtime.<ref>"
              mk APP_DB_PASSWORD "<the same password>"

            THE USERNAME FORM. The pooler multiplexes projects and reads the tenant from the
            suffix after the last dot, which is why the DDL user is `postgres.<ref>` rather than
            `postgres` (see DB_URL above). The same form works for a custom role — MEASURED
            against a live Supabase project on 2026-08-04, where `zen_runtime.<ref>` connected and
            `current_user` answered `zen_runtime`. Prove it on YOUR project anyway; it costs one
            command and the failure modes below are all silent or misleading:

              psql "postgresql://zen_runtime.<ref>:<password>@<pooler-host>:5432/postgres" \
                -c "SELECT current_user, count(*) FROM users"

            Two things to read from that one command. `current_user` must say `zen_runtime` — if the
            pooler ignored the role and connected you as postgres, the split is not in effect
            and nothing else would tell you. And the count must MATCH what the DDL role sees: a
            zero on one side and not the other means row-level security matched nothing, which is
            the one failure in this area that looks like success (compare against the same query
            as postgres.<ref>; on an empty table, insert a row first or the comparison proves
            nothing). If instead you get "tenant/user not found", the pooler did not accept the
            role and the split cannot be done this way — do not work around it by switching
            DB_URL to the direct host, which resolves to IPv6 only while Cloud Run egress is IPv4
            (see DB_URL above). Report it and leave the split off.

            Rotation note: the DDL role's password and the runtime role's password are now two
            independent secrets. Rotating DB_PASSWORD no longer rotates the credential the
            application serves with, and vice versa.

            If you ever need to REMOVE the role, `DROP OWNED BY zen_runtime` is refused with
            "Only roles with privileges of role zen_runtime may drop objects owned by it" — even
            as the role that created it. PostgreSQL 16 gives a CREATEROLE creator membership with
            ADMIN but with inherit and set both off, so the DDL role may administer the runtime
            role without being able to act as it. That is the right default and worth keeping;
            the one-off escape is:

              GRANT zen_runtime TO current_user WITH SET TRUE, INHERIT TRUE;
              DROP POLICY users_application ON public.users;
              DROP OWNED BY zen_runtime; DROP ROLE zen_runtime;

        2. Let the runtime service account read those secrets. Without this the revision is
           created and then fails to start, because --set-secrets is resolved at boot.

             gcloud projects add-iam-policy-binding PROJECT --condition=None \
               --member="serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
               --role="roles/secretmanager.secretAccessor"

        3. Scheduled work. Jobs do not run until this exists, which means GDPR retention
           does not run either — the mechanism is proven (ADR-008) but nothing calls it.

        3a. Mint and store the trigger secret. The service is deployed
           allow-unauthenticated, so this header secret is what stands between the
           internet and the job that erases dormant personal data. The endpoint fails
           closed: with no secret configured it rejects every call.

             openssl rand -base64 32 | tr -d '\n' | \
               gcloud secrets create ZEN_JOBS_TRIGGER_TOKEN --data-file=- --project=PROJECT

        3b. Create the single scheduler entry. Hourly is ample: due-ness is computed from
           each job's own last_run_at, so the tick rate only bounds how soon a due job is
           noticed, never how often it runs.

             gcloud scheduler jobs create http zen-jobs-tick \
               --project=PROJECT --location=REGION \
               --schedule="0 * * * *" \
               --uri="https://SERVICE_URL/api/v1/jobs/trigger" \
               --http-method=POST \
               --headers="X-Zen-Job-Token=$(gcloud secrets versions access latest \
                 --secret=ZEN_JOBS_TRIGGER_TOKEN --project=PROJECT)"

           The flag is --headers on `create` and --update-headers on `update`; using the
           wrong one makes gcloud echo the token in its error message, which is how a
           secret ends up in a shell history or a terminal log. Reading it from Secret
           Manager inline, as above, keeps it off the command line either way.

        A missed tick is not a lost run: the next one sees a stale last_run_at and catches
        up. That is what makes GDPR retention a guarantee here rather than a hope.
    cmds:
      # First, before any build: a dirty tree makes the image tag a lie. This is cmd #1 so it
      # costs a second, not a native compile, to find out.
      - |
        set -eu
        if [ -z "{{.GIT_DIRTY}}" ]; then
          echo "Working tree clean; image will be tagged {{.GIT_SHA}}."
          exit 0
        fi
        if [ -z "${ALLOW_DIRTY:-}" ]; then
          echo "Refusing to deploy from a dirty working tree:"
          git status --short
          echo
          echo "The image is tagged with the short commit SHA ({{.GIT_SHA}}). Building from"
          echo "uncommitted changes would overwrite the image that tag already names, and a"
          echo "later rollback to {{.GIT_SHA}} would then ship bits no commit describes."
          echo
          echo "Commit or stash, or override deliberately with:"
          echo "    ALLOW_DIRTY=1 GCP_PROJECT={{.GCP_PROJECT}} task deploy:cloudrun"
          echo "which tags {{.GIT_SHA}}-dirty so the image never claims to be the commit."
          exit 1
        fi
        echo "ALLOW_DIRTY set: deploying uncommitted changes as {{.GIT_SHA}}{{.GIT_DIRTY}}."
        git status --short
      # Stage both frontends so the native image serves them same-origin with the API:
      # the Flutter web app at / and the react-admin panel at /admin/.
      - task: build:web
      - task: build:web:admin
      - task: build:server:native
      - |
        set -e
        IMAGE="{{.GCP_REGION}}-docker.pkg.dev/{{.GCP_PROJECT}}/{{.AR_REPO}}/{{.SERVICE_NAME}}:{{.GIT_SHA}}{{.GIT_DIRTY}}"
        docker buildx build --platform linux/amd64 \
          -f {{.DEMO_SERVER_DIR}}/src/main/docker/Dockerfile.native-micro \
          -t "$IMAGE" {{.DEMO_SERVER_DIR}}
        docker push "$IMAGE"
        # The least-privilege database role (ADR-031) is OPTIONAL and provisioned out of band,
        # so it is attached only when both of its secrets exist. Which branch was taken is
        # printed rather than assumed: a deploy that quietly kept serving as the owner because
        # a secret was misnamed is exactly the silent regression this whole wave is about.
        SECRETS="SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,CORS_ORIGINS=CORS_ORIGINS:latest,AUTH_REDIRECT_URI=AUTH_REDIRECT_URI:latest,AUTH_REDIRECT_URIS=AUTH_REDIRECT_URIS:latest,SITE_URL=SITE_URL:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USERNAME=SMTP_USERNAME:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,SMTP_FROM=SMTP_FROM:latest,ZEN_JOBS_TRIGGER_TOKEN=ZEN_JOBS_TRIGGER_TOKEN:latest"
        have_role=1
        for s in APP_DB_USERNAME APP_DB_PASSWORD; do
          gcloud secrets describe "$s" --project={{.GCP_PROJECT}} >/dev/null 2>&1 || have_role=0
        done
        if [ "$have_role" = "1" ]; then
          SECRETS="$SECRETS,APP_DB_USERNAME=APP_DB_USERNAME:latest,APP_DB_PASSWORD=APP_DB_PASSWORD:latest"
          echo "Database privilege split ON: the app will serve as the least-privilege role."
        else
          echo "Database privilege split OFF: APP_DB_USERNAME/APP_DB_PASSWORD are not both in"
          echo "Secret Manager, so the app serves as the DDL role. See summary step 1c."
        fi
        gcloud run deploy {{.SERVICE_NAME}} \
          --image="$IMAGE" \
          --project={{.GCP_PROJECT}} \
          --region={{.GCP_REGION}} \
          --memory={{.SERVICE_MEMORY}} \
          --cpu={{.SERVICE_CPU}} \
          --min-instances={{.SERVICE_MIN_INSTANCES}} \
          --max-instances={{.SERVICE_MAX_INSTANCES}} \
          --concurrency={{.SERVICE_CONCURRENCY}} \
          --timeout={{.SERVICE_TIMEOUT}} \
          --port=8080 \
          --allow-unauthenticated \
          --set-env-vars="^@^APPLINKS_ANDROID_PACKAGE=${APPLINKS_ANDROID_PACKAGE:-}@APPLINKS_ANDROID_FINGERPRINTS=${APPLINKS_ANDROID_FINGERPRINTS:-}@APPLINKS_APPLE_APP_IDS=${APPLINKS_APPLE_APP_IDS:-}" \
          --set-secrets="$SECRETS"

  destroy:cloudrun:
    desc: Tear down EVERYTHING the deploy created — GCP project, Supabase, local images. No leftovers.
    summary: |
      The complete inverse of deploy:cloudrun. It leaves nothing behind — not because a
      leftover costs money, but because cleaning up after yourself is the discipline. A
      teardown that leaves an empty project, a stale image, or a live Supabase project is the
      same defect as a swallowed failure: it looks done and is not.

      It removes THREE systems the deploy touched, and refuses to report success if it could
      not finish all three:

      1. THE ENTIRE GCP PROJECT — `gcloud projects delete`, not a resource-by-resource sweep.
         Deleting the project removes the Cloud Run service, the scheduler job, all fifteen
         secrets, the Artifact Registry repo, every IAM binding and enabled API, AND unlinks
         billing, in one atomic operation. An empty project left behind is exactly the "$0 so
         leave it" leftover this task exists to reject. It is recoverable for 30 days, which
         is the safety net.

      2. THE SUPABASE PROJECT — deleted via the Management API. This needs a credential the
         deploy never stored, so export SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account →
         Access Tokens). The project ref is read from the SUPABASE_URL secret before the GCP
         project is deleted; pass SUPABASE_REF to override, or SKIP_SUPABASE=1 only if it was
         already removed. Without the token the task deletes GCP and Docker, then FAILS,
         telling you Supabase is still live — it never claims a clean teardown it did not do.

      3. LOCAL DOCKER — the jZen images this workflow built or pulled (the Artifact Registry
         image and the test:native smoke image) and any smoke containers/networks. Shared
         public base images (postgres:17-alpine) are left, and named as left, because they are
         not ours to remove.

      MANUAL AND GUARDED. It refuses unless CONFIRM equals GCP_PROJECT, so a stray invocation
      or a wrong GCP_PROJECT deletes nothing:

        CONFIRM=my-project GCP_PROJECT=my-project SUPABASE_ACCESS_TOKEN=sbp_... task destroy:cloudrun

      NOT touched, and correctly so: the shared billing account (unlinked, not deleted — it
      bills other projects) and the gcloud docker credential helper entry in ~/.docker/config.json
      (keyed by the shared REGION-docker.pkg.dev host, used by every GCP project, not this one).
    cmds:
      - |
        set -eu
        : "${GCP_PROJECT:?set GCP_PROJECT}"
        if [ "${CONFIRM:-}" != "${GCP_PROJECT}" ]; then
          echo "Refusing to destroy. Re-run with CONFIRM set to the project name:"
          echo "  CONFIRM=${GCP_PROJECT} GCP_PROJECT=${GCP_PROJECT} task destroy:cloudrun"
          exit 1
        fi
        incomplete=0
        echo "Tearing down EVERYTHING for ${GCP_PROJECT}. Nothing is meant to remain."

        # --- Supabase ref must be read BEFORE the GCP project (and its secrets) are deleted.
        ref="${SUPABASE_REF:-}"
        if [ -z "$ref" ] && [ "${SKIP_SUPABASE:-0}" != "1" ]; then
          url=$(gcloud secrets versions access latest --secret=SUPABASE_URL \
                  --project="${GCP_PROJECT}" 2>/dev/null || true)
          # https://<ref>.supabase.co -> <ref>
          ref=$(printf '%s' "$url" | sed -n 's#https\{0,1\}://\([^.]*\)\.supabase\.co.*#\1#p')
        fi

        # --- 1. Supabase project (while its ref/token are still available).
        if [ "${SKIP_SUPABASE:-0}" = "1" ]; then
          echo "  Supabase: SKIP_SUPABASE=1, assuming already removed."
        elif [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
          echo "  Supabase: NO SUPABASE_ACCESS_TOKEN — cannot delete project '${ref:-?}'. Still live."
          incomplete=1
        elif [ -z "$ref" ]; then
          echo "  Supabase: could not determine project ref. Pass SUPABASE_REF=... Still live."
          incomplete=1
        else
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                   "https://api.supabase.com/v1/projects/${ref}")
          case "$code" in
            2*) echo "  deleted Supabase project ${ref}" ;;
            404) echo "  Supabase project ${ref} already gone" ;;
            *)  echo "  Supabase: DELETE ${ref} returned HTTP ${code}. Still live."; incomplete=1 ;;
          esac
        fi

        # --- 2. The whole GCP project: one atomic delete, takes everything with it.
        if gcloud projects describe "${GCP_PROJECT}" >/dev/null 2>&1; then
          gcloud projects delete "${GCP_PROJECT}" --quiet \
            && echo "  deleted GCP project ${GCP_PROJECT} (service, scheduler, 14 secrets, registry, IAM, APIs; billing unlinked)" \
            || { echo "  FAILED to delete GCP project ${GCP_PROJECT}."; incomplete=1; }
        else
          echo "  GCP project ${GCP_PROJECT} already gone."
        fi

        # --- 3. Local Docker: our images, plus any smoke leftovers. Not shared base images.
        img="{{.GCP_REGION}}-docker.pkg.dev/${GCP_PROJECT}/{{.AR_REPO}}/{{.SERVICE_NAME}}"
        docker rm -f zen-smoke-app zen-smoke-db >/dev/null 2>&1 || true
        docker network rm zen-smoke-net zen-smoke >/dev/null 2>&1 || true
        removed=$(docker images --format '{{"{{"}}.Repository{{"}}"}}:{{"{{"}}.Tag{{"}}"}}' \
                    | grep -E "^(${img}|zen-native-smoke):" || true)
        if [ -n "$removed" ]; then
          echo "$removed" | xargs -r docker rmi -f >/dev/null 2>&1 || true
          echo "  removed local images:"; echo "$removed" | sed 's/^/    /'
        else
          echo "  no local jZen images to remove."
        fi
        echo "  left in place (shared base image, not ours): postgres:17-alpine"

        echo
        if [ "$incomplete" -eq 0 ]; then
          echo "Teardown complete. GCP project, Supabase project, and local images all removed."
        else
          echo "TEARDOWN INCOMPLETE — see the lines above. Something is still live; finish it, then re-run."
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # Housekeeping
  # ---------------------------------------------------------------------------
  format:
    desc: Format all sources
    summary: |
      Formats the Dart workspace and both TypeScript surfaces. It propagates every exit
      code (STANDARDS "Orchestration"): the prettier calls previously ended in `|| true`,
      which hid the fact that prettier was never a declared dependency — the task reported
      success while formatting no TypeScript at all, for as long as it has existed.

      BOTH toolchains must be kept off the tracked generated files, for the same reason and
      by different means. `zen_demo_admin` carries a `.prettierignore` for
      `schema.generated.ts`; Dart has no such file and `dart format` ignores the
      `analyzer: exclude:` block (that governs analysis, not formatting), so the generated
      protobuf is excluded by the find below. Format either of them and the next
      regeneration re-emits the generator's own layout, so `sync:contracts` reports drift.

      Line width is declared per workspace in `analysis_options.yaml` (`formatter:
      page_width: 100`), not passed here, so an IDE format-on-save agrees with this task.
    cmds:
      - cd {{.CLIENT_DIR}} && {{.DART_FORMAT}}
      - cd {{.APPS_DIR}} && {{.DART_FORMAT}}
      - cd {{.ADMIN_DIR}} && pnpm exec prettier --write "src/**/*.{ts,tsx}"
      - cd {{.DEMO_ADMIN_DIR}} && pnpm exec prettier --write "src/**/*.{ts,tsx}"

  clean:
    desc: Remove all build output
    cmds:
      - cd {{.SERVER_DIR}} && ./mvnw -B -q clean
      - rm -rf {{.ADMIN_DIR}}/dist {{.ADMIN_DIR}}/node_modules/.vite
      - rm -rf {{.DEMO_ADMIN_DIR}}/dist {{.DEMO_ADMIN_DIR}}/node_modules/.vite
      - find . -name .dart_tool -type d -prune -exec rm -rf {} +

  verify:boundaries:
    desc: Fail if a client package reaches past the jZen backend (e.g. straight to Supabase)
    silent: true
    summary: |
      Enforces the rule in STANDARDS "The client talks to one server": every client request goes
      to the jZen backend, and NOTHING on the client speaks to the identity provider directly.

      WHY THIS IS A GATE AND NOT A CONVENTION. Adding `supabase_flutter` to a Flutter app is the
      single most natural thing a developer can do here, every tutorial does it, and it would
      work — the app would authenticate, and every test would still pass. What it would quietly
      destroy is the property the whole backend depends on: that the server is the only place a
      session is minted, the only holder of the provider's credentials, and the only enforcement
      point for roles (which are read from the `users` table, not the JWT). A second door into
      the identity provider does not fail loudly; it just means half the rules stop applying to
      whoever walks through it.

      The naming makes it likelier, not less: `SupabaseIdentityRepository` is named for the
      provider standing behind the backend, and reads like a class that ought to call it.

      Three checks, textual so they cost nothing to run. They live in
      `scripts/verify-boundaries.py` — reading source and returning a verdict is Python's side of
      the line in STANDARDS "Scripting" — and `task test:scripts` covers them with fixture tests
      that plant each violation and assert it is caught. That is what keeps the gate itself
      honest; the previous sh implementation could not make that assertion about itself.

        A. No client or app package may depend on a provider SDK (supabase, gotrue, postgrest,
           realtime/storage/functions clients).
        B. No client library source may name a provider host or credential (`supabase.co`, the
           local `:54321`, `apikey`, `anon_key`, `service_role`, `SUPABASE_URL`, `SUPABASE_KEY`).
           The anon key is public by design, which is exactly why its absence has to be checked:
           shipping it is harmless-looking and is how the second door gets built.
        C. No absolute URL literal in client library code, except the one compile-time base URL
           (`zen_identity_config.dart`, and `config.ts` on the TypeScript side). Comments and
           generated code are exempt; tests are too, since a test server's URL is not a call the
           product makes.

      THE ADMIN PANEL IS A CLIENT. Scope is `client/*/lib` and `apps/*/*/lib` for Dart, and
      `admin/src` and `apps/*/*_admin/src` for TypeScript. Covering only Dart read as a statement
      that the rule was about Flutter, and it is not: react-admin is a browser application holding
      a session cookie, and `@supabase/supabase-js` is one `pnpm add` away and better documented
      than the Dart SDK. A panel that talked to the provider directly would break the same
      property in the same silent way — roles are resolved from the `users` table on the server,
      and nothing that bypasses the server gets them.

      Two TypeScript-specific exemptions, both deliberate:
        - `apps/*/*_admin/src/api/schema.generated.ts` is generated from the backend's own
          OpenAPI document. It is the Dart `/generated/` exclusion by another name, and a
          hand-edit there is already a defect the contract-sync gate catches.
        - `apps/*/*_admin/src/config.ts` is the TypeScript analogue of `zen_identity_config.dart`:
          the one place allowed to name the API base. It resolves to the relative `/api/v1` today,
          so check C would pass without the exemption — it is here because the exemption belongs
          to the file's role, not to what the file currently happens to contain.

      The SERVER is where the provider is reached — `SupabaseAuthClient`,
      `@RegisterRestClient(configKey = "supabase-auth")` — and it is meant to be the only place.

      A scope that matches NOTHING is a failure, not a pass. Renaming a directory under
      `client/`, or the admin panel moving out of `admin/src`, used to leave a scan empty —
      which read as a clean repository and reported green forever.
    cmds:
      - scripts/verify-boundaries.py

  verify:docs:
    desc: Fail if a README names a non-existent task, or a module LICENSE drifted from root
    silent: true
    summary: |
      The documentation drift gate (ROADMAP step 9, DECISIONS.md ADR-012). Prose has no
      compiler and no contract-sync, so two things a README carries can rot silently, and this
      task checks the two that are mechanically checkable:

        1. Every `task <name>` a README mentions must exist in `task --list`. This is what would
           have caught a README promising `task run:all` brings up more than it does. Only
           commands are checked - inline-code spans and code-fence command lines - so a bare
           `task` in prose or a flag like `task --list` is skipped.
        2. Every module LICENSE (the copies beside each pubspec/pom, git ls-files '*/LICENSE')
           must be byte-identical to the root LICENSE. A licence that differs from the one it
           claims to be is a legal defect, and sixteen copies of a 190-line file is a drift
           surface a diff closes for free.

      Unlike the step-8 standalone check (a terminal one-shot, reverted once its failure mode
      stopped occurring), README and LICENSE drift START the moment those files exist and keep
      recurring, so this ships as a standing gate. Wire it into CI beside sync:contracts.
    cmds:
      - |
        # No `pipefail`: the membership test below is `printf | grep -q`, and a matching grep
        # closes the pipe early, so pipefail would turn printf's harmless EPIPE into a failure.
        set -u
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Not a git repository, cannot verify docs."; exit 1
        fi

        # NO_COLOR plus an ANSI strip: `task --list` colorizes when it thinks it has a terminal,
        # and a colorized line does not match the parse below. Depending on TTY detection would
        # make this gate pass or fail by accident, so both defences are applied.
        valid=$(NO_COLOR=1 task --list 2>/dev/null \
          | sed -E 's/\x1b\[[0-9;]*m//g' \
          | sed -nE 's/^\* ([a-z0-9:_-]+):.*/\1/p' | sort -u)
        if [ -z "$valid" ]; then
          echo "Could not read the task list; refusing to pass vacuously."; exit 1
        fi
        fail=0

        # A literal backtick would be command substitution to the task interpreter, so the
        # inline-code delimiter is built with printf rather than written into the pattern.
        bt=$(printf '\140')

        echo "Checking task references in READMEs..."
        for md in $(git ls-files '*README.md'); do
          refs=$( { grep -oE "${bt}task +[a-z][a-z0-9:_ -]*${bt}" "$md" 2>/dev/null | tr -d "${bt}"
                    grep -oE '^ *task +[a-z][a-z0-9:_ -]*' "$md" 2>/dev/null
                  } | sed -E 's/^ *task +//' )
          for name in $refs; do
            case "$name" in -*) continue ;; esac
            if ! printf '%s\n' "$valid" | grep -qxF "$name"; then
              echo "  MISSING: '$md' references 'task $name', not in 'task --list'"
              fail=1
            fi
          done
        done
        [ "$fail" -eq 0 ] && echo "  All README task references resolve."

        echo "Checking LICENSE copies..."
        count=0
        for lic in $(git ls-files '*/LICENSE'); do
          if diff -q LICENSE "$lic" >/dev/null 2>&1; then
            count=$((count + 1))
          else
            echo "  DRIFTED: '$lic' differs from the root LICENSE"; fail=1
          fi
        done
        [ "$fail" -eq 0 ] && echo "  All $count module LICENSE copies are byte-identical to root."

        [ "$fail" -eq 0 ] && echo "Docs verified." || { echo "Docs verification FAILED."; exit 1; }
