# jZen backend configuration.
#
# Profiles use %dev/%test/%prod prefixes in a single file.

# ---------------------------------------------------------------------------
# Supabase
# ---------------------------------------------------------------------------
supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
supabase.key=${SUPABASE_KEY:}
supabase.default-role=${SUPABASE_DEFAULT_ROLE:authenticated}

site.url=${SITE_URL:http://localhost:8080}
auth.redirect-uri=${AUTH_REDIRECT_URI:http://localhost:8080/auth/callback}
# Additional return addresses an email link may be sent to, comma-separated, beyond the default
# above (which is always permitted). One backend serves every client an app has, and a native
# build is not reachable at the web app's URL, so it asks for its own scheme -- e.g.
# zendemo://auth-callback. Matching is EXACT and the list is empty by default: an unchecked
# return address would let anyone have a live session token mailed to a destination they control.
# Each entry must also be registered in the Supabase project's Redirect URLs, or GoTrue drops it.
auth.redirect-uris=${AUTH_REDIRECT_URIS:}

# App Links / Universal Links: the association files at /.well-known that let the OS verify an
# https:// link belongs to this app, so an email link opens the app instead of a custom scheme any
# other app could also register (RFC 8252 §8.6). Empty by default and the endpoints 404 until set —
# an association file that is present but does not name the app teaches the platform that
# verification FAILED, and both Android and iOS cache that. See WellKnownResource.
#
# Android needs every signing certificate that will run: a debug keystore and a release key sign
# different builds of the same application, and a build signed by an unlisted key fails silently.
auth.applinks.android-package=${APPLINKS_ANDROID_PACKAGE:}
auth.applinks.android-fingerprints=${APPLINKS_ANDROID_FINGERPRINTS:}
# <TeamID>.<bundle-id>. Requires a paid Apple Developer Program membership, because the app side
# needs the Associated Domains capability, which free provisioning does not grant.
auth.applinks.apple-app-ids=${APPLINKS_APPLE_APP_IDS:}

# ---------------------------------------------------------------------------
# Datasource - local Supabase Postgres (supabase/config.toml, db port 54322)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# min-size=1, and the measurement that justifies it is the CONNECTION COUNT, not boot time.
# Locally a second eager connection costs ~12 ms -- noise, and re-timing a local boot will make
# this look pointless. In production every connection is a TCP + TLS + SCRAM handshake to the
# Supabase pooler in Ireland, measured at ~332 ms, paid on every cold start under
# --min-instances=0. The pool still grows to max-size on demand; this only stops it opening a
# second connection before anything has asked for one.
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10
# URL/credentials are set only in %dev and %prod. %test deliberately leaves them unset
# so Quarkus Dev Services provisions a clean throwaway Postgres per run (Docker) --
# otherwise it would connect to whatever sits on the configured port, which on this
# machine may be a leftover DB carrying an unrelated Flyway history.
#
# Two roles, one database. DB_USERNAME/DB_PASSWORD is the DDL role -- it owns the schema and is
# what Flyway connects as (see the Flyway block below). APP_DB_USERNAME/APP_DB_PASSWORD is the
# least-privilege role the application serves traffic as: no DDL, no auth schema, no Flyway
# history (V3__application_role.sql, ADR-031).
#
# APP_DB_* falls back to DB_* when unset, so a deployment that has not provisioned the role yet
# behaves exactly as it did before. That is deliberate: the role needs a password, a migration
# cannot carry one, and so the split cannot complete without an operator. deploy:cloudrun's
# summary step 1c has the commands. The fallback is the honest default rather than the safe one,
# and the reason it is acceptable is that the alternative -- refusing to boot -- would break a
# deploy on config the deploy itself cannot supply.
%dev.quarkus.datasource.username=${APP_DB_USERNAME:${DB_USERNAME:postgres}}
%dev.quarkus.datasource.password=${APP_DB_PASSWORD:${DB_PASSWORD:postgres}}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
%prod.quarkus.datasource.username=${APP_DB_USERNAME:${DB_USERNAME}}
%prod.quarkus.datasource.password=${APP_DB_PASSWORD:${DB_PASSWORD}}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
# jZen starts from an empty schema, so baseline-on-migrate and validate-on-migrate=false
# are deliberately NOT set: they exist to tolerate a pre-existing hand-built schema, and
# on a greenfield database they would silently disable migration validation.
quarkus.flyway.locations=db/migration
#
# WHEN FLYWAY RUNS IS PER PROFILE, AND %prod IS THE ODD ONE OUT (ADR-038).
#
# %dev and %test migrate at boot, and must keep doing so. Dev Services provisions a throwaway
# Postgres per test run, so "migrate at start" is the only thing that ever creates its schema, and
# task test:e2e depends on it. Nothing is saved by changing them: the database is a sibling
# container ~0.1 ms away.
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true
#
# %prod neither migrates NOR validates at start. Measured on the live service: the two phases
# together were 41 of the boot's 53 database round trips and 2 of its 4 connections -- ~2,100 ms of
# EVERY cold start, and under --min-instances=0 the container is replaced around two dozen times a
# day. Validation is ~80% of that, so this is not a relocation of the boot-time agreement check
# between binary and schema: it is the end of it. What replaces it is a deploy that migrates before
# it deploys, and refuses to deploy an image whose migrations are behind the database --
# zen.identity.schema.MigrateOnlyRunner, run as a one-shot Cloud Run Job by deploy:cloudrun with
# the DDL credentials.
#
# The consequence to hold on to: a %prod process now assumes its schema is already there. If a
# deploy ever ran in the wrong order, UserRoleLoader's to_regclass latch is the only thing between
# that and a confusing failure.
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.validate-at-start=false
# Flyway keeps its own connection, on the DDL role, because migrating and serving are different
# privileges and the application no longer holds the first one. All three properties have to be
# set together -- Quarkus only opens a separate Flyway connection when jdbc-url is present, and
# then takes username/password from here rather than from the datasource. %test sets none of
# them, so Flyway shares the Dev Services datasource as before.
%dev.quarkus.flyway.jdbc-url=${DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
%dev.quarkus.flyway.username=${DB_USERNAME:postgres}
%dev.quarkus.flyway.password=${DB_PASSWORD:postgres}
%prod.quarkus.flyway.jdbc-url=${DB_URL}
%prod.quarkus.flyway.username=${DB_USERNAME}
%prod.quarkus.flyway.password=${DB_PASSWORD}
# In %prod this connection is now opened by the migration job and by nothing else, which is how
# ADR-031's separate Flyway connection leaves the serving boot altogether -- two of the four
# connections a cold start used to make, gone as a side effect rather than by reversing the
# privilege split.
#
# THE MIGRATION JOB'S OWN SWITCHES, set per invocation and never in a profile:
#   ZEN_MIGRATE_ONLY=true            migrate, then terminate; do not serve
#   QUARKUS_HTTP_HOST_ENABLED=false  and do not bind a port while doing it
#   ZEN_ALLOW_SCHEMA_ROLLBACK=true   proceed even though the database is ahead of this image
# Both of the first two are set by `task deploy:cloudrun` and by the same sequence in
# `task test:native`; the third is the deliberate override behind ALLOW_SCHEMA_ROLLBACK=1.

# ---------------------------------------------------------------------------
# Supabase auth REST client
# ---------------------------------------------------------------------------
quarkus.rest-client.supabase-auth.url=${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1
quarkus.rest-client.supabase-auth.connect-timeout=2000
quarkus.rest-client.supabase-auth.read-timeout=2000

# ---------------------------------------------------------------------------
# JWT - Supabase JWKS, ES256
# ---------------------------------------------------------------------------
mp.jwt.verify.publickey.location=${SUPABASE_JWKS_URL:${supabase.url}/auth/v1/.well-known/jwks.json}
mp.jwt.verify.issuer=${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1
smallrye.jwt.verify.algorithm=ES256
smallrye.jwt.jwks.cache-time-to-live=10800
smallrye.jwt.jwks.refresh-interval=3600

# jZen serves Cloud Run directly, with no cookie-stripping CDN in front, so the access
# token lives in a normally-named cookie that SmallRye JWT parses on its own and proactive
# auth can stay on. An edge that strips cookies by name would break this: recovering would
# mean packing the tokens into whatever single cookie survives, plus a filter to unpack
# them, plus proactive=false so login and register are not 401'd before it runs. See
# docs/architecture/STANDARDS.md "Deployment model".
# mp.jwt.token.header=Cookie switches SmallRye JWT from the default Authorization header to the
# session cookie; mp.jwt.token.cookie then names it. Without the header line SmallRye keeps
# reading Authorization and never sees the cookie (so every cookie-authenticated request looks
# anonymous). Both are required together.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=zen_access_token
quarkus.http.auth.proactive=true

session.cookie.name=zen_access_token
session.cookie.refresh-name=zen_refresh_token
session.cookie.secure=${SESSION_COOKIE_SECURE:true}
%dev.session.cookie.secure=false
%test.session.cookie.secure=false

# ---------------------------------------------------------------------------
# Transport - dual-mode negotiation seam
# ---------------------------------------------------------------------------
# The client half of this seam is zen_transport's ZenTransportFormat; keep the two in step.
zen.transport.header=X-Zen-Transport
zen.transport.default-format=json

# ---------------------------------------------------------------------------
# OpenAPI - see STANDARDS.md "OpenAPI and the REST surface" for the static-merge strategy
# ---------------------------------------------------------------------------
# EXPECTED, and not a misconfiguration: the native build logs
#
#   WARN  Unrecognized configuration key "quarkus.smallrye-openapi.path" was provided
#   WARN  Unrecognized configuration key "quarkus.smallrye-openapi.store-schema-directory"
#
# because quarkus-smallrye-openapi is deliberately absent from it. The extension is build tooling
# and lives in this module's `openapi` Maven profile, which is active unless -Dnative is passed
# (SECURITY-REMEDIATION F15) - so /openapi is served by every ordinary build and by nothing that
# ships. The two keys stay here rather than moving to the profile because a @QuarkusTest reads
# this file and does NOT read the Maven plugin's configuration: move `path` and OpenApiProfileTest
# starts probing /q/openapi, which is the default and not what this application serves.
#
# Two accurate, self-describing lines at boot is the price, and it is the honest one to pay:
# silencing them means lowering the io.quarkus.config logger, which would also hide a genuine typo
# in any other key.
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.store-schema-directory=target/openapi
mp.openapi.extensions.smallrye.info.title=jZen API
mp.openapi.extensions.smallrye.info.version=0.1.0

# ---------------------------------------------------------------------------
# Health - /q/health is unauthenticated and NOT what Cloud Run probes
# ---------------------------------------------------------------------------
# Confirmed by control-plane read (SECURITY-ARCHITECTURE-REVIEW.md F14): Cloud Run's startup
# probe is a plain tcpSocket check on :8080, and no livenessProbe is configured at all - neither
# probe ever names a path, so /q/health has no consumer in the deployed system. Left enabled it
# names the SmallRye check set and the datasource's UP/DOWN status to anyone, unauthenticated -
# a small information-disclosure surface for zero operational benefit. quarkus.smallrye-health
# stays out of %prod; %dev/%test keep it, since it is a useful local liveness signal and this
# key is build-time (SRHTH... / Quarkus config source), read from THIS profile-scoped line at
# native-image build time, which always builds with %prod active.
%prod.quarkus.smallrye-health.enabled=false

# ---------------------------------------------------------------------------
# HTTP / CORS
# ---------------------------------------------------------------------------
# @QuarkusTest binds a port, and Quarkus's default for it is 8081 -- a number every Quarkus
# project on a machine picks, so a second one running anywhere fails this app's whole backend
# suite with "Port already bound: 8081" and nothing about the failure says it is environmental.
# 0 asks the OS for a free port and Quarkus points RestAssured at whatever it got, so the suite
# no longer depends on what else is running. Test-mode only: it does not affect %dev (8080) or
# test:e2e, which drives a real server on ZEN_APP_PORT.
quarkus.http.test-port=0

quarkus.http.enable-compression=true
# The compressed set is stated EXPLICITLY because the default one is exactly wrong for this
# application. Measured on the wire: the default omits application/wasm, so main.dart.wasm --
# 2,488,178 bytes, fetched by every visitor before the app can start -- was sent whole, and
# gzip takes it to ~910,000. It also compressed application/x-protobuf, whose responses are
# already binary and small: a 28-byte /api/v1/health answer came back at 55 bytes, +96%.
#
# application/x-protobuf is absent below, and on a protobuf-only endpoint that is what stops it
# being compressed. It does NOT stop it on the dual-format resources, and the reason is worth
# knowing before someone reads a gzipped protobuf response as this property failing:
# ResteasyReactiveCompressionHandler decides before the response content type exists, so it
# falls back to the FIRST value of the method's @Produces -- application/json for every
# @Produces({APPLICATION_JSON, PROTOBUF}) resource here. Measured both ways: with
# application/json in this list a protobuf response is gzipped; with it removed, neither format
# is. So by configuration alone the two formats cannot be separated, and JSON compression is
# worth far more than the +27 bytes protobuf loses. Separating them needs the response path to
# say Content-Encoding: identity when protobuf is negotiated, which is code, not this file.
#
# The text types below are not copied from documentation. They are the set this server was
# measured compressing before this property existed (GET with Accept-Encoding: gzip, reading
# content-encoding back; HEAD answers nothing useful here -- it returns text/html for every
# path). Dropping one silently stops compressing HTML or JS, which nothing else would catch,
# so add to this list rather than rewrite it. verify:endpoints asserts the wasm end of it.
quarkus.http.compress-media-types=text/html,text/plain,text/xml,text/css,text/javascript,application/javascript,application/json,application/graphql+json,application/xhtml+xml,application/wasm
quarkus.http.limits.max-body-size=1M

# How long a connection may sit idle before the server closes it. Quarkus defaults to THIRTY
# MINUTES, which is a half-hour of held file descriptors and TLS state per connection for a
# caller who has stopped speaking. Nothing in this application legitimately idles that long.
# 60s matches the Cloud Run request timeout (Taskfile SERVICE_TIMEOUT), so the two
# bounds agree instead of one quietly outliving the other. A browser or Dart client whose
# keep-alive connection is closed simply opens a new one; this is ordinary HTTP.
quarkus.http.idle-timeout=60s
# The idle timeout counts WebSocket connections too, and a socket that is merely quiet is not
# a socket that is gone, so without this an open /api/v1/demo/ws would be dropped after a
# minute of silence with no error anywhere. A server-sent ping every 30s is traffic on the
# connection, which resets the idle clock. The two settings must be changed together: raising
# the ping interval above the idle timeout re-breaks the socket.
quarkus.websockets-next.server.auto-ping-interval=30s
# Frame and message ceilings. Siblings of the ping interval above, and set for a different reason:
# quarkus.http.limits.max-body-size bounds HTTP bodies and does NOT apply to WebSocket frames, so
# without these an open socket accepted an arbitrarily large frame that Netty buffers in memory on
# a 256Mi instance - one connection, no credential needed beyond the handshake, no rate limit
# reachable (the limiter is a JAX-RS filter and the socket bypasses JAX-RS after the upgrade).
# 64KiB is two orders of magnitude above what jZen's own frames need: DemoWebSocket exchanges a
# WebSocketMessage, which is two short strings. max-message-size bounds a fragmented message
# reassembled from several frames, so setting only max-frame-size would leave the same hole open
# one frame at a time. Do not change one without the other.
quarkus.websockets-next.server.max-frame-size=65536
quarkus.websockets-next.server.max-message-size=65536

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Zen-Transport,X-Request-ID,X-CSRF-Token
# Content-Range/Accept-Ranges are exposed so a cross-origin react-admin panel can read the
# total row count from the list endpoints (the ra-data-simple-rest pagination convention).
quarkus.http.cors.exposed-headers=Location,Link,X-Zen-Transport,X-Request-ID,Content-Range,Accept-Ranges
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600

# ---------------------------------------------------------------------------
# Native image resources - the demo reads its localized terms Markdown from the
# classpath (DemoResource), so it must be embedded in the native binary. (The ping
# messages are a typed Qute @MessageBundle, handled by the Qute extension.)
# ---------------------------------------------------------------------------
quarkus.native.resources.includes=terms/*.md

# ---------------------------------------------------------------------------
# Mailer - stock quarkus-mailer SMTP. Brevo is just an SMTP host (SMTP_HOST=
# smtp-relay.brevo.com); nothing below is provider-specific.
# ---------------------------------------------------------------------------
quarkus.mailer.mock=true
# The sender is needed in every profile: the mock mailer still builds a real Mail, and
# EmailService would fail rendering-to-send with no From address.
quarkus.mailer.from=${SMTP_FROM:noreply@jzen.dev}
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.host=${SMTP_HOST}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USERNAME}
%prod.quarkus.mailer.password=${SMTP_PASSWORD}
%prod.quarkus.mailer.start-tls=REQUIRED

# ---------------------------------------------------------------------------
# Data retention (zen-identity UserRetentionJob, GDPR Art. 5(1)(e))
# ---------------------------------------------------------------------------
# There is no retention cron here any more (ROADMAP step 7a, DECISIONS ADR-008). The cycle is
# registered as a zen-jobs ZenJob by zen.demo.jobs.UserRetentionZenJob and runs when the job
# trigger below says it is due - which is what makes it fire in production, where an in-process
# @Scheduled provably could not. The retention windows keep the framework defaults (330/23/7 days).

# ---------------------------------------------------------------------------
# Jobs (zen-jobs) - guaranteed scheduled work
# ---------------------------------------------------------------------------
# The shared secret POST /api/v1/jobs/trigger requires. The framework declares no default at all,
# so an unconfigured deployment rejects every trigger rather than accepting every trigger.
#
# %dev and %test use a fixed local value: neither ever leaves this machine, and a literal here is
# what lets `task test:e2e` and a manual curl exercise the real credential path (the same reasoning
# as %dev.session.cookie.secure=false above). %prod takes it from Secret Manager - see the
# ZEN_JOBS_TRIGGER_TOKEN entry in Taskfile deploy:cloudrun - and fails closed if it is absent.
%dev.zen.jobs.trigger.token=dev-job-trigger-token
%test.zen.jobs.trigger.token=test-job-trigger-token
%prod.zen.jobs.trigger.token=${ZEN_JOBS_TRIGGER_TOKEN:}

# The in-process tick, for local development only. It calls exactly the same JobScheduler.tick()
# the external trigger calls, so dev and prod exercise one code path and differ only in who pulls
# the trigger. Every minute is frequent enough to watch a job fire while working on it; the jobs
# themselves are still only run when their own interval says they are due.
%dev.zen.jobs.tick.cron=0 * * * * ?
# %test leaves it at the framework default of off: no tick may fire behind a test's back, since
# the job suites drive JobScheduler.tick() directly and assert exactly what ran.
# %prod likewise stays off - under --min-instances=0 there is no thread alive to fire it, which is
# the entire reason zen-jobs exists (STANDARDS "Deployment model").

# ---------------------------------------------------------------------------
# Rate limiting (zen-ratelimit) - see DECISIONS ADR-029
# ---------------------------------------------------------------------------
# The framework ships PRODUCTION limits as its defaults (zen-ratelimit's
# META-INF/microprofile-config.properties), so nothing is declared here for %prod except the one
# thing only a deployment can know: how many proxies sit in front of this process.
#
# Cloud Run is itself a proxy and its frontend APPENDS the real client address to whatever
# X-Forwarded-For the caller sent, so the trustworthy entry is the LAST one - hence 1 hop, paired
# with the proxy-address-forwarding settings in the %prod block below. Reading the header the
# conventional leftmost way would count attacker-supplied input and throttle nobody, silently.
# Putting an edge (a CDN, a load balancer) in front of Cloud Run CHANGES THIS NUMBER; see
# ADR-027 on why there is no edge today, and zen.ratelimit.ClientAddress for the arithmetic.
# RateLimitAddressGuard refuses to boot if this and proxy-address-forwarding disagree.
%prod.zen.ratelimit.forwarded-hops=1

# %dev and %test deliberately run LOOSER limits than production, and the reason is worth stating
# because the alternatives were all worse.
#
# A test suite drives hundreds of requests from 127.0.0.1 in a few seconds - AuthResourceTest
# alone makes about a dozen login and register calls - so production limits would turn the backend
# suite into a test of the limiter and would make it flaky besides. The dishonest fixes were
# available and are refused: deleting assertions, inserting sleeps, or exempting a path in
# production so a test passes. Configuring the limits per profile leaves production behaviour and
# every existing assertion intact.
#
# %dev additionally needs looser DURABLE limits for a reason %test does not have: %test gets a
# throwaway Dev Services database per run, while %dev (and `task test:e2e`, which boots this
# profile) points at the persistent local Supabase Postgres on 54322. An hour-scale counter there
# accumulates across every run in that hour, so production values would fail the gate on the
# eleventh consecutive run for reasons unrelated to the code under test.
#
# Enforcement is NOT taken on trust because of this: RateLimitEnforcementTest sets its own
# deliberately tiny limits via a @TestProfile and proves a real 429, and the library's own suites
# prove the arithmetic against a hand-advanced clock.
%dev.zen.ratelimit.global.burst-limit=10000
%dev.zen.ratelimit.auth.burst-limit=1000
%dev.zen.ratelimit.auth.durable-limit=10000
%dev.zen.ratelimit.job-trigger.burst-limit=1000
%dev.zen.ratelimit.job-trigger.durable-limit=10000
%test.zen.ratelimit.global.burst-limit=10000
%test.zen.ratelimit.auth.burst-limit=1000
%test.zen.ratelimit.auth.durable-limit=10000
%test.zen.ratelimit.job-trigger.burst-limit=1000
%test.zen.ratelimit.job-trigger.durable-limit=10000

# ---------------------------------------------------------------------------
# %dev
# ---------------------------------------------------------------------------
%dev.quarkus.devservices.enabled=false
%dev.quarkus.log.console.json=false
%dev.quarkus.log.category."zen".level=DEBUG

# ---------------------------------------------------------------------------
# %test
# ---------------------------------------------------------------------------
%test.quarkus.devservices.enabled=true
%test.quarkus.log.console.json=false

# ---------------------------------------------------------------------------
# %prod - Cloud Run
# ---------------------------------------------------------------------------
%prod.quarkus.log.console.json=true
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true
%prod.quarkus.http.ssl-port=0
%prod.auth.redirect-uri=${AUTH_REDIRECT_URI}

# ---------------------------------------------------------------------------
# Native build
# ---------------------------------------------------------------------------
# No additional native-image flags are needed: nothing in the dependency graph requires
# an --initialize-at-run-time entry.
quarkus.native.additional-build-args=
