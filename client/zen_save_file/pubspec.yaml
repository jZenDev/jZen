name: zen_save_file
description: >-
  "Save this data to a file the person chooses" on every platform a jZen application runs on: the
  system save sheet on iOS, Android and desktop, a download on the web. One call, no plugin named by
  the application.
publish_to: 'none'
# Lockstep with the product version, see docs/architecture/STANDARDS.md "Versioning".
version: 0.1.0

environment:
  sdk: ">=3.14.0 <4.0.0"

resolution: workspace

dependencies:
  # The save sheet is a plugin, which imports dart:ui. Its iOS and macOS side is a Swift package
  # (file_picker_darwin ships a Package.swift), so no runner needs a Podfile.
  file_picker: ^13.3.3
  # Never imported: the constraint is here to keep older releases out. Before 2.5.2, saveFile on iOS
  # left the saved bytes in the app's temporary directory after a save or a cancel, and every
  # file_picker we accept still admits those releases (^2.4.2), so raising its minimum would not do
  # this. test/file_picker_darwin_floor_test.dart fails if the floor is lowered.
  file_picker_darwin: ^2.5.2
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
