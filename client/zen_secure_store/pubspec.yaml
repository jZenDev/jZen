name: zen_secure_store
description: >-
  Keystore-backed TokenStore for the jZen client: the platform secure storage implementation of
  zen_transport's persistence port, kept out of that package because it drags in dart:ui.
publish_to: 'none'
# Lockstep with the product version, see docs/architecture/STANDARDS.md "Versioning".
version: 0.1.0

environment:
  sdk: ">=3.10.3 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The whole reason this package exists. It reaches Keychain (iOS/macOS) and Keystore-backed
  # storage (Android) through platform channels, so it imports package:flutter/services.dart and
  # therefore dart:ui -- which the Dart VM cannot compile, which is why zen_transport must not
  # depend on it. See zen_transport's TokenStore.
  #
  # 10.x IS A FLOOR, NOT A PREFERENCE. The 9.x web implementation imports dart:html and
  # dart:js_util, which dart2wasm cannot compile -- and jZen delivers the web app as WebAssembly
  # (ADR-016). It fails the whole `flutter build web --wasm`, and no guard in jZen's own code can
  # prevent it: Flutter generates web_plugin_registrant.dart, which imports EVERY web plugin in
  # the dependency graph whether the app calls it or not. A pubspec dependency is unconditional,
  # so the only fix is a version whose web implementation is Wasm-clean. 10.x uses package:web
  # and dart:js_interop. Do not relax this bound.
  flutter_secure_storage: ^10.3.1
  zen_transport:
    path: ../zen_transport

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
