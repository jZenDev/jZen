name: zen_secure_store
description: >-
  Keystore-backed TokenStore for the jZen client: the platform secure storage implementation of
  zen_transport's persistence port, kept out of that package because it drags in dart:ui.
publish_to: 'none'
# Lockstep with the product version, see docs/architecture/STANDARDS.md "Versioning".
version: 0.1.0

environment:
  sdk: ">=3.10.3 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The whole reason this package exists. It reaches Keychain (iOS/macOS) and Keystore-backed
  # storage (Android) through platform channels, so it imports package:flutter/services.dart and
  # therefore dart:ui -- which the Dart VM cannot compile, which is why zen_transport must not
  # depend on it. See zen_transport's TokenStore.
  flutter_secure_storage: ^9.2.2
  zen_transport:
    path: ../zen_transport

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
