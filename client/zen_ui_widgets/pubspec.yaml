name: zen_ui_widgets
description: Shared adaptive widgets for jZen - overlays, buttons, inputs and other chrome that is neither navigation nor identity.
# Lockstep with the product version - see docs/architecture/STANDARDS.md "Versioning".
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.10.3 <4.0.0"
  # showCupertinoSheet's `scrollableBuilder`; the older `builder` is deprecated.
  flutter: ">=3.40.0"

resolution: workspace

# zen_core supplies the compile-time platform constants. The few strings the controls speak
# themselves (validation errors, "Select a date") are typed and generated by `flutter gen-l10n`
# (DECISIONS.md ADR-009); an app that uses only showAdaptivePresentation needs no delegate.
dependencies:
  zen_core:
    path: ../zen_core
  flutter:
    sdk: flutter
  # Both are imported by the generated WidgetsLocalizations, and intl also supplies the locale's
  # decimal separator. intl is pinned to the version flutter_localizations itself pins, so an app
  # composing several localized jZen packages resolves one intl.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# `generate: true` is what lets `flutter gen-l10n` (and `flutter test`/`flutter build`) produce
# lib/src/l10n/generated from lib/src/l10n/*.arb - see l10n.yaml and `task generate:l10n`.
flutter:
  generate: true

topics:
  - adaptive
  - widgets
  - zen
  - flutter
