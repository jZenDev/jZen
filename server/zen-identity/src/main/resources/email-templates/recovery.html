<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your password</h1>
    <p>Continue to the application to choose a new password:</p>
    <p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next={{ .RedirectTo | urlquery }}">
        {{ .SiteURL }}/auth/confirm
      </a>
    </p>
    <p>If you did not request a password reset, you can ignore this message.</p>
  </body>
</html>
