# Framework defaults for zen-ratelimit. Shipped inside the jar at the standard MicroProfile config
# ordinal (100), so an application's own application.properties (ordinal 250) overrides any single
# value below without having to redeclare the rest.
#
# THESE ARE THE PRODUCTION VALUES. They are the defaults on purpose: a limiter an application has
# to remember to configure is one an application will forget to configure, and the failure is
# silent. An application that needs different numbers states them; an application that states
# nothing gets protection rather than an open door.

# On by default. See RateLimitConfig#enabled.
zen.ratelimit.enabled=true

# No trusted proxy by default, so X-Forwarded-For is ignored and the socket peer is counted.
# %prod sets 1, because Cloud Run's frontend appends the real client address to whatever the
# caller sent. Read ClientAddress before changing this; a wrong value silently blocks either
# everyone or no one, and RateLimitAddressGuard refuses to boot on the inconsistent pairings.
zen.ratelimit.forwarded-hops=0

# Durable rows are dropped this long after their window closes. Two days keeps yesterday's
# counters readable while investigating, and bounds the table without needing a size trigger.
zen.ratelimit.counter-retention=48h

# Ceiling on distinct addresses held in the burst tier. 100k entries is a few megabytes against a
# 256Mi instance; the behaviour at the ceiling is documented on BurstLimiter#note.
zen.ratelimit.max-tracked-subjects=100000

# --------------------------------------------------------------------------------------------
# GLOBAL - everything else under /api/. The denial-of-service bucket.
# --------------------------------------------------------------------------------------------
# 120/min is 2 req/s sustained from one address. Saturating all 200 concurrency slots at the 60s
# Cloud Run timeout costs about 3.3 req/s (ADR-027), so this sits below the rate that hurts and
# far above anything a human or a sanely-polling client produces. No durable tier: a database
# write on every read would make the limiter the most expensive part of the request.
zen.ratelimit.global.burst-limit=120
zen.ratelimit.global.burst-window=1m
zen.ratelimit.global.durable-limit=0
zen.ratelimit.global.durable-window=1h

# --------------------------------------------------------------------------------------------
# AUTH - login, register, restore-password, password, session, refresh.
# --------------------------------------------------------------------------------------------
# The credential-guessing surface. 10/min absorbs a person mistyping a password and a client
# retrying, and stops an online guessing loop dead. The durable 100/hour is what an attacker
# actually runs into: the burst window resets every minute, so without it 10/min is 600/hour
# forever, and under --min-instances=0 an hour-scale counter cannot be held in memory at all.
zen.ratelimit.auth.burst-limit=10
zen.ratelimit.auth.burst-window=1m
zen.ratelimit.auth.durable-limit=100
zen.ratelimit.auth.durable-window=1h

# --------------------------------------------------------------------------------------------
# JOB_TRIGGER - POST /api/v1/jobs/trigger. The highest-consequence endpoint jZen ships.
# --------------------------------------------------------------------------------------------
# A successful call runs retention: e-mail dispatch and account anonymisation. Its legitimate
# caller is ONE Cloud Scheduler entry, ONCE an hour, so these numbers are arithmetic rather than
# a compromise - 20/hour leaves an order of magnitude of headroom over the real caller (retries,
# a manual run, a clock skew) while making secret guessing pointless. Note the counter is charged
# on every call including the rejected ones, which is the point: it is the failures that are the
# attack.
zen.ratelimit.job-trigger.burst-limit=5
zen.ratelimit.job-trigger.burst-window=1m
zen.ratelimit.job-trigger.durable-limit=20
zen.ratelimit.job-trigger.durable-window=1h
