# The build stamp every static response is validated against (zen.transport.StaticCacheHeaders).
#
# It must change exactly when the served bytes can change, which is every build: the frontends are
# baked into the binary, so a new binary is the only way a static resource can differ. Nothing else
# in the repository carries such a value - the product version is 0.1.0-SNAPSHOT in lockstep
# (ADR-012) and version.json says 0.1.0, and neither moves per build - so this one is filtered in
# from ${maven.build.timestamp} at package time (an ISO instant; every
# character of it is legal inside an entity-tag, so it needs no reshaping).
#
# This is a DEFAULT, not a fixed value. It sits in a jar's microprofile-config.properties
# (ordinal 100), so the environment (ordinal 300) wins: deploy:cloudrun passes ZEN_BUILD_ID with
# the commit SHA that already tags the image, which is a better name for "these bytes" than a
# clock reading. Server config is runtime by design (CLAUDE.md), and this property is read by an
# ordinary runtime bean, so that override is honoured in the native binary too.
zen.build.id=${maven.build.timestamp}

# Default-deny for the whole JAX-RS surface (2026-08-13 architectural security review, F2).
#
# THE PROPERTY NAME IN THE REVIEW'S BRIEF WAS WRONG, AND THIS ONE IS THE CORRECTION.
# `quarkus.security.deny-unannotated-members` (io.quarkus.security.deployment.SecurityConfig)
# only denies a class's OTHER unannotated methods once at least one of its methods already
# carries a security annotation - "if enabled, in the following bean, methodB will be denied"
# is its own javadoc example, and it names a bean with an already-annotated methodA. A resource
# class where EVERY method is unannotated - HealthResource before this change, and the shape of
# the exact defect F2 describes ("the next endpoint that omits @RolesAllowed") - never trips that
# condition and stays wide open even with that property set to true. Confirmed by reading
# io.quarkus.security.deployment.DenyUnannotatedPredicate: it tests
# `!hasSecurityAnnotation(classInfo) && methods.stream().anyMatch(hasSecurityAnnotation)`, which
# is false for a class with zero annotated methods.
#
# `quarkus.security.jaxrs.deny-unannotated-endpoints` (JaxRsSecurityConfig, quarkus-rest) is the
# one that actually closes the gap: "if set to true, access to all JAX-RS resources will be
# denied by default" - no mix-of-annotations precondition. It supplies a DEFAULT security check
# only for a method that resolves no security check any other way, so a method or class carrying
# its own @PermitAll/@RolesAllowed/@Authenticated is completely unaffected - see
# ResteasyReactiveCommonProcessor#setUpDenyAllJaxRs. Verified experimentally against the app
# build, not just read from the deployment source: with this property set and HealthResource's
# @GET left unannotated, GET /api/v1/health returned 401; annotating it @PermitAll restored 200,
# and every already-annotated endpoint (login, register, the admin surface, etc.) was unaffected.
#
# BUILD_TIME, so it is baked into the served artifact rather than overridable at runtime -
# confirmed via quarkus-security-deployment's own config-doc model, which marks both properties
# above BUILD_TIME. It lives here, not in an application's own properties, so a second app
# inherits default-deny and only has to remember to annotate an endpoint it wants OPEN - the
# same asymmetry CsrfRules already gets right for CSRF (STANDARDS "Authorization (RBAC)").
quarkus.security.jaxrs.deny-unannotated-endpoints=true
