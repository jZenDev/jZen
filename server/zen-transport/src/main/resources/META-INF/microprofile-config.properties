# The build stamp every static response is validated against (zen.transport.StaticCacheHeaders).
#
# It must change exactly when the served bytes can change, which is every build: the frontends are
# baked into the binary, so a new binary is the only way a static resource can differ. Nothing else
# in the repository carries such a value - the product version is 0.1.0-SNAPSHOT in lockstep
# (ADR-012) and version.json says 0.1.0, and neither moves per build - so this one is filtered in
# from ${maven.build.timestamp} at package time (an ISO instant; every
# character of it is legal inside an entity-tag, so it needs no reshaping).
#
# This is a DEFAULT, not a fixed value. It sits in a jar's microprofile-config.properties
# (ordinal 100), so the environment (ordinal 300) wins: deploy:cloudrun passes ZEN_BUILD_ID with
# the commit SHA that already tags the image, which is a better name for "these bytes" than a
# clock reading. Server config is runtime by design (CLAUDE.md), and this property is read by an
# ordinary runtime bean, so that override is honoured in the native binary too.
zen.build.id=${maven.build.timestamp}
